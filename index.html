<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay — Surathkal, Mangaluru</title>

<style>

    /* =========================================================
       303 OYSTER BAY — HOME PAGE
       Responsive recreation of the approved artwork
       ========================================================= */

    :root {
        --sand: #d9ae73;
        --cream: #f8ecd7;
        --cream-soft: rgba(249, 238, 216, 0.94);
        --brown: #5b2d0c;
        --brown-dark: #472208;
        --gold: #9b5d16;
    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        overflow-x: hidden;
        background: var(--sand);
        color: var(--brown);
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .home-page {

        position: relative;

        width: 100%;
        max-width: 1200px;

        margin: 0 auto;

        min-height: 100vh;

        padding:
            clamp(28px, 4vw, 52px)
            clamp(24px, 5vw, 58px)
            clamp(34px, 5vw, 60px);

        background-image:
            url("sand-background.png");

        background-repeat: no-repeat;

        background-position:
            center top;

        background-size:
            cover;

        background-color: var(--sand);

        overflow: hidden;
    }


    /* =========================================================
       AIRBNB GUEST FAVOURITE
       ========================================================= */

    .guest-favourite {

        width: 100%;

        display: flex;
        justify-content: center;

        margin-bottom:
            clamp(16px, 2vw, 25px);
    }

    .guest-favourite img {

        display: block;

        width:
            clamp(105px, 14vw, 175px);

        height: auto;
    }


    /* =========================================================
       PROPERTY BRAND
       ========================================================= */

    .brand {

        width: 100%;

        display: flex;
        flex-direction: column;

        align-items: center;

        text-align: center;

        margin-bottom:
            clamp(18px, 2.5vw, 30px);
    }


    /*
     * logo.png is the existing 303 Oyster Bay logo asset.
     */

    .property-logo {

        display: block;

        width:
            clamp(280px, 49vw, 570px);

        max-width: 82%;

        height: auto;
    }


    /* =========================================================
       TAGLINE
       ========================================================= */

    .tagline {

        margin:
            clamp(12px, 1.7vw, 20px)
            0
            0;

        color: var(--brown);

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(20px, 2.8vw, 34px);

        font-style: italic;

        line-height: 1.1;

        letter-spacing:
            0.1px;
    }


    /* =========================================================
       PHOTO GRID
       ========================================================= */

    .photo-grid {

        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap:
            clamp(14px, 2vw, 24px);

        margin-top:
            clamp(28px, 3.5vw, 44px);
    }


    /* =========================================================
       PHOTO CARDS
       ========================================================= */

    .photo-card {

        position: relative;

        min-width: 0;

        overflow: hidden;

        border-radius:
            clamp(6px, 0.8vw, 10px);

        background: var(--cream);

        box-shadow:
            0 5px 16px rgba(70, 35, 5, 0.15);

        text-decoration: none;

        color: var(--brown);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }


    .photo-card:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 8px 22px rgba(70, 35, 5, 0.20);
    }


    .photo-image {

        width: 100%;

        aspect-ratio: 1.62 / 1;

        overflow: hidden;

        background: #c99b60;
    }


    .photo-image img {

        width: 100%;
        height: 100%;

        display: block;

        object-fit: cover;
    }


    /* =========================================================
       EXACT PHOTO CROPS
       ========================================================= */

    /*
     * Your Stay:
     * Uses the exact balcony composition from the approved artwork.
     */

    .stay-image img {

        object-position:
            center center;
    }


    /*
     * The Apartment:
     * Keeps the living room composition visible.
     */

    .apartment-image img {

        object-position:
            center center;
    }


    /*
     * Explore:
     * Lighthouse is deliberately positioned so the
     * FULL FOOT / BOAT FOREGROUND remains visible.
     */

    .explore-image img {

        object-position:
            center 58%;
    }


    /*
     * Gallery:
     * Keeps the building and surrounding palms visible.
     */

    .gallery-image img {

        object-position:
            center center;
    }


    /* =========================================================
       CARD CAPTION BAND
       ========================================================= */

    .card-caption {

        min-height:
            clamp(48px, 5.5vw, 68px);

        padding:
            8px
            clamp(14px, 2vw, 26px);

        display: flex;

        align-items: center;

        justify-content: center;

        position: relative;

        background:
            rgba(250, 242, 226, 0.96);
    }


    .card-title {

        margin: 0;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(22px, 3vw, 36px);

        font-weight: 400;

        line-height: 1;

        color: var(--brown);

        text-align: center;
    }


    .card-arrow {

        position: absolute;

        right:
            clamp(14px, 2vw, 25px);

        top: 50%;

        transform:
            translateY(-52%);

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(27px, 3vw, 38px);

        font-weight: 400;

        line-height: 1;

        color: var(--brown);
    }


    /* =========================================================
       FEATURES BAND
       ========================================================= */

    .features {

        width: 100%;

        margin-top:
            clamp(18px, 2vw, 25px);

        display: grid;

        grid-template-columns:
            repeat(5, minmax(0, 1fr));

        background:
            rgba(249, 235, 207, 0.94);

        border-radius:
            clamp(6px, 0.8vw, 10px);

        box-shadow:
            0 5px 15px rgba(70, 35, 5, 0.10);

        overflow: hidden;
    }


    .feature {

        min-width: 0;

        min-height:
            clamp(112px, 13vw, 155px);

        padding:
            clamp(12px, 1.5vw, 18px)
            clamp(5px, 1vw, 12px);

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        text-align: center;

        border-right:
            1px solid rgba(91, 45, 12, 0.50);
    }


    .feature:last-child {
        border-right: none;
    }


    /* =========================================================
       FEATURE ICONS
       ========================================================= */

    .feature-icon {

        width:
            clamp(34px, 4.5vw, 52px);

        height:
            clamp(34px, 4.5vw, 52px);

        margin-bottom:
            clamp(7px, 1vw, 12px);

        color: var(--brown);
    }


    .feature-icon svg {

        width: 100%;
        height: 100%;

        fill: none;

        stroke: currentColor;

        stroke-width: 2;

        stroke-linecap: round;

        stroke-linejoin: round;
    }


    /* =========================================================
       FEATURE TEXT
       ========================================================= */

    .feature-title {

        margin: 0;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(14px, 1.7vw, 22px);

        line-height:
            1.05;

        color: var(--brown);

        white-space: normal;
    }


    .feature-subtitle {

        margin:
            3px
            0
            0;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(12px, 1.4vw, 18px);

        font-style: italic;

        line-height: 1;

        color: var(--brown);
    }


    /* =========================================================
       CLOSING SCRIPT
       ========================================================= */

    .closing {

        width: 100%;

        display: flex;

        justify-content: center;

        align-items: center;

        margin-top:
            clamp(34px, 4.5vw, 58px);

        padding:
            0 4%;
    }


    .closing-text {

        position: relative;

        display: inline-block;

        color: var(--brown-dark);

        font-family:
            "Brush Script MT",
            "Segoe Script",
            "Snell Roundhand",
            "URW Chancery L",
            cursive;

        font-size:
            clamp(43px, 7vw, 84px);

        font-weight: 400;

        font-style: italic;

        line-height: 0.95;

        transform:
            rotate(-7deg);

        transform-origin:
            center center;

        white-space: nowrap;
    }


    /*
     * Underline flourish
     */

    .closing-text::after {

        content: "";

        position: absolute;

        left: 9%;

        right: 1%;

        bottom:
            -7px;

        height: 4px;

        border-bottom:
            3px solid var(--brown-dark);

        border-radius:
            50%;

        transform:
            rotate(-2deg);
    }


    /* =========================================================
       DECORATIVE BEACH FOREGROUND
       ========================================================= */

    .bottom-decoration {

        position: relative;

        width: 100%;

        height:
            clamp(70px, 9vw, 120px);

        margin-top:
            clamp(30px, 4vw, 48px);

        overflow: hidden;

        pointer-events: none;
    }


    /*
     * Subtle shell shapes are created in CSS so the page
     * remains responsive without another fixed artwork.
     */

    .shell {

        position: absolute;

        bottom: -12px;

        border-radius:
            50% 50% 45% 45%;

        background:
            linear-gradient(
                145deg,
                #f5e7cf,
                #d9b47d
            );

        box-shadow:
            0 3px 8px rgba(70, 35, 5, 0.18);
    }


    .shell-left {

        left: 4%;

        width:
            clamp(50px, 8vw, 95px);

        height:
            clamp(38px, 6vw, 72px);

        transform:
            rotate(-18deg);
    }


    .shell-right {

        right: 5%;

        width:
            clamp(48px, 7vw, 82px);

        height:
            clamp(36px, 5.5vw, 65px);

        transform:
            rotate(18deg);
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 700px) {

        .home-page {

            padding:
                26px
                18px
                35px;
        }


        .guest-favourite img {
            width: 125px;
        }


        .property-logo {
            width: 70%;
        }


        .tagline {
            font-size: 21px;
        }


        .photo-grid {
            gap: 12px;
        }


        .card-caption {
            min-height: 47px;
        }


        .card-title {
            font-size: 22px;
        }


        .card-arrow {
            font-size: 27px;
            right: 13px;
        }


        .feature {
            min-height: 105px;
        }


        .feature-title {
            font-size: 13px;
        }


        .feature-subtitle {
            font-size: 11px;
        }


        .feature-icon {
            width: 32px;
            height: 32px;
        }
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 500px) {

        .home-page {

            min-height: 100svh;

            padding:
                22px
                12px
                30px;

            /*
             * Keeps the sand filling the entire responsive page.
             */
            background-size:
                auto 100%;

            background-position:
                center top;
        }


        /* -----------------------------------------
           Guest Favourite
           ----------------------------------------- */

        .guest-favourite {

            margin-bottom: 13px;
        }

        .guest-favourite img {

            width: 105px;
        }


        /* -----------------------------------------
           Main logo
           ----------------------------------------- */

        .property-logo {

            width: 76%;

            max-width: 310px;
        }


        .brand {

            margin-bottom: 15px;
        }


        /* -----------------------------------------
           Tagline
           ----------------------------------------- */

        .tagline {

            margin-top: 9px;

            font-size: 18px;

            line-height: 1.05;
        }


        /* -----------------------------------------
           Photo grid
           ----------------------------------------- */

        .photo-grid {

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 9px;

            margin-top: 21px;
        }


        .photo-image {

            aspect-ratio: 1.45 / 1;
        }


        .card-caption {

            min-height: 38px;

            padding:
                6px
                22px
                6px
                7px;
        }


        .card-title {

            font-size: 16px;

            line-height: 1;
        }


        .card-arrow {

            right: 8px;

            font-size: 21px;
        }


        /* -----------------------------------------
           Features
           ----------------------------------------- */

        .features {

            margin-top: 11px;

            border-radius: 6px;
        }


        .feature {

            min-height: 76px;

            padding:
                7px 2px;
        }


        .feature-icon {

            width: 25px;
            height: 25px;

            margin-bottom: 5px;
        }


        .feature-title {

            font-size: 10px;

            line-height: 1.05;
        }


        .feature-subtitle {

            font-size: 9px;

            margin-top: 2px;
        }


        /* -----------------------------------------
           Closing line
           ----------------------------------------- */

        .closing {

            margin-top: 29px;

            padding: 0;
        }


        .closing-text {

            font-size: 43px;

            transform:
                rotate(-7deg);
        }


        .closing-text::after {

            height: 3px;

            border-bottom-width: 2px;

            bottom: -5px;
        }


        /* -----------------------------------------
           Bottom decoration
           ----------------------------------------- */

        .bottom-decoration {

            height: 55px;

            margin-top: 23px;
        }
    }


    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 360px) {

        .home-page {

            padding:
                19px
                9px
                25px;
        }


        .guest-favourite img {
            width: 96px;
        }


        .property-logo {
            width: 79%;
        }


        .tagline {
            font-size: 17px;
        }


        .photo-grid {
            gap: 7px;
        }


        .card-caption {
            min-height: 35px;
        }


        .card-title {
            font-size: 14px;
        }


        .card-arrow {
            font-size: 19px;
            right: 6px;
        }


        .feature {
            min-height: 70px;
        }


        .feature-icon {
            width: 22px;
            height: 22px;
        }


        .feature-title {
            font-size: 9px;
        }


        .feature-subtitle {
            font-size: 8px;
        }


        .closing-text {
            font-size: 38px;
        }
    }

</style>
</head>


<body>


<main class="home-page">


    <!-- =====================================================
         AIRBNB GUEST FAVOURITE
         ===================================================== -->

    <div class="guest-favourite">

        <img
            src="Airbnb Guest Favourite Badge.png"
            alt="Airbnb Guest Favourite"
        >

    </div>


    <!-- =====================================================
         303 OYSTER BAY BRAND
         ===================================================== -->

    <header class="brand">

        <img
            class="property-logo"
            src="logo.png"
            alt="303 Oyster Bay — Surathkal · Mangaluru"
        >

        <p class="tagline">
            Where the sea slows you down.
        </p>

    </header>


    <!-- =====================================================
         FOUR MAIN NAVIGATION CARDS
         ===================================================== -->

    <section class="photo-grid">


        <!-- YOUR STAY -->

        <a
            class="photo-card"
            href="stay.html"
            aria-label="Your Stay"
        >

            <div class="photo-image stay-image">

                <img
                    src="Beach View(4).PNG"
                    alt="Sea view from 303 Oyster Bay"
                >

            </div>

            <div class="card-caption">

                <h2 class="card-title">
                    Your Stay
                </h2>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>



        <!-- THE APARTMENT -->

        <a
            class="photo-card"
            href="apartment.html"
            aria-label="The Apartment"
        >

            <div class="photo-image apartment-image">

                <img
                    src="Drawing room(4).png"
                    alt="Living room at 303 Oyster Bay"
                >

            </div>

            <div class="card-caption">

                <h2 class="card-title">
                    The Apartment
                </h2>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>



        <!-- EXPLORE -->

        <a
            class="photo-card"
            href="explore.html"
            aria-label="Explore"
        >

            <div class="photo-image explore-image">

                <!--
                    Lighthouse image.
                    Replace ONLY the filename below if your
                    existing GitHub asset has a different name.
                -->

                <img
                    src="Surathkal Lighthouse.png"
                    alt="Surathkal Lighthouse and fishing boats"
                >

            </div>

            <div class="card-caption">

                <h2 class="card-title">
                    Explore
                </h2>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>



        <!-- GALLERY -->

        <a
            class="photo-card"
            href="gallery.html"
            aria-label="Gallery"
        >

            <div class="photo-image gallery-image">

                <img
                    src="View From Beach.jpg"
                    alt="303 Oyster Bay apartment building"
                >

            </div>

            <div class="card-caption">

                <h2 class="card-title">
                    Gallery
                </h2>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>


    </section>


    <!-- =====================================================
         FEATURES
         ===================================================== -->

    <section class="features">


        <!-- BEDROOMS -->

        <div class="feature">

            <div class="feature-icon">

                <svg viewBox="0 0 48 48">

                    <path d="M7 37V19h34v18"/>
                    <path d="M7 27h34"/>
                    <path d="M12 19v-5c0-2 2-3 4-3h7c2 0 4 1 4 3v5"/>
                    <path d="M7 37v4"/>
                    <path d="M41 37v4"/>

                </svg>

            </div>

            <p class="feature-title">
                2 Bedrooms
            </p>

            <p class="feature-subtitle">
                Sleeps 4 + 1
            </p>

        </div>



        <!-- SEA VIEWS -->

        <div class="feature">

            <div class="feature-icon">

                <svg viewBox="0 0 48 48">

                    <path d="M5 15c5-5 9-5 14 0s9 5 14 0 9-5 10 0"/>
                    <path d="M5 24c5-5 9-5 14 0s9 5 14 0 9-5 10 0"/>
                    <path d="M5 33c5-5 9-5 14 0s9 5 14 0 9-5 10 0"/>

                </svg>

            </div>

            <p class="feature-title">
                Uninterrupted<br>
                Sea Views
            </p>

        </div>



        <!-- KITCHEN -->

        <div class="feature">

            <div class="feature-icon">

                <svg viewBox="0 0 48 48">

                    <rect
                        x="7"
                        y="7"
                        width="34"
                        height="34"
                        rx="3"
                    />

                    <circle cx="17" cy="17" r="4"/>
                    <circle cx="31" cy="17" r="4"/>
                    <circle cx="17" cy="31" r="4"/>
                    <circle cx="31" cy="31" r="4"/>

                </svg>

            </div>

            <p class="feature-title">
                Full Kitchen
            </p>

        </div>



        <!-- PARKING -->

        <div class="feature">

            <div class="feature-icon">

                <svg viewBox="0 0 48 48">

                    <path d="M7 29l4-12h26l4 12"/>
                    <path d="M7 29v8h34v-8"/>
                    <path d="M13 17l3-7h16l3 7"/>
                    <circle cx="14" cy="36" r="3"/>
                    <circle cx="34" cy="36" r="3"/>
                    <path d="M18 29h12"/>

                </svg>

            </div>

            <p class="feature-title">
                Free Parking
            </p>

        </div>



        <!-- WI-FI -->

        <div class="feature">

            <div class="feature-icon">

                <svg viewBox="0 0 48 48">

                    <path d="
                        M5 18
                        C17 7 31 7 43 18
                    "/>

                    <path d="
                        M11 25
                        C19 18 29 18 37 25
                    "/>

                    <path d="
                        M18 32
                        C22 28 26 28 30 32
                    "/>

                    <circle
                        cx="24"
                        cy="38"
                        r="2"
                        fill="currentColor"
                        stroke="none"
                    />

                </svg>

            </div>

            <p class="feature-title">
                High-Speed<br>
                Wi-Fi
            </p>

        </div>


    </section>


    <!-- =====================================================
         SEE YOU BY THE SEA
         ===================================================== -->

    <section class="closing">

        <div class="closing-text">
            See you by the Sea
        </div>

    </section>


    <!-- =====================================================
         BEACH FOREGROUND
         ===================================================== -->

    <div class="bottom-decoration">

        <div class="shell shell-left"></div>

        <div class="shell shell-right"></div>

    </div>


</main>


</body>
</html>
