<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #d8ad73;
    overflow-x: hidden;
}

.page {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;

    min-height: 100vh;

    padding:
        clamp(25px, 4vw, 50px)
        clamp(22px, 4.5vw, 55px)
        0;

    background:
        url("sand-background.png")
        center top / cover
        no-repeat;

    color: #542b0d;
}


/* =========================================================
   AIRBNB GUEST FAVOURITE
   ========================================================= */

.guest-favourite {
    width: 100%;
    display: flex;
    justify-content: center;

    margin-bottom:
        clamp(14px, 2vw, 24px);
}

.guest-favourite img {
    display: block;

    width:
        clamp(105px, 13vw, 165px);

    height: auto;
}


/* =========================================================
   303 OYSTER BAY LOGO
   ========================================================= */

.logo-area {
    width: 100%;

    display: flex;
    justify-content: center;
}

.logo-area img {
    display: block;

    width:
        clamp(280px, 50vw, 570px);

    max-width: 84%;

    height: auto;
}


/* =========================================================
   TAGLINE
   ========================================================= */

.tagline {
    margin:
        clamp(10px, 1.6vw, 18px)
        0
        0;

    text-align: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(20px, 2.8vw, 34px);

    font-style: italic;

    line-height: 1.1;

    color: #5a2d0e;
}


/* =========================================================
   FOUR IMAGE CARDS
   ========================================================= */

.cards {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:
        clamp(12px, 1.8vw, 22px);

    margin-top:
        clamp(28px, 3.5vw, 42px);
}


.card {
    display: block;

    min-width: 0;

    text-decoration: none;

    color: #542b0d;

    overflow: hidden;

    border-radius:
        clamp(5px, .8vw, 9px);

    background: #f8ecd8;
}


.card-image {
    width: 100%;

    aspect-ratio: 1.62 / 1;

    overflow: hidden;

    background: #c89c60;
}

.card-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* Keep the approved lighthouse foreground visible */
.explore img {
    object-position: center 62%;
}


/* =========================================================
   CARD CAPTION
   ========================================================= */

.caption {
    position: relative;

    min-height:
        clamp(48px, 5.5vw, 67px);

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        7px
        40px
        7px
        12px;

    background:
        rgba(250, 242, 226, .97);
}

.caption span:first-child {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(21px, 2.8vw, 35px);

    line-height: 1;

    text-align: center;
}

.arrow {
    position: absolute;

    right:
        clamp(10px, 1.8vw, 23px);

    top: 50%;

    transform:
        translateY(-52%);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(27px, 3vw, 38px);

    line-height: 1;
}


/* =========================================================
   FEATURES BAND
   ========================================================= */

.features {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    margin-top:
        clamp(16px, 2vw, 24px);

    border-radius:
        clamp(5px, .8vw, 9px);

    overflow: hidden;

    background:
        rgba(250, 237, 211, .96);
}


.feature {
    min-width: 0;

    min-height:
        clamp(110px, 12vw, 150px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        10px
        5px;

    border-right:
        1px solid rgba(84, 43, 13, .48);
}

.feature:last-child {
    border-right: none;
}


/* =========================================================
   FEATURE ICONS
   ========================================================= */

.icon {
    width:
        clamp(34px, 4.3vw, 52px);

    height:
        clamp(34px, 4.3vw, 52px);

    margin-bottom:
        clamp(6px, .9vw, 10px);
}

.icon svg {
    width: 100%;
    height: 100%;

    fill: none;

    stroke: #542b0d;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   FEATURE TEXT
   ========================================================= */

.feature-title {
    margin: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(13px, 1.65vw, 21px);

    line-height: 1.08;

    color: #542b0d;
}

.feature-subtitle {
    margin:
        3px
        0
        0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(11px, 1.35vw, 17px);

    font-style: italic;

    line-height: 1;

    color: #542b0d;
}


/* =========================================================
   SEE YOU BY THE SEA
   ========================================================= */

.closing {
    width: 100%;

    display: flex;

    justify-content: center;

    margin-top:
        clamp(34px, 4.5vw, 55px);

    padding:
        0
        3%
        clamp(25px, 3vw, 38px);
}

.closing-text {
    color: #4f270b;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Snell Roundhand",
        "URW Chancery L",
        cursive;

    font-size:
        clamp(45px, 7vw, 84px);

    font-style: italic;

    font-weight: 400;

    line-height: .95;

    white-space: nowrap;

    transform:
        rotate(-7deg);
}


/* =========================================================
   ACTUAL BOTTOM SHELL / BEACH ARTWORK
   ========================================================= */

/*
   Home Page.png is the approved artwork containing the
   actual shells and beach foreground.

   Only its bottom edge is shown here, so the approved
   shell treatment is retained without duplicating the
   rest of the artwork.
*/

.bottom-art {
    width: 100%;

    height:
        clamp(105px, 13vw, 155px);

    margin-top: 0;

    background-image:
        url("Home%20Page.png");

    background-repeat: no-repeat;

    background-position:
        center bottom;

    background-size:
        100% auto;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 700px) {

    .page {
        padding:
            23px
            17px
            0;
    }

    .guest-favourite img {
        width: 110px;
    }

    .logo-area img {
        width: 75%;
    }

    .tagline {
        font-size: 20px;
    }

    .cards {
        gap: 10px;
        margin-top: 22px;
    }

    .card-image {
        aspect-ratio: 1.48 / 1;
    }

    .caption {
        min-height: 44px;
    }

    .caption span:first-child {
        font-size: 20px;
    }

    .arrow {
        font-size: 25px;
        right: 10px;
    }

    .feature {
        min-height: 94px;
    }

    .feature-title {
        font-size: 12px;
    }

    .feature-subtitle {
        font-size: 10px;
    }

    .icon {
        width: 30px;
        height: 30px;
    }

    .closing {
        margin-top: 28px;
    }

    .closing-text {
        font-size: 46px;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 500px) {

    .page {
        padding:
            20px
            12px
            0;

        background-size:
            auto 100%;

        background-position:
            center top;
    }

    .guest-favourite {
        margin-bottom: 12px;
    }

    .guest-favourite img {
        width: 100px;
    }

    .logo-area img {
        width: 76%;
        max-width: 310px;
    }

    .tagline {
        margin-top: 9px;
        font-size: 18px;
    }

    .cards {
        gap: 8px;
        margin-top: 21px;
    }

    .card-image {
        aspect-ratio: 1.42 / 1;
    }

    .caption {
        min-height: 38px;
        padding:
            5px
            27px
            5px
            6px;
    }

    .caption span:first-child {
        font-size: 16px;
    }

    .arrow {
        right: 7px;
        font-size: 21px;
    }

    .features {
        margin-top: 10px;
    }

    .feature {
        min-height: 76px;
        padding: 6px 2px;
    }

    .icon {
        width: 24px;
        height: 24px;
        margin-bottom: 4px;
    }

    .feature-title {
        font-size: 9px;
    }

    .feature-subtitle {
        font-size: 8px;
    }

    .closing {
        margin-top: 27px;
        padding:
            0
            0
            23px;
    }

    .closing-text {
        font-size: 43px;
    }

    .bottom-art {
        height: 105px;

        background-size:
            auto 105px;

        background-position:
            center bottom;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 360px) {

    .page {
        padding-left: 9px;
        padding-right: 9px;
    }

    .guest-favourite img {
        width: 94px;
    }

    .logo-area img {
        width: 79%;
    }

    .tagline {
        font-size: 17px;
    }

    .cards {
        gap: 7px;
    }

    .caption {
        min-height: 35px;
    }

    .caption span:first-child {
        font-size: 14px;
    }

    .arrow {
        font-size: 19px;
    }

    .feature {
        min-height: 70px;
    }

    .feature-title {
        font-size: 8px;
    }

    .feature-subtitle {
        font-size: 7px;
    }

    .icon {
        width: 21px;
        height: 21px;
    }

    .closing-text {
        font-size: 38px;
    }

    .bottom-art {
        height: 90px;

        background-size:
            auto 90px;
    }
}

</style>
</head>


<body>

<main class="page">


    <!-- AIRBNB GUEST FAVOURITE -->

    <div class="guest-favourite">

        <img
            src="guest-favourite.png"
            alt="Airbnb Guest Favourite"
        >

    </div>


    <!-- 303 OYSTER BAY -->

    <div class="logo-area">

        <img
            src="logo.png"
            alt="303 Oyster Bay"
        >

    </div>


    <!-- TAGLINE -->

    <p class="tagline">
        Where the sea slows you down.
    </p>


    <!-- =====================================================
         FOUR NAVIGATION CARDS
         ===================================================== -->

    <section class="cards">


        <!-- YOUR STAY -->

        <a
            href="your-stay.html"
            class="card"
        >

            <div class="card-image">

                <img
                    src="your-stay.PNG"
                    alt="Your Stay"
                >

            </div>

            <div class="caption">

                <span>
                    Your Stay
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


        <!-- THE APARTMENT -->

        <a
            href="apartment.html"
            class="card"
        >

            <div class="card-image">

                <img
                    src="apartment.jpg"
                    alt="The Apartment"
                >

            </div>

            <div class="caption">

                <span>
                    The Apartment
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


        <!-- EXPLORE -->

        <a
            href="explore.html"
            class="card explore"
        >

            <div class="card-image">

                <img
                    src="gallery.jpg"
                    alt="Explore Surathkal"
                >

            </div>

            <div class="caption">

                <span>
                    Explore
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


        <!-- GALLERY -->

        <a
            href="gallery.html"
            class="card"
        >

            <div class="card-image">

                <img
                    src="Gallery.png"
                    alt="303 Oyster Bay Gallery"
                >

            </div>

            <div class="caption">

                <span>
                    Gallery
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


    </section>


    <!-- =====================================================
         FEATURES
         ===================================================== -->

    <section class="features">


        <!-- BEDROOMS -->

        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 48 48">

                    <path d="M7 37V19h34v18"/>
                    <path d="M7 27h34"/>
                    <path d="M12 19v-5c0-2 2-3 4-3h7c2 0 4 1 4 3v5"/>
                    <path d="M7 37v4"/>
                    <path d="M41 37v4"/>

                </svg>

            </div>

            <p class="feature-title">
                2 Bedrooms
            </p>

            <p class="feature-subtitle">
                Sleeps 4 + 1
            </p>

        </div>


        <!-- SEA VIEWS -->

        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 48 48">

                    <path d="M5 15c5-5 9-5 14 0s9 5 14 0 9-5 10 0"/>
                    <path d="M5 24c5-5 9-5 14 0s9 5 14 0 9-5 10 0"/>
                    <path d="M5 33c5-5 9-5 14 0s9 5 14 0 9-5 10 0"/>

                </svg>

            </div>

            <p class="feature-title">
                Uninterrupted<br>
                Sea Views
            </p>

        </div>


        <!-- KITCHEN -->

        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 48 48">

                    <rect
                        x="7"
                        y="7"
                        width="34"
                        height="34"
                        rx="3"
                    />

                    <circle cx="17" cy="17" r="4"/>
                    <circle cx="31" cy="17" r="4"/>
                    <circle cx="17" cy="31" r="4"/>
                    <circle cx="31" cy="31" r="4"/>

                </svg>

            </div>

            <p class="feature-title">
                Full Kitchen
            </p>

        </div>


        <!-- PARKING -->

        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 48 48">

                    <path d="M7 29l4-12h26l4 12"/>
                    <path d="M7 29v8h34v-8"/>
                    <path d="M13 17l3-7h16l3 7"/>
                    <circle cx="14" cy="36" r="3"/>
                    <circle cx="34" cy="36" r="3"/>
                    <path d="M18 29h12"/>

                </svg>

            </div>

            <p class="feature-title">
                Free Parking
            </p>

        </div>


        <!-- WI-FI -->

        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 48 48">

                    <path d="M5 18C17 7 31 7 43 18"/>
                    <path d="M11 25C19 18 29 18 37 25"/>
                    <path d="M18 32C22 28 26 28 30 32"/>

                    <circle
                        cx="24"
                        cy="38"
                        r="2"
                        fill="#542b0d"
                        stroke="none"
                    />

                </svg>

            </div>

            <p class="feature-title">
                High-Speed<br>
                Wi-Fi
            </p>

        </div>


    </section>


    <!-- =====================================================
         CLOSING
         ===================================================== -->

    <section class="closing">

        <div class="closing-text">
            See you by the Sea
        </div>

    </section>


    <!-- =====================================================
         ACTUAL SHELL / BEACH FOREGROUND
         ===================================================== -->

    <div class="bottom-art"></div>


</main>

</body>
</html>
