<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay — Guest Guide</title>

<style>

    /* =========================================================
       RESET
       ========================================================= */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #d8ad73;
        font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .home-page {
        width: 100%;
        height: 100svh;
        min-height: 100svh;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
        align-items: center;

        padding:
            clamp(12px, 2.2vh, 28px)
            clamp(14px, 4vw, 55px)
            clamp(12px, 2vh, 22px);

        background-image: url("sand-background.jpg");
        background-repeat: no-repeat;
        background-position: center top;
        background-size: cover;

        overflow: hidden;
    }


    /* =========================================================
       GUEST FAVOURITE
       ========================================================= */

    .guest-favourite {
        display: block;

        width:
            clamp(90px, 9vw, 125px);

        height: auto;

        margin:
            0 auto
            clamp(5px, 0.8vh, 10px);
    }


    /* =========================================================
       PROPERTY LOGO
       ========================================================= */

    .brand {
        width: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;

        flex-shrink: 0;
    }

    .brand-logo {
        display: block;

        width:
            clamp(190px, 29vw, 330px);

        max-width: 58%;

        height: auto;
    }

    .tagline {
        margin:
            clamp(2px, 0.4vh, 5px)
            0
            clamp(7px, 1.1vh, 13px);

        color: #684827;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(12px, 1.45vw, 19px);

        font-style: italic;

        line-height: 1.15;

        text-align: center;
    }


    /* =========================================================
       DIVIDER
       ========================================================= */

    .divider {
        width: 100%;
        max-width: 1080px;

        height: 1px;

        margin:
            0 0
            clamp(8px, 1.2vh, 15px);

        background:
            rgba(104, 72, 39, 0.38);

        flex-shrink: 0;
    }


    /* =========================================================
       PHOTO GRID
       ========================================================= */

    .card-grid {
        width: 100%;
        max-width: 1080px;

        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap:
            clamp(8px, 1.25vw, 16px);

        flex: 1 1 auto;

        min-height: 0;
    }


    /* =========================================================
       CARDS
       ========================================================= */

    .stay-card {
        position: relative;

        display: flex;
        flex-direction: column;

        min-width: 0;
        min-height: 0;

        text-decoration: none;

        overflow: hidden;

        border-radius:
            clamp(12px, 1.6vw, 22px);

        background: #f6ead4;

        box-shadow:
            0 5px 16px rgba(70, 40, 15, 0.18);

        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease;
    }

    .stay-card:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 22px rgba(70, 40, 15, 0.24);
    }


    /* =========================================================
       CARD IMAGE
       ========================================================= */

    .card-image {
        width: 100%;

        flex: 1 1 auto;

        min-height: 0;

        object-fit: cover;

        display: block;
    }


    /* =========================================================
       CARD CAPTION
       ========================================================= */

    .card-caption {
        flex-shrink: 0;

        min-height:
            clamp(34px, 4.4vh, 55px);

        padding:
            0
            clamp(11px, 1.8vw, 22px);

        display: flex;
        align-items: center;
        justify-content: space-between;

        background:
            rgba(248, 238, 217, 0.96);

        color: #684827;
    }

    .card-title {
        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(14px, 1.7vw, 22px);

        line-height: 1;

        font-weight: 600;
    }

    .card-arrow {
        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(18px, 2vw, 27px);

        line-height: 1;

        margin-left: 8px;
    }


    /* =========================================================
       FEATURES BAND
       ========================================================= */

    .features-band {
        width: 100%;
        max-width: 1080px;

        flex-shrink: 0;

        margin-top:
            clamp(8px, 1.3vh, 15px);

        padding:
            clamp(7px, 1.1vh, 13px)
            0;

        display: grid;

        grid-template-columns:
            repeat(5, minmax(0, 1fr));

        background:
            rgba(247, 232, 204, 0.90);

        border:
            1px solid rgba(255,255,255,0.45);

        border-radius:
            clamp(11px, 1.4vw, 18px);

        box-shadow:
            0 4px 14px rgba(70, 40, 15, 0.10);
    }


    /* =========================================================
       FEATURE
       ========================================================= */

    .feature {
        min-width: 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding:
            0
            clamp(5px, 0.8vw, 12px);

        text-align: center;
    }

    .feature + .feature {
        border-left:
            1px solid rgba(104, 72, 39, 0.25);
    }


    /* =========================================================
       FEATURE ICONS
       ========================================================= */

    .feature-icon {
        width:
            clamp(22px, 2.6vw, 34px);

        height:
            clamp(22px, 2.6vw, 34px);

        margin-bottom:
            clamp(2px, 0.4vh, 5px);

        fill: none;

        stroke: #684827;

        stroke-width: 2;

        stroke-linecap: round;
        stroke-linejoin: round;
    }


    /* =========================================================
       FEATURE TEXT
       ========================================================= */

    .feature-title {
        color: #684827;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(8px, 1vw, 13px);

        font-weight: 700;

        letter-spacing:
            clamp(0.3px, 0.08vw, 1px);

        line-height: 1.12;
    }

    .feature-subtitle {
        margin-top: 2px;

        color: #7b6247;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(7px, 0.85vw, 11px);

        font-style: italic;

        line-height: 1.05;
    }


    /* =========================================================
       MEDIUM / SHORT DESKTOP SCREENS
       ========================================================= */

    @media (max-height: 760px) and (min-width: 601px) {

        .home-page {
            padding
