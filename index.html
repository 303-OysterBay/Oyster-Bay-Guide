<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASIC RESET
   ========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#d8ad78;
    color:#4b2f1b;
    font-family:"Cormorant Garamond",serif;
}


/* =========================================================
   PAGE BACKGROUND
   ========================================================= */

.page{
    position:relative;

    width:100%;
    min-height:100vh;

    padding:
        20px
        10px
        120px;

    background:
        linear-gradient(
            rgba(215,172,118,.035),
            rgba(215,172,118,.035)
        ),
        url("sand-background.png")
        center top /
        cover
        no-repeat;

    overflow:hidden;
}

.hero{
    position:relative;

    width:100%;
    max-width:1120px;

    margin:0 auto;

    text-align:center;
}


/* =========================================================
   AIRBNB GUEST FAVOURITE
   ABSOLUTELY INDEPENDENT OF THE LOGO
   ========================================================= */

.guest-favourite-wrap{
    position:absolute;

    top:0;
    right:0;

    width:78px;

    z-index:50;

    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.guest-favourite{
    display:block;

    width:100%;
    height:auto;

    transform:translateX(-2px);
}


/* =========================================================
   MAIN LOGO
   ========================================================= */

.logo{
    display:block;

    width:min(66vw,330px);
    height:auto;

    margin:
        54px
        auto
        0;
}


/* =========================================================
   TAGLINE
   ========================================================= */

.tagline{
    margin:
        3px
        auto
        15px;

    font-size:17px;

    line-height:1.05;

    font-style:italic;
    font-weight:500;

    letter-spacing:.01em;
}


/* =========================================================
   DIVIDERS
   ========================================================= */

.divider{
    width:100%;
    height:1px;

    background:rgba(75,47,27,.46);
}


/* =========================================================
   FEATURES
   ========================================================= */

.amenities{
    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    width:100%;
    max-width:1000px;

    margin:0 auto;

    padding:
        10px
        0
        11px;
}

.amenity{
    position:relative;

    min-width:0;

    padding:
        0
        4px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:flex-start;
}

.amenity:not(:last-child)::after{
    content:"";

    position:absolute;

    top:1px;
    right:0;

    width:1px;
    height:59px;

    background:rgba(75,47,27,.40);
}


/* =========================================================
   ELEGANT THIN ICONS
   ========================================================= */

.amenity-icon{
    width:23px;
    height:23px;

    margin-bottom:4px;

    fill:none;

    stroke:#4b2f1b;

    stroke-width:1.35;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.amenity-title{
    color:#4b2f1b;

    font-size:13px;

    line-height:.98;

    font-weight:500;

    letter-spacing:-.01em;
}

.amenity.compound .amenity-title{
    font-size:12.5px;
}

.amenity-subtitle{
    margin-top:1px;

    color:#4b2f1b;

    font-size:11.5px;

    line-height:1;

    font-style:italic;

    font-weight:400;
}


/* =========================================================
   CARD GRID
   ========================================================= */

.cards{
    position:relative;

    width:100%;

    margin:
        10px
        auto
        0;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:9px;
}


/* =========================================================
   CARD
   ========================================================= */

.card{
    position:relative;

    display:block;

    width:100%;

    /*
       Slightly taller than the previous version.
       This reveals more of the actual photographs.
    */
    aspect-ratio:1.25 / 1;

    overflow:hidden;

    border-radius:3px;

    background:#f7eee2;

    color:#4b2f1b;

    text-decoration:none;

    box-shadow:
        0 4px 13px
        rgba(55,30,12,.20);
}

.card img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}


/* =========================================================
   CARD LABEL
   ========================================================= */

.card-label{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    min-height:34px;

    padding:
        5px
        38px
        5px
        7px;

    background:
        rgba(250,243,234,.94);

    display:flex;

    align-items:center;
    justify-content:center;

    color:#4b2f1b;

    font-size:18px;

    line-height:1;

    font-weight:500;

    text-align:center;

    z-index:3;
}


/* =========================================================
   CARD ARROWS
   EACH ARROW BELONGS TO ITS OWN CARD
   ========================================================= */

.card-arrow{
    position:absolute;

    right:9px;
    bottom:7px;

    z-index:8;

    color:#4b2f1b;

    font-family:Arial,sans-serif;

    font-size:18px;

    line-height:18px;

    font-weight:300;
}


/* =========================================================
   HANDWRITTEN SIGNATURE
   ABSOLUTELY POSITIONED — NEVER AFFECTS CARD LAYOUT
   ========================================================= */

.signature{
    position:absolute;

    z-index:20;

    left:50%;

    /*
       Positioned relative to the card grid.
       This is deliberately outside normal document flow.
    */
    bottom:-34px;

    width:82%;

    color:#4b2f1b;

    font-family:"Allura",cursive;

    font-size:27px;

    font-weight:400;

    line-height:1;

    white-space:nowrap;

    text-align:center;

    transform:
        translateX(-50%)
        rotate(-10deg);

    transform-origin:center center;

    pointer-events:none;
}


/* =========================================================
   BOTTOM BEACH DETAIL
   SUBTLE SHELLS + SAND + GRASS
   ========================================================= */

.bottom-beach{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:105px;

    z-index:2;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 76% 82%,
            rgba(255,246,225,.72) 0 5px,
            transparent 6px
        ),
        radial-gradient(
            ellipse at 82% 91%,
            rgba(255,247,226,.78) 0 4px,
            transparent 5px
        ),
        radial-gradient(
            ellipse at 71% 94%,
            rgba(244,229,199,.85) 0 3px,
            transparent 4px
        );
}


/* large shell */

.shell-large{
    position:absolute;

    right:7%;
    bottom:12px;

    width:54px;
    height:42px;

    border:
        1.5px solid
        rgba(111,74,43,.48);

    border-radius:
        52% 48%
        46% 44% /
        65% 60%
        40% 38%;

    transform:
        rotate(-10deg);

    opacity:.72;
}

.shell-large::before,
.shell-large::after{
    content:"";

    position:absolute;

    top:5px;
    bottom:5px;

    width:1px;

    background:rgba(111,74,43,.35);
}

.shell-large::before{
    left:35%;
    transform:rotate(-12deg);
}

.shell-large::after{
    right:35%;
    transform:rotate(12deg);
}


/* smaller shells */

.shell-small{
    position:absolute;

    width:26px;
    height:19px;

    border:
        1px solid
        rgba(111,74,43,.42);

    border-radius:
        55% 45%
        45% 40%;

    opacity:.65;
}

.shell-one{
    right:18%;
    bottom:17px;
    transform:rotate(18deg);
}

.shell-two{
    right:26%;
    bottom:8px;
    transform:rotate(-24deg) scale(.7);
}


/* beach grass */

.grass{
    position:absolute;

    bottom:-8px;

    width:110px;
    height:95px;

    opacity:.34;

    transform-origin:bottom center;
}

.grass.left{
    left:-12px;
    transform:rotate(-8deg);
}

.grass.right{
    right:-14px;
    transform:rotate(10deg);
}

.grass span{
    position:absolute;

    bottom:0;
    left:50%;

    width:1px;
    height:88px;

    background:rgba(87,69,40,.45);

    transform-origin:bottom center;
}

.grass span:nth-child(1){
    transform:rotate(-32deg);
}

.grass span:nth-child(2){
    transform:rotate(-20deg);
}

.grass span:nth-child(3){
    transform:rotate(-8deg);
}

.grass span:nth-child(4){
    transform:rotate(7deg);
}

.grass span:nth-child(5){
    transform:rotate(21deg);
}

.grass span:nth-child(6){
    transform:rotate(34deg);
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width:701px){

    .page{
        padding:
            28px
            4vw
            130px;
    }

    .guest-favourite-wrap{
        top:0;
        right:0;

        width:clamp(90px,11vw,120px);
    }

    .guest-favourite{
        transform:translateX(-3px);
    }

    .logo{
        width:min(64vw,390px);

        margin:
            58px
            auto
            0;
    }

    .tagline{
        margin:
            4px
            auto
            19px;

        font-size:
            clamp(18px,2.15vw,23px);
    }

    .amenities{
        padding:
            11px
            0
            12px;
    }

    .amenity{
        padding:
            0
            10px;
    }

    .amenity:not(:last-child)::after{
        top:2px;
        height:67px;
    }

    .amenity-icon{
        width:27px;
        height:27px;

        margin-bottom:5px;

        stroke-width:1.35;
    }

    .amenity-title{
        font-size:
            clamp(14px,1.75vw,19px);
    }

    .amenity.compound .amenity-title{
        font-size:
            clamp(13px,1.65vw,18px);
    }

    .amenity-subtitle{
        font-size:
            clamp(12px,1.5vw,16px);
    }

    .cards{
        margin-top:10px;

        gap:16px;
    }

    .card{
        aspect-ratio:1.40 / 1;
    }

    .card-label{
        min-height:40px;

        padding:
            6px
            46px
            6px
            12px;

        font-size:
            clamp(18px,2.2vw,25px);
    }

    .card-arrow{
        right:13px;
        bottom:10px;

        font-size:21px;
        line-height:21px;
    }

    .signature{
        bottom:-52px;

        width:72%;

        font-size:
            clamp(34px,3.6vw,45px);

        transform:
            translateX(-50%)
            rotate(-10deg);
    }

    .bottom-beach{
        height:125px;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width:700px){

    .page{
        padding:
            18px
            10px
            125px;
    }

    /*
       Guest Favourite remains completely independent.
    */

    .guest-favourite-wrap{
        top:0;
        right:0;

        width:78px;
    }

    .guest-favourite{
        transform:translateX(-2px);
    }


    /*
       Main content begins lower,
       creating the breathing space requested.
    */

    .logo{
        width:min(66vw,330px);

        margin:
            54px
            auto
            0;
    }


    .tagline{
        margin:
            3px
            auto
            15px;

        font-size:17px;
    }


    .amenities{
        padding:
            9px
            0
            10px;
    }


    .amenity{
        padding:
            0
            4px;
    }


    .amenity:not(:last-child)::after{
        top:1px;
        height:59px;
    }


    /*
       Thin elegant icons.
       Absolutely no heavy fill or thick stroke.
    */

    .amenity-icon{
        width:23px;
        height:23px;

        margin-bottom:4px;

        stroke-width:1.35;
    }


    .amenity-title{
        font-size:13px;
        line-height:.98;
    }

    .amenity.compound .amenity-title{
        font-size:12.5px;
    }

    .amenity-subtitle{
        font-size:11.5px;
    }


    /*
       TWO-COLUMN CARD GRID
       slightly taller than before.
    */

    .cards{
        margin-top:10px;

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:9px;
    }


    .card{
        aspect-ratio:1.25 / 1;
    }


    .card-label{
        min-height:34px;

        padding:
            5px
            38px
            5px
            7px;

        font-size:18px;
    }


    /*
       Arrow permanently belongs to this card.
    */

    .card-arrow{
        right:9px;
        bottom:7px;

        font-size:18px;
        line-height:18px;
    }


    /*
       Handwritten signature:
       strong upward diagonal,
       ending around the Gallery white label.
    */

    .signature{
        left:50%;

        bottom:-32px;

        width:82%;

        font-size:25px;

        transform:
            translateX(-50%)
            rotate(-10deg);
    }


    /*
       Beach decoration stays BELOW the composition.
       It does not interfere with the cards.
    */

    .bottom-beach{
        height:112px;
    }

    .shell-large{
        right:6%;
        bottom:13px;

        width:48px;
        height:37px;
    }

    .shell-one{
        right:18%;
        bottom:16px;
    }

    .shell-two{
        right:28%;
        bottom:7px;
    }

    .grass{
        width:95px;
        height:82px;
    }
}

</style>
</head>


<body>

<main class="page">

<div class="hero">


    <!-- =====================================================
         AIRBNB GUEST FAVOURITE
         ===================================================== -->

    <div class="guest-favourite-wrap">

        <img
            class="guest-favourite"
            src="guest-favourite.png"
            alt="Airbnb Guest Favourite">

    </div>


    <!-- =====================================================
         LOGO
         ===================================================== -->

    <img
        class="logo"
        src="logo.png"
        alt="303 Oyster Bay">


    <!-- =====================================================
         TAGLINE
         ===================================================== -->

    <div class="tagline">
        Where the sea slows you down.
    </div>


    <div class="divider"></div>


    <!-- =====================================================
         FEATURES
         ===================================================== -->

    <section
        class="amenities"
        aria-label="Apartment features">


        <!-- 2 Bedrooms -->

        <div class="amenity">

            <svg
                class="amenity-icon"
                viewBox="0 0 48 48"
                aria-hidden="true">

                <path d="M6 31V18h24c7 0 12 4 12 10v3H6Z"/>
                <path d="M6 31v8M42 31v8M6 35h36"/>
                <path d="M9 18v-5h13v5"/>

            </svg>

            <div class="amenity-title">
                2 Bedrooms
            </div>

            <div class="amenity-subtitle">
                Sleeps 4 + 1
            </div>

        </div>


        <!-- Uninterrupted Sea Views -->

        <div class="amenity compound">

            <svg
                class="amenity-icon"
                viewBox="0 0 48 48"
                aria-hidden="true">

                <path d="M4 16c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 8 4 4-4 8-4"/>
                <path d="M4 24c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 8 4 4-4 8-4"/>
                <path d="M4 32c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 8 4 4-4 8-4"/>

            </svg>

            <div class="amenity-title">
                Uninterrupted<br>
                Sea Views
            </div>

        </div>


        <!-- Full Kitchen -->

        <div class="amenity compound">

            <svg
                class="amenity-icon"
                viewBox="0 0 48 48"
                aria-hidden="true">

                <rect
                    x="7"
                    y="7"
                    width="34"
                    height="34"
                    rx="3"/>

                <circle
                    cx="17"
                    cy="17"
                    r="5"/>

                <circle
                    cx="31"
                    cy="17"
                    r="5"/>

                <circle
                    cx="17"
                    cy="31"
                    r="5"/>

                <circle
                    cx="31"
                    cy="31"
                    r="5"/>

            </svg>

            <div class="amenity-title">
                Full Kitchen
            </div>

        </div>


        <!-- Free Parking -->

        <div class="amenity compound">

            <svg
                class="amenity-icon"
                viewBox="0 0 56 48"
                aria-hidden="true">

                <path d="M8 31h40"/>
                <path d="M11 31v-7l7-8h21l9 8v7"/>
                <path d="M18 16l5-6h13l7 6"/>

                <circle
                    cx="17"
                    cy="34"
                    r="5"/>

                <circle
                    cx="41"
                    cy="34"
                    r="5"/>

                <path d="M8 31h-2M48 31h2"/>

            </svg>

            <div class="amenity-title">
                Free Parking
            </div>

        </div>


        <!-- High-Speed Wi-Fi -->

        <div class="amenity compound">

            <svg
                class="amenity-icon"
                viewBox="0 0 48 48"
                aria-hidden="true">

                <path d="M5 18a28 28 0 0 1 38 0"/>
                <path d="M10 24a20 20 0 0 1 28 0"/>
                <path d="M16 30a12 12 0 0 1 16 0"/>
                <circle
                    cx="24"
                    cy="36"
                    r="1.7"/>

            </svg>

            <div class="amenity-title">
                High-Speed<br>
                Wi-Fi
            </div>

        </div>

    </section>


    <div class="divider"></div>


    <!-- =====================================================
         FOUR CARDS
         ===================================================== -->

    <section
        class="cards"
        aria-label="Explore 303 Oyster Bay">


        <!-- YOUR STAY -->

        <a
            class="card"
            href="arrival-guide.html">

            <img
                src="your-stay.PNG"
                alt="Your Stay">

            <div class="card-label">
                Your Stay
            </div>

            <span
                class="card-arrow"
                aria-hidden="true">
                →
            </span>

        </a>


        <!-- THE APARTMENT -->

        <a
            class="card"
            href="The%20Apartment.pdf">

            <img
                src="apartment.jpg"
                alt="The Apartment">

            <div class="card-label">
                The Apartment
            </div>

            <span
                class="card-arrow"
                aria-hidden="true">
                →
            </span>

        </a>


        <!-- EXPLORE -->

        <a
            class="card"
            href="In%20and%20around.pdf">

            <img
                src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Surathkal%20Light%20House%20Beach%20and%20Boats%20Karnataka%20India.jpg"
                alt="Surathkal Lighthouse and Beach">

            <div class="card-label">
                Explore
            </div>

            <span
                class="card-arrow"
                aria-hidden="true">
                →
            </span>

        </a>


        <!-- GALLERY -->

        <a
            class="card"
            href="gallery.html">

            <img
                src="gallery.jpg"
                alt="Gallery">

            <div class="card-label">
                Gallery
            </div>

            <span
                class="card-arrow"
                aria-hidden="true">
                →
            </span>

        </a>


        <!-- =================================================
             HANDWRITTEN CLOSING
             ================================================= -->

        <div class="signature">
            See you by the Sea
        </div>

    </section>

</div>


<!-- =========================================================
     BOTTOM BEACH DECORATION
     ========================================================= -->

<div class="bottom-beach">

    <div class="grass left">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="grass right">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="shell-large"></div>

    <div class="shell-small shell-one"></div>

    <div class="shell-small shell-two"></div>

</div>

</main>

</body>
</html>
