<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>303 Oyster Bay — Surathkal, Mangaluru</title>

  <meta
    name="description"
    content="303 Oyster Bay — a beachside stay in Surathkal, Mangaluru."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;

      background: #d8ad78;

      color: #4a2e18;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================================
       PAGE / FULL SAND BACKGROUND
       ========================================================= */

    .page {
      position: relative;
      isolation: isolate;

      min-height: 100vh;

      overflow: hidden;

      padding:
        clamp(22px, 4vw, 48px)
        clamp(18px, 5vw, 64px)
        34px;
    }

    .page::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: -1;

      background:
        linear-gradient(
          rgba(215, 172, 118, 0.04),
          rgba(215, 172, 118, 0.04)
        ),
        url("sand-background.png")
        center top / cover no-repeat;

      background-color: #d8ad78;
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;

      width: min(100%, 1080px);

      margin: 0 auto;

      text-align: center;
    }


    /* =========================================================
       GUEST FAVOURITE
       ========================================================= */

    .guest-favourite {
      position: absolute;

      top: -2px;
      right: 0;

      width:
        clamp(78px, 12vw, 125px);

      z-index: 5;

      display: block;
    }

    .guest-favourite img {
      width: 100%;
      height: auto;

      display: block;
    }


    /* =========================================================
       LOGO
       ========================================================= */

    .logo {
      display: block;

      width:
        min(64vw, 390px);

      height: auto;

      margin:
        clamp(10px, 2vw, 20px)
        auto
        4px;
    }


    /* =========================================================
       TAGLINE
       ========================================================= */

    .tagline {
      margin:
        4px
        0
        clamp(15px, 2vw, 23px);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(17px, 2.1vw, 23px);

      font-style: italic;

      font-weight: 400;

      letter-spacing: 0.01em;

      line-height: 1.1;

      color: #51321b;
    }


    /* =========================================================
       AMENITIES
       ========================================================= */

    .amenities {
      width: min(100%, 1080px);

      margin:
        0
        auto
        clamp(18px, 2.5vw, 27px);

      padding:
        11px
        0
        12px;

      border-top:
        1px solid
        rgba(74, 46, 24, 0.34);

      border-bottom:
        1px solid
        rgba(74, 46, 24, 0.34);

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      text-align: center;
    }


    /* =========================================================
       INDIVIDUAL AMENITY
       ========================================================= */

    .amenity {
      min-width: 0;

      padding:
        0
        clamp(5px, 1.4vw, 16px);

      border-right:
        1px solid
        rgba(74, 46, 24, 0.26);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;
    }

    .amenity:last-child {
      border-right: none;
    }


    /* =========================================================
       AMENITY ICON
       ========================================================= */

    .amenity-icon {
      width: 25px;
      height: 25px;

      margin:
        0
        auto
        5px;

      flex: 0 0 auto;
    }

    .amenity-icon svg {
      width: 100%;
      height: 100%;

      display: block;

      fill: none;

      stroke: #56351d;

      stroke-width: 1.65;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* =========================================================
       AMENITY TYPOGRAPHY

       All feature names use the SAME type family and weight.

       Only the first feature has a deliberately smaller
       second line because "Sleeps 4 + 1" is separate information.
       ========================================================= */

    .amenity-title {
      width: 100%;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(12px, 1.65vw, 18px);

      font-weight: 500;

      line-height: 1.05;

      color: #4f3019;
    }

    .amenity-subtitle {
      width: 100%;

      margin-top: 1px;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(11px, 1.45vw, 16px);

      font-weight: 400;

      font-style: italic;

      line-height: 1.0;

      color: #4f3019;
    }

    /*
       Compound features are one thought.
       They are NOT styled as title + subtitle.
    */

    .amenity.compound .amenity-title {
      font-size:
        clamp(11.5px, 1.55vw, 17px);

      line-height: 1.05;
    }


    /* =========================================================
       PHOTO GRID
       ========================================================= */

    .cards {
      width: min(100%, 1080px);

      margin:
        0
        auto;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        clamp(13px, 2vw, 23px);
    }


    /* =========================================================
       CARD
       ========================================================= */

    .card {
      position: relative;

      display: flex;

      flex-direction: column;

      overflow: hidden;

      background: #f8f1e5;

      border:
        1px solid
        rgba(74, 46, 24, 0.12);

      box-shadow:
        0
        4px
        14px
        rgba(62, 36, 16, 0.12);

      border-radius: 2px;

      transition:
        box-shadow
        0.25s
        ease;
    }

    .card:hover {
      box-shadow:
        0
        7px
        20px
        rgba(62, 36, 16, 0.18);
    }


    /* =========================================================
       CARD IMAGE
       ========================================================= */

    .card-image {
      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      display: block;
    }


    /* =========================================================
       CARD LABEL
       ========================================================= */

    .card-label {
      min-height:
        clamp(50px, 5.7vw, 68px);

      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        7px
        42px
        7px
        15px;

      background:
        rgba(250, 246, 238, 0.96);

      color: #4c2f1a;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(19px, 2.45vw, 28px);

      font-weight: 600;

      line-height: 1;

      text-align: center;
    }

    .card-arrow {
      position: absolute;

      right: 16px;

      top: 50%;

      transform:
        translateY(-50%);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 22px;

      font-weight: 300;

      line-height: 1;
    }


    /* =========================================================
       SIGN-OFF
       ========================================================= */

    .closing {
      width: min(100%, 1080px);

      margin:
        22px
        auto
        0;

      display: flex;

      justify-content: flex-end;

      padding-right:
        clamp(4px, 1vw, 12px);
    }

    .signature {
      font-family:
        "Allura",
        "Brush Script MT",
        cursive;

      font-size:
        clamp(27px, 4vw, 42px);

      line-height: 0.9;

      text-align: right;

      color: #4b2d18;

      transform:
        rotate(-3deg);

      transform-origin:
        right center;
    }

    .signature span {
      display: block;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .page {
        padding:
          18px
          12px
          28px;
      }


      /* Guest Favourite remains independent of centred logo */

      .guest-favourite {
        top: -2px;
        right: 0;

        width: 84px;
      }


      /* Logo remains centred */

      .logo {
        width:
          min(66vw, 330px);

        margin-top:
          13px;
      }


      /* Understated tagline */

      .tagline {
        font-size: 18px;

        margin-bottom:
          17px;
      }


      /* Shorter feature strip */

      .amenities {
        padding:
          10px
          0
          11px;

        margin-bottom:
          17px;
      }

      .amenity {
        padding:
          0
          3px;
      }


      /* Smaller icons */

      .amenity-icon {
        width: 22px;
        height: 22px;

        margin-bottom:
          4px;
      }


      /* Same font family throughout */

      .amenity-title {
        font-size: 11.5px;

        line-height: 1.03;
      }

      .amenity-subtitle {
        font-size: 10.5px;

        line-height: 1.0;
      }

      .amenity.compound .amenity-title {
        font-size: 10.8px;

        line-height: 1.02;
      }


      /* Equal 2 x 2 cards */

      .cards {
        gap: 11px;
      }

      .card {
        height: auto;
      }

      .card-image {
        aspect-ratio: 4 / 3;
      }

      .card-label {
        min-height: 47px;

        font-size: 18px;

        padding:
          7px
          31px
          7px
          12px;
      }

      .card-arrow {
        right: 10px;

        font-size: 18px;
      }


      /* Signature */

      .closing {
        margin-top: 20px;
      }

      .signature {
        font-size: 30px;
      }
    }


    /* =========================================================
       SMALL PHONES
       ========================================================= */

    @media (max-width: 390px) {

      .guest-favourite {
        width: 78px;
      }

      .logo {
        width: 64vw;
      }

      .tagline {
        font-size: 17px;
      }

      .amenity-icon {
        width: 21px;
        height: 21px;
      }

      .amenity-title {
        font-size: 10.8px;
      }

      .amenity-subtitle {
        font-size: 9.8px;
      }

      .amenity.compound .amenity-title {
        font-size: 10.2px;
      }

      .card-label {
        font-size: 17px;
      }

      .signature {
        font-size: 28px;
      }
    }


    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      .card {
        transition: none;
      }
    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =======================================================
         HERO
         ======================================================= -->

    <section
      class="hero"
      aria-label="303 Oyster Bay"
    >

      <!-- Guest Favourite badge -->
      <div class="guest-favourite">

        <img
          src="guest-favourite.png"
          alt="Airbnb Guest Favourite"
        >

      </div>


      <!-- Centred logo -->
      <img
        class="logo"
        src="logo.png"
        alt="303 Oyster Bay — Surathkal, Mangaluru"
      >


      <!-- Tagline -->
      <p class="tagline">
        Where the sea slows you down.
      </p>

    </section>


    <!-- =======================================================
         AMENITIES
         ======================================================= -->

    <section
      class="amenities"
      aria-label="Property features"
    >


      <!-- 2 Bedrooms / Sleeps 4 + 1 -->

      <div class="amenity">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path d="M4 24V10" />

            <path d="M4 15H28V24" />

            <path
              d="
                M7 15V12
                C7 10.9 7.9 10 9 10
                H14
                C15.1 10 16 10.9 16 12
                V15
              "
            />

            <path d="M4 24H29" />

          </svg>

        </div>

        <div class="amenity-title">
          2 Bedrooms
        </div>

        <div class="amenity-subtitle">
          Sleeps 4 + 1
        </div>

      </div>


      <!-- Uninterrupted Sea Views -->

      <div class="amenity compound">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path
              d="
                M3 10
                C6 10 6 7 9 7
                C12 7 12 10 15 10
                C18 10 18 7 21 7
                C24 7 24 10 29 10
              "
            />

            <path
              d="
                M3 16
                C6 16 6 13 9 13
                C12 13 12 16 15 16
                C18 16 18 13 21 13
                C24 13 24 16 29 16
              "
            />

            <path
              d="
                M3 22
                C6 22 6 19 9 19
                C12 19 12 22 15 22
                C18 22 18 19 21 19
                C24 19 24 22 29 22
              "
            />

          </svg>

        </div>

        <div class="amenity-title">
          Uninterrupted<br>Sea Views
        </div>

      </div>


      <!-- Full Kitchen -->

      <div class="amenity compound">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <rect
              x="4"
              y="4"
              width="24"
              height="24"
              rx="2"
            />

            <circle
              cx="11"
              cy="11"
              r="3"
            />

            <circle
              cx="21"
              cy="11"
              r="3"
            />

            <circle
              cx="11"
              cy="21"
              r="3"
            />

            <circle
              cx="21"
              cy="21"
              r="3"
            />

          </svg>

        </div>

        <div class="amenity-title">
          Full Kitchen
        </div>

      </div>


      <!-- Free Parking -->

      <div class="amenity compound">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path d="M5 21L7 14L10 10H22L25 14L27 21" />

            <path d="M5 21V24H8V22H24V24H27V21" />

            <path d="M7 14H25" />

            <path d="M10 10L12 6H20L22 10" />

            <circle
              cx="10"
              cy="21"
              r="1.5"
            />

            <circle
              cx="22"
              cy="21"
              r="1.5"
            />

          </svg>

        </div>

        <div class="amenity-title">
          Free Parking
        </div>

      </div>


      <!-- High-Speed Wi-Fi -->

      <div class="amenity compound">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path d="M5 12C12 6 20 6 27 12" />

            <path d="M9 17C14 13 18 13 23 17" />

            <path d="M13 21C16 19 16 19 19 21" />

            <circle
              cx="16"
              cy="25"
              r="1"
              fill="#56351d"
              stroke="none"
            />

          </svg>

        </div>

        <div class="amenity-title">
          High-Speed<br>Wi-Fi
        </div>

      </div>

    </section>


    <!-- =======================================================
         PHOTO CARDS
         ======================================================= -->

    <section
      class="cards"
      aria-label="303 Oyster Bay sections"
    >


      <!-- =====================================================
           YOUR STAY
           ===================================================== -->

      <a
        class="card"
        href="arrival-guide.html"
        aria-label="Your Stay"
      >

        <img
          class="card-image"
          src="your-stay.PNG"
          alt="Balcony and sea view at 303 Oyster Bay"
        >

        <div class="card-label">

          <span>
            Your Stay
          </span>

          <span class="card-arrow">
            →
          </span>

        </div>

      </a>


      <!-- =====================================================
           THE APARTMENT
           ===================================================== -->

      <a
        class="card"
        href="The%20Apartment.pdf"
        aria-label="The Apartment"
      >

        <img
          class="card-image"
          src="apartment.jpg"
          alt="Interior of 303 Oyster Bay"
        >

        <div class="card-label">

          <span>
            The Apartment
          </span>

          <span class="card-arrow">
            →
          </span>

        </div>

      </a>


      <!-- =====================================================
           EXPLORE
           ===================================================== -->

      <a
        class="card"
        href="In%20and%20around.pdf"
        aria-label="Explore Surathkal and the coast"
      >

        <img
          class="card-image"
          src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Surathkal%20Light%20House%20Beach%20and%20Boats%20Karnataka%20India.jpg"
          alt="Surathkal Lighthouse, beach and boats"
        >

        <div class="card-label">

          <span>
            Explore
          </span>

          <span class="card-arrow">
            →
          </span>

        </div>

      </a>


      <!-- =====================================================
           GALLERY
           ===================================================== -->

      <a
        class="card"
        href="gallery.html"
        aria-label="Gallery"
      >

        <img
          class="card-image"
          src="gallery.jpg"
          alt="303 Oyster Bay exterior"
        >

        <div class="card-label">

          <span>
            Gallery
          </span>

          <span class="card-arrow">
            →
          </span>

        </div>

      </a>

    </section>


    <!-- =======================================================
         SIGNATURE
         ======================================================= -->

    <div class="closing">

      <div class="signature">

        <span>
          Sea you
        </span>

        <span>
          by the sea
        </span>

      </div>

    </div>


  </main>

</body>
</html>
