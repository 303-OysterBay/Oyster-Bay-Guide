<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:#d8ad78;
  color:#4b2f1b;
  font-family:"Cormorant Garamond",serif;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
  width:100%;
  min-height:100vh;

  padding:
    18px
    10px
    55px;

  background:
    linear-gradient(
      rgba(215,172,118,.04),
      rgba(215,172,118,.04)
    ),
    url("sand-background.png")
    center top /
    cover
    no-repeat;

  overflow:hidden;
}


.hero{
  position:relative;
  width:100%;
  max-width:1120px;
  margin:0 auto;
  text-align:center;
}


/* =========================================================
   AIRBNB GUEST FAVOURITE
   KEPT COMPLETELY INDEPENDENT OF THE MAIN CONTENT
   ========================================================= */

.guest-favourite-wrap{
  position:absolute;

  top:0;
  right:0;

  width:78px;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:20;
}

.guest-favourite{
  display:block;
  width:100%;
  height:auto;

  /* tiny optical correction only */
  transform:translateX(-2px);
}


/* =========================================================
   MAIN LOGO
   CONTENT STARTS LOWER, WHILE GUEST FAVOURITE DOES NOT MOVE
   ========================================================= */

.logo{
  display:block;

  width:min(66vw,330px);
  height:auto;

  margin:52px auto 0;
}


/* =========================================================
   TAGLINE
   ========================================================= */

.tagline{
  margin:2px auto 14px;

  font-size:17px;
  line-height:1.05;

  font-style:italic;
  font-weight:500;

  letter-spacing:.01em;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider{
  width:100%;
  height:1px;

  background:rgba(75,47,27,.48);

  margin:0 auto;
}


/* =========================================================
   FEATURES
   ========================================================= */

.amenities{
  display:grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  width:100%;
  max-width:1000px;

  margin:0 auto;

  padding:9px 0 10px;
}

.amenity{
  min-width:0;

  padding:0 4px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:flex-start;

  position:relative;
}

.amenity:not(:last-child)::after{
  content:"";

  position:absolute;

  right:0;
  top:1px;

  width:1px;
  height:57px;

  background:rgba(75,47,27,.43);
}


/* ORIGINAL ELEGANT ICONS */

.amenity-icon{
  width:22px;
  height:22px;

  margin-bottom:4px;

  color:#4b2f1b;
  stroke:#4b2f1b;

  stroke-width:1.65;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.amenity-title{
  color:#4b2f1b;

  font-size:13px;
  line-height:.98;

  font-weight:500;

  letter-spacing:-.01em;
}

.amenity.compound .amenity-title{
  font-size:12.5px;
}

.amenity-subtitle{
  margin-top:1px;

  color:#4b2f1b;

  font-size:11.5px;
  line-height:1;

  font-style:italic;
  font-weight:400;
}


/* =========================================================
   CARD AREA
   IMPORTANT:
   position:relative allows the signature to be positioned
   against this area without affecting the grid.
   ========================================================= */

.cards{
  position:relative;

  width:100%;
  max-width:1120px;

  margin:9px auto 0;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:9px;
}


/* =========================================================
   INDIVIDUAL CARD
   ========================================================= */

.card{
  display:block;

  position:relative;

  width:100%;

  aspect-ratio:4 / 3;

  overflow:hidden;

  border-radius:2px;

  background:#f7eee2;

  color:#4b2f1b;

  text-decoration:none;

  box-shadow:
    0 4px 13px
    rgba(55,30,12,.22);
}

.card img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
}


/* =========================================================
   CARD LABEL
   ========================================================= */

.card-label{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  min-height:31px;

  padding:
    5px
    38px
    5px
    7px;

  background:rgba(250,243,234,.94);

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:17px;

  line-height:1;

  font-weight:500;

  text-align:center;

  z-index:3;
}


/* =========================================================
   ARROW
   ANCHORED TO THE CARD ITSELF
   ========================================================= */

.card-arrow{
  position:absolute;

  right:9px;
  bottom:6px;

  z-index:6;

  font-family:Arial,sans-serif;

  font-size:17px;
  line-height:19px;

  font-weight:300;

  color:#4b2f1b;
}


/* =========================================================
   HANDWRITTEN SIGNATURE

   CRITICAL:
   This is absolutely positioned against .cards.

   It therefore CANNOT:
   - shrink the cards
   - move the cards
   - push Gallery away
   - change the grid height
   ========================================================= */

.signature{
  position:absolute;

  z-index:8;

  left:50%;

  width:78%;

  bottom:-34px;

  transform:
    translateX(-50%)
    rotate(-10deg);

  transform-origin:center center;

  font-family:"Allura",cursive;

  font-size:28px;

  line-height:1;

  font-weight:400;

  color:#4b2f1b;

  white-space:nowrap;

  text-align:center;

  pointer-events:none;
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width:701px){

  .page{
    padding:
      28px
      4vw
      70px;
  }

  .guest-favourite-wrap{
    top:0;
    right:0;

    width:clamp(82px,11vw,118px);
  }

  .guest-favourite{
    transform:translateX(-3px);
  }

  .logo{
    width:min(64vw,390px);

    margin:56px auto 0;
  }

  .tagline{
    margin:
      3px auto
      18px;

    font-size:
      clamp(17px,2.15vw,23px);
  }

  .amenities{
    padding:
      11px 0
      12px;
  }

  .amenity{
    padding:0 10px;
  }

  .amenity:not(:last-child)::after{
    height:66px;
    top:2px;
  }

  .amenity-icon{
    width:27px;
    height:27px;

    margin-bottom:5px;
  }

  .amenity-title{
    font-size:
      clamp(14px,1.75vw,19px);
  }

  .amenity.compound .amenity-title{
    font-size:
      clamp(13px,1.65vw,18px);
  }

  .amenity-subtitle{
    font-size:
      clamp(12px,1.5vw,16px);
  }

  .cards{
    margin-top:9px;
    gap:16px;
  }

  .card-label{
    min-height:39px;

    padding:
      6px
      46px
      6px
      12px;

    font-size:
      clamp(17px,2.2vw,25px);
  }

  .card-arrow{
    right:13px;
    bottom:10px;

    font-size:21px;
    line-height:22px;
  }

  .signature{
    width:72%;

    bottom:-47px;

    font-size:
      clamp(30px,3.4vw,43px);

    transform:
      translateX(-50%)
      rotate(-10deg);
  }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width:700px){

  .page{
    padding:
      18px
      10px
      60px;
  }

  /*
    Badge stays at the very top-right.
    It does NOT move down with the logo.
  */

  .guest-favourite-wrap{
    top:0;
    right:0;

    width:78px;
  }

  .guest-favourite{
    transform:translateX(-2px);
  }


  /*
    Extra breathing space is created here only.
    This moves the logo/content down WITHOUT moving
    the Guest Favourite badge.
  */

  .logo{
    width:min(66vw,330px);

    margin:52px auto 0;
  }


  .tagline{
    margin:
      2px auto
      14px;

    font-size:17px;
  }


  .amenities{
    padding:
      9px 0
      10px;
  }


  .amenity{
    padding:
      0 4px;
  }


  .amenity:not(:last-child)::after{
    height:57px;
    top:1px;
  }


  /* Thin elegant icons retained */
  .amenity-icon{
    width:22px;
    height:22px;

    margin-bottom:4px;

    stroke-width:1.65;
  }


  .amenity-title{
    font-size:13px;
    line-height:.98;
  }

  .amenity.compound .amenity-title{
    font-size:12.5px;
  }

  .amenity-subtitle{
    font-size:11.5px;
  }


  /*
    Fixed two-column grid.
    Nothing below is allowed to affect its dimensions.
  */

  .cards{
    margin-top:9px;

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:9px;
  }


  .card{
    aspect-ratio:4 / 3;
  }


  .card-label{
    min-height:31px;

    padding:
      5px
      38px
      5px
      7px;

    font-size:17px;
  }


  /*
    Each arrow remains physically attached
    to its own card.
  */

  .card-arrow{
    right:9px;
    bottom:6px;

    font-size:17px;
    line-height:19px;
  }


  /*
    SIGNATURE

    It is now a true handwritten overlay.
    It rises from lower-left toward upper-right.

    Because it is absolutely positioned against
    .cards, it cannot alter Gallery or Explore.
  */

  .signature{
    left:50%;

    width:78%;

    bottom:-30px;

    font-size:25px;

    transform:
      translateX(-50%)
      rotate(-10deg);
  }

}

</style>
</head>


<body>

<main class="page">

  <div class="hero">


    <!-- =====================================================
         AIRBNB GUEST FAVOURITE
         ===================================================== -->

    <div class="guest-favourite-wrap">

      <img
        class="guest-favourite"
        src="guest-favourite.png"
        alt="Airbnb Guest Favourite">

    </div>


    <!-- =====================================================
         MAIN LOGO
         ===================================================== -->

    <img
      class="logo"
      src="logo.png"
      alt="303 Oyster Bay">


    <!-- =====================================================
         TAGLINE
         ===================================================== -->

    <div class="tagline">
      Where the sea slows you down.
    </div>


    <div class="divider"></div>


    <!-- =====================================================
         FEATURES
         ===================================================== -->

    <section
      class="amenities"
      aria-label="Apartment features">


      <!-- 2 Bedrooms -->

      <div class="amenity">

        <svg
          class="amenity-icon"
          viewBox="0 0 48 48"
          aria-hidden="true">

          <path d="M6 31V18h24c7 0 12 4 12 10v3H6Z"/>
          <path d="M6 31v8M42 31v8M6 35h36"/>
          <path d="M9 18v-5h13v5"/>

        </svg>

        <div class="amenity-title">
          2 Bedrooms
        </div>

        <div class="amenity-subtitle">
          Sleeps 4 + 1
        </div>

      </div>


      <!-- Uninterrupted Sea Views -->

      <div class="amenity compound">

        <svg
          class="amenity-icon"
          viewBox="0 0 48 48"
          aria-hidden="true">

          <path d="M4 16c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 8 4 4-4 8-4"/>
          <path d="M4 24c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 8 4 4-4 8-4"/>
          <path d="M4 32c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 8 4 4-4 8-4"/>

        </svg>

        <div class="amenity-title">
          Uninterrupted<br>
          Sea Views
        </div>

      </div>


      <!-- Full Kitchen -->

      <div class="amenity compound">

        <svg
          class="amenity-icon"
          viewBox="0 0 48 48"
          aria-hidden="true">

          <rect
            x="7"
            y="7"
            width="34"
            height="34"
            rx="3"/>

          <circle
            cx="17"
            cy="17"
            r="5"/>

          <circle
            cx="31"
            cy="17"
            r="5"/>

          <circle
            cx="17"
            cy="31"
            r="5"/>

          <circle
            cx="31"
            cy="31"
            r="5"/>

        </svg>

        <div class="amenity-title">
          Full Kitchen
        </div>

      </div>


      <!-- Free Parking -->

      <div class="amenity compound">

        <svg
          class="amenity-icon"
          viewBox="0 0 56 48"
          aria-hidden="true">

          <path d="M8 31h40"/>
          <path d="M11 31v-7l7-8h21l9 8v7"/>
          <path d="M18 16l5-6h13l7 6"/>

          <circle
            cx="17"
            cy="34"
            r="5"/>

          <circle
            cx="41"
            cy="34"
            r="5"/>

          <path d="M8 31h-2M48 31h2"/>

        </svg>

        <div class="amenity-title">
          Free Parking
        </div>

      </div>


      <!-- High-Speed Wi-Fi -->

      <div class="amenity compound">

        <svg
          class="amenity-icon"
          viewBox="0 0 48 48"
          aria-hidden="true">

          <path d="M14 30a5 5 0 0 1 7 0"/>
          <path d="M9 25a12 12 0 0 1 17 0"/>
          <path d="M4 20a19 19 0 0 1 27 0"/>

          <circle
            cx="24"
            cy="34"
            r="2.2"
            fill="currentColor"
            stroke="none"/>

        </svg>

        <div class="amenity-title">
          High-Speed<br>
          Wi-Fi
        </div>

      </div>

    </section>


    <div class="divider"></div>


    <!-- =====================================================
         CARDS
         ===================================================== -->

    <section
      class="cards"
      aria-label="Explore 303 Oyster Bay">


      <!-- YOUR STAY -->

      <a
        class="card"
        href="arrival-guide.html">

        <img
          src="your-stay.PNG"
          alt="Your Stay">

        <div class="card-label">
          Your Stay
        </div>

        <span
          class="card-arrow"
          aria-hidden="true">
          →
        </span>

      </a>


      <!-- THE APARTMENT -->

      <a
        class="card"
        href="The%20Apartment.pdf">

        <img
          src="apartment.jpg"
          alt="The Apartment">

        <div class="card-label">
          The Apartment
        </div>

        <span
          class="card-arrow"
          aria-hidden="true">
          →
        </span>

      </a>


      <!-- EXPLORE -->

      <a
        class="card"
        href="In%20and%20around.pdf">

        <img
          src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Surathkal%20Light%20House%20Beach%20and%20Boats%20Karnataka%20India.jpg"
          alt="Surathkal Lighthouse and Beach">

        <div class="card-label">
          Explore
        </div>

        <span
          class="card-arrow"
          aria-hidden="true">
          →
        </span>

      </a>


      <!-- GALLERY -->

      <a
        class="card"
        href="gallery.html">

        <img
          src="gallery.jpg"
          alt="Gallery">

        <div class="card-label">
          Gallery
        </div>

        <span
          class="card-arrow"
          aria-hidden="true">
          →
        </span>

      </a>


      <!-- =================================================
           HANDWRITTEN SIGNATURE
           ABSOLUTELY POSITIONED INSIDE CARD AREA
           ================================================= -->

      <div class="signature">
        See you by the Sea
      </div>

    </section>

  </div>

</main>

</body>
</html>
