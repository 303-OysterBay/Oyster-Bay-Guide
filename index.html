<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>303 OYSTER BAY • Home</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body {
    width:100%;
    height:100%;
    overflow:hidden;
}

body {
    background:#e7d3b1;
    color:#463322;
    font-family:Georgia, "Times New Roman", serif;
}


/* =========================================================
   HOME PAGE
   ========================================================= */

.home-page {
    position:relative;

    width:100%;
    height:100vh;
    height:100svh;
    height:100dvh;

    overflow:hidden;

    background-image:url("sand-background.jpg");
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
}


/* =========================================================
   BRAND / TOP AREA
   ========================================================= */

.top-area {
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:29%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}


/* LARGE LOGO */

.logo {
    display:block;

    width:178px;
    height:auto;

    margin-bottom:5px;
}


/* SMALL SUB-SUB HEAD */

.tagline {
    font-size:15px;
    line-height:1.15;
    font-weight:normal;

    letter-spacing:.5px;

    color:rgba(70,51,34,.82);

    max-width:300px;
}


/* =========================================================
   FOUR MAIN DESTINATION CARDS
   ========================================================= */

.home-grid {
    position:absolute;

    left:14px;
    right:14px;

    top:29%;
    bottom:18%;

    display:grid;

    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:12px;
}


/* CARD */

.home-card {
    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    overflow:hidden;

    border-radius:20px;

    text-decoration:none;

    color:#fff;

    background:#80664b;

    box-shadow:
        0 3px 10px rgba(65,40,20,.22);

    isolation:isolate;
}


/* PHOTO */

.home-card img {
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;
}


/* PHOTO DARKENING */

.home-card::after {
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to top,
            rgba(35,22,12,.76) 0%,
            rgba(35,22,12,.30) 42%,
            rgba(35,22,12,.03) 74%
        );

    z-index:-1;
}


/* CARD COPY */

.card-copy {
    position:relative;

    padding:14px 15px 15px;
}


/* CARD TITLE */

.card-title {
    font-size:25px;

    line-height:1;

    margin-bottom:5px;
}


/* CARD DESCRIPTION */

.card-description {
    font-family:Arial, Helvetica, sans-serif;

    font-size:10px;

    letter-spacing:.3px;

    line-height:1.25;

    opacity:.96;

    max-width:82%;
}


/* ROUND ARROW */

.card-arrow {
    position:absolute;

    right:13px;
    bottom:13px;

    width:30px;
    height:30px;

    border:1px solid rgba(255,255,255,.78);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Arial, Helvetica, sans-serif;

    font-size:17px;

    background:rgba(255,255,255,.10);
}


/* =========================================================
   FEATURES BAND
   ========================================================= */

.features-band {
    position:absolute;

    left:14px;
    right:14px;

    bottom:4%;

    height:11%;

    min-height:62px;

    display:flex;

    align-items:stretch;
    justify-content:center;

    background:rgba(244,234,215,.94);

    border:1px solid rgba(255,255,255,.72);

    border-radius:24px;

    box-shadow:
        0 3px 9px rgba(65,40,20,.13);

    overflow:hidden;
}


/* INDIVIDUAL FEATURE */

.feature {
    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:5px 3px;

    color:#463322;
}


/* DIVIDERS */

.feature + .feature {
    border-left:1px solid rgba(70,51,34,.22);
}


/* SIMPLE LINE ICON */

.feature-icon {
    width:25px;
    height:25px;

    margin-bottom:4px;

    fill:none;

    stroke:#463322;

    stroke-width:2.6;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* FEATURE TEXT */

.feature-title {
    font-family:Arial, Helvetica, sans-serif;

    font-size:8px;

    line-height:1.15;

    letter-spacing:.15px;
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width:390px) {

    .top-area {
        height:28%;
    }

    .logo {
        width:158px;
        margin-bottom:4px;
    }

    .tagline {
        font-size:13px;
    }

    .home-grid {
        top:28%;
        bottom:19%;

        gap:9px;
    }

    .home-card {
        border-radius:17px;
    }

    .card-copy {
        padding:11px 11px 12px;
    }

    .card-title {
        font-size:21px;
    }

    .card-description {
        font-size:8.5px;
    }

    .card-arrow {
        width:27px;
        height:27px;

        right:10px;
        bottom:10px;
    }

    .features-band {
        left:10px;
        right:10px;

        bottom:3%;

        height:13%;

        min-height:58px;

        border-radius:20px;
    }

  
    }

    .feature-title {
        font-size:7px;
    }
}


/* =========================================================
   VERY SHORT SCREENS
   ========================================================= */

@media (max-height:700px) {

    .top-area {
        height:25%;
    }

    .logo {
        width:145px;
    }

    .tagline {
        font-size:12px;
    }

    .home-grid {
        top:25%;
        bottom:20%;

        gap:8px;
    }

    .features-band {
        bottom:2%;
        height:16%;
    }
}

</style>

</head>


<body>


<div class="home-page">


    <!-- =====================================================
         BRAND
         ===================================================== -->

    <header class="top-area">

        <img
            src="logo.png"
            alt="303 Oyster Bay"

        >

        <h1 class="tagline">
            Where the sea slows you down.
        </h1>

    </header>



    <!-- =====================================================
         FOUR DESTINATIONS
         ===================================================== -->

    <main class="home-grid">


        <!-- STAY -->

        <a
            href="arrival-guide.html"
            class="home-card"
        >

            <img
                src="Sea View1.jpg"
                alt="Stay at 303 Oyster Bay"
            >

            <div class="card-copy">

                <div class="card-title">
                    Stay
                </div>

                <div class="card-description">
                    Arrival • Wi-Fi • House Rules
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>



        <!-- LIVE -->

        <a
            href="live.html"
            class="home-card"
        >

            <img
                src="Living1.jpg"
                alt="Live at 303 Oyster Bay"
            >

            <div class="card-copy">

                <div class="card-title">
                    Live
                </div>

                <div class="card-description">
                    Rooms • Comfort • Kitchen
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>



        <!-- EXPLORE -->

        <a
            href="In%20and%20around.pdf"
            class="home-card"
        >

            <img
                src="Lighthouse.jpg"
                alt="Explore Mangaluru"
            >

            <div class="card-copy">

                <div class="card-title">
                    Explore
                </div>

                <div class="card-description">
                    Beaches • Food • Mangaluru
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>



        <!-- REMEMBER -->

        <a
            href="Remember.html"
            class="home-card"
        >

            <img
                src="Bedroom1.jpg"
                alt="Remember 303 Oyster Bay"
            >

            <div class="card-copy">

                <div class="card-title">
                    Remember
                </div>

                <div class="card-description">
                    Sea Views • Living • Bedroom • Kitchen
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>


    </main>



    <!-- =====================================================
         PROPERTY FEATURES
         ===================================================== -->

    <section class="features-band">


        <!-- 2 BEDROOMS -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M3 11v9"></path>
                <path d="M21 11v9"></path>
                <path d="M3 15h18"></path>
                <path d="M5 15V9a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3v5"></path>
                <path d="M14 11h4a3 3 0 0 1 3 3"></path>
            </svg>

            <div class="feature-title">
                2 Bedrooms
            </div>

        </div>



        <!-- SLEEPS -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle cx="8" cy="8" r="3"></circle>
                <circle cx="17" cy="9" r="2.5"></circle>
                <path d="M3 20c0-3 2.2-5 5-5s5 2 5 5"></path>
                <path d="M14 20c0-2.4 1.4-4 3.5-4 2 0 3.5 1.6 3.5 4"></path>
            </svg>

            <div class="feature-title">
                Sleeps 4+1
            </div>

        </div>



        <!-- WI-FI -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M3 8.5a14 14 0 0 1 18 0"></path>
                <path d="M6 12a9.5 9.5 0 0 1 12 0"></path>
                <path d="M9.5 15.5a5 5 0 0 1 5 0"></path>
                <circle cx="12" cy="19" r="1"></circle>
            </svg>

            <div class="feature-title">
                Hi-Speed Wi-Fi
            </div>

        </div>



        <!-- PARKING -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M5 17l1.5-6h11L19 17"></path>
                <path d="M4 17h16"></path>
                <path d="M7 17v2"></path>
                <path d="M17 17v2"></path>
                <circle cx="7.5" cy="15.5" r="1"></circle>
                <circle cx="16.5" cy="15.5" r="1"></circle>
            </svg>

            <div class="feature-title">
                Free Parking
            </div>

        </div>



        <!-- FULL KITCHEN -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M5 3v8"></path>
                <path d="M3 3v5a2 2 0 0 0 4 0V3"></path>
                <path d="M5 11v10"></path>
                <path d="M14 3v18"></path>
                <path d="M14 3c4 2 5 5 0 8"></path>
            </svg>

            <div class="feature-title">
                Full Kitchen
            </div>

        </div>


    </section>


</div>


</body>
</html>
