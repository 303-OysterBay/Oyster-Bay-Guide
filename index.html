<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>303 OYSTER BAY • Home</title>

<style>

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body {
    width:100%;
    height:100%;
    overflow:hidden;
}

body {
    background:#e7d3b1;
    color:#463322;
    font-family:Georgia, "Times New Roman", serif;
}

/* =========================================================
   HOME PAGE
   ========================================================= */

.home-page {
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    height:100dvh;
    overflow:hidden;

    background-image:url("sand-background.jpg");
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
}

/* =========================================================
   TOP AREA
   ========================================================= */

.top-area {
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:34%;
    
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.logo {
    display:block;
    width:150px;
    height:auto;
    margin-bottom:8px;
}

.welcome {
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:8px;
    color:rgba(70,51,34,.78);
}

.tagline {
    font-size:25px;
    line-height:1.08;
    font-weight:normal;
    color:#463322;
    max-width:330px;
}

.subline {
    margin-top:9px;
    font-size:12px;
    letter-spacing:2px;
    color:rgba(70,51,34,.72);
}

/* =========================================================
   FOUR HOME CARDS
   ========================================================= */

.home-grid {
    position:absolute;

    left:14px;
    right:14px;
    top:34%;
    bottom:7%;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:12px;
}

/* individual card */

.home-card {
    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    overflow:hidden;

    border-radius:20px;

    text-decoration:none;
    color:#fff;

    background:#80664b;

    box-shadow:
        0 3px 10px rgba(65,40,20,.22);

    isolation:isolate;
}

/* image */

.home-card img {
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;
}

/* dark photographic overlay */

.home-card::after {
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to top,
            rgba(35,22,12,.72) 0%,
            rgba(35,22,12,.25) 42%,
            rgba(35,22,12,.02) 72%
        );

    z-index:-1;
}

/* card text */

.card-copy {
    position:relative;
    padding:14px 15px 15px;
}

.card-title {
    font-size:25px;
    line-height:1;
    margin-bottom:5px;
}

.card-description {
    font-family:Arial, Helvetica, sans-serif;
    font-size:10px;
    letter-spacing:.5px;
    line-height:1.25;
    opacity:.94;
}

/* arrow */

.card-arrow {
    position:absolute;

    right:13px;
    bottom:13px;

    width:30px;
    height:30px;

    border:1px solid rgba(255,255,255,.72);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Arial, Helvetica, sans-serif;
    font-size:17px;

    background:rgba(255,255,255,.12);
}

/* =========================================================
   FOOTER
   ========================================================= */

.home-footer {
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:7%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-family:Arial, Helvetica, sans-serif;
    font-size:8px;
    letter-spacing:2px;
    text-transform:uppercase;

    color:rgba(70,51,34,.68);
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width:390px) {

    .top-area {
        height:32%;
    }

    .logo {
        width:132px;
        margin-bottom:5px;
    }

    .welcome {
        font-size:11px;
        letter-spacing:3px;
        margin-bottom:5px;
    }

    .tagline {
        font-size:21px;
    }

    .subline {
        font-size:10px;
        margin-top:6px;
    }

    .home-grid {
        top:32%;
        bottom:7%;
        gap:9px;
    }

    .home-card {
        border-radius:17px;
    }

    .card-copy {
        padding:11px 11px 12px;
    }

    .card-title {
        font-size:21px;
    }

    .card-description {
        font-size:9px;
    }

    .card-arrow {
        width:27px;
        height:27px;
        right:10px;
        bottom:10px;
    }
}

/* =========================================================
   TALLER PHONES
   ========================================================= */

@media (min-height:800px) and (max-width:600px) {

    .top-area {
        height:36%;
    }

    .home-grid {
        top:36%;
        bottom:7%;
    }
}

</style>

</head>

<body>

<div class="home-page">

    <!-- =====================================================
         TOP
         ===================================================== -->

    <header class="top-area">

        <img
            src="logo.png"
            alt="303 Oyster Bay"
            class="logo"
        >

        <div class="welcome">
            WELCOME TO
        </div>

        <h1 class="tagline">
            Where the sea slows you down.
        </h1>

        <div class="subline">
            SURATHKAL • MANGALURU
        </div>

    </header>


    <!-- =====================================================
         FOUR HOME DESTINATIONS
         ===================================================== -->

    <main class="home-grid">


        <!-- STAY -->

        <a
            href="arrival-guide.html"
            class="home-card"
        >

            <img
                src="Sea View1.jpg"
                alt="Stay at 303 Oyster Bay"
            >

            <div class="card-copy">

                <div class="card-title">
                    Stay
                </div>

                <div class="card-description">
                    Arrival • Wi-Fi • House Guide
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>


        <!-- LIVE -->

        <a
            href="live.html"
            class="home-card"
        >

            <img
                src="Living1.jpg"
                alt="Living at 303 Oyster Bay"
            >

            <div class="card-copy">

                <div class="card-title">
                    Live
                </div>

                <div class="card-description">
                    Rooms • Kitchen • Comfort
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>


        <!-- EXPLORE -->

        <a
            href="In%20and%20around.pdf"
            class="home-card"
        >

            <img
                src="Lighthouse.jpg"
                alt="Explore Mangaluru"
            >

            <div class="card-copy">

                <div class="card-title">
                    Explore
                </div>

                <div class="card-description">
                    Beaches • Food • Mangaluru
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>


        <!-- REMEMBER -->

        <a
            href="Remember.html"
            class="home-card"
        >

            <img
                src="Bedroom1.jpg"
                alt="Remember your stay"
            >

            <div class="card-copy">

                <div class="card-title">
                    Remember
                </div>

                <div class="card-description">
                    Sea Views • Living • Bedroom • Kitchen
                </div>

            </div>

            <div class="card-arrow">
                →
            </div>

        </a>


    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="home-footer">
        SALT • SAND • STORIES
    </footer>

</div>

</body>
</html>
