<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay — Guest Guide</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #d8ad73;
        font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .home-page {
        width: 100%;
        height: 100svh;
        min-height: 100svh;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
        align-items: center;

        padding:
            clamp(12px, 2.2vh, 28px)
            clamp(14px, 4vw, 55px)
            clamp(12px, 2vh, 22px);

        background-image: url("sand-background.jpg");
        background-repeat: no-repeat;
        background-position: center top;
        background-size: cover;

        overflow: hidden;
    }


    /* =========================================================
       GUEST FAVOURITE
       ========================================================= */

    .guest-favourite {
        display: block;

        width:
            clamp(90px, 9vw, 125px);

        height: auto;

        margin:
            0 auto
            clamp(5px, 0.8vh, 10px);
    }


    /* =========================================================
       PROPERTY LOGO
       ========================================================= */

    .brand {
        width: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;

        flex-shrink: 0;
    }

    .brand-logo {
        display: block;

        width:
            clamp(190px, 29vw, 330px);

        max-width: 58%;

        height: auto;
    }

    .tagline {
        margin:
            clamp(2px, 0.4vh, 5px)
            0
            clamp(7px, 1.1vh, 13px);

        color: #684827;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(12px, 1.45vw, 19px);

        font-style: italic;

        line-height: 1.15;

        text-align: center;
    }


    /* =========================================================
       DIVIDER
       ========================================================= */

    .divider {
        width: 100%;
        max-width: 1080px;

        height: 1px;

        margin:
            0 0
            clamp(8px, 1.2vh, 15px);

        background:
            rgba(104, 72, 39, 0.38);

        flex-shrink: 0;
    }


    /* =========================================================
       PHOTO GRID
       ========================================================= */

    .card-grid {
        width: 100%;
        max-width: 1080px;

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        grid-template-rows:
            repeat(2, minmax(0, 1fr));

        gap:
            clamp(8px, 1.25vw, 16px);

        flex: 1 1 auto;

        min-height: 0;
    }


    /* =========================================================
       CARDS
       ========================================================= */

    .stay-card {
        position: relative;

        display: flex;
        flex-direction: column;

        min-width: 0;
        min-height: 0;

        text-decoration: none;

        overflow: hidden;

        border-radius:
            clamp(12px, 1.6vw, 22px);

        background: #f6ead4;

        box-shadow:
            0 5px 16px rgba(70, 40, 15, 0.18);

        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease;
    }

    .stay-card:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 22px rgba(70, 40, 15, 0.24);
    }


    /* =========================================================
       CARD IMAGE
       ========================================================= */

    .card-image {
        width: 100%;

        flex: 1 1 auto;

        min-height: 0;

        object-fit: cover;

        display: block;
    }


    /* =========================================================
       CARD CAPTION
       ========================================================= */

    .card-caption {
        flex-shrink: 0;

        min-height:
            clamp(34px, 4.4vh, 55px);

        padding:
            0
            clamp(11px, 1.8vw, 22px);

        display: flex;
        align-items: center;
        justify-content: space-between;

        background:
            rgba(248, 238, 217, 0.96);

        color: #684827;
    }

    .card-title {
        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(14px, 1.7vw, 22px);

        line-height: 1;

        font-weight: 600;
    }

    .card-arrow {
        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(18px, 2vw, 27px);

        line-height: 1;

        margin-left: 8px;
    }


    /* =========================================================
       FEATURES BAND
       ========================================================= */

    .features-band {
        width: 100%;
        max-width: 1080px;

        flex-shrink: 0;

        margin-top:
            clamp(8px, 1.3vh, 15px);

        padding:
            clamp(7px, 1.1vh, 13px)
            0;

        display: grid;

        grid-template-columns:
            repeat(5, minmax(0, 1fr));

        background:
            rgba(247, 232, 204, 0.90);

        border:
            1px solid rgba(255,255,255,0.45);

        border-radius:
            clamp(11px, 1.4vw, 18px);

        box-shadow:
            0 4px 14px rgba(70, 40, 15, 0.10);
    }


    /* =========================================================
       FEATURE
       ========================================================= */

    .feature {
        min-width: 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding:
            0
            clamp(5px, 0.8vw, 12px);

        text-align: center;
    }

    .feature + .feature {
        border-left:
            1px solid rgba(104, 72, 39, 0.25);
    }


    /* =========================================================
       FEATURE ICONS
       ========================================================= */

    .feature-icon {
        width:
            clamp(22px, 2.6vw, 34px);

        height:
            clamp(22px, 2.6vw, 34px);

        margin-bottom:
            clamp(2px, 0.4vh, 5px);

        fill: none;

        stroke: #684827;

        stroke-width: 2;

        stroke-linecap: round;
        stroke-linejoin: round;
    }


    /* =========================================================
       FEATURE TEXT
       ========================================================= */

    .feature-title {
        color: #684827;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(8px, 1vw, 13px);

        font-weight: 700;

        letter-spacing:
            clamp(0.3px, 0.08vw, 1px);

        line-height: 1.12;
    }

    .feature-subtitle {
        margin-top: 2px;

        color: #7b6247;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(7px, 0.85vw, 11px);

        font-style: italic;

        line-height: 1.05;
    }


    /* =========================================================
       SHORT DESKTOP SCREENS
       ========================================================= */

    @media (max-height: 760px) and (min-width: 601px) {

        .home-page {
            padding-top: 9px;
            padding-bottom: 9px;
        }

        .guest-favourite {
            width: 82px;
            margin-bottom: 3px;
        }

        .brand-logo {
            width: 225px;
        }

        .tagline {
            font-size: 12px;
            margin-top: 1px;
            margin-bottom: 6px;
        }

        .divider {
            margin-bottom: 7px;
        }

        .card-grid {
            gap: 8px;
        }

        .card-caption {
            min-height: 32px;
        }

        .card-title {
            font-size: 14px;
        }

        .card-arrow {
            font-size: 18px;
        }

        .features-band {
            margin-top: 7px;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .feature-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 2px;
        }

        .feature-title {
            font-size: 8px;
        }

        .feature-subtitle {
            font-size: 7px;
        }
    }


    /* =========================================================
       TABLETS
       ========================================================= */

    @media (max-width: 700px) {

        .home-page {
            padding:
                10px
                12px
                10px;
        }

        .guest-favourite {
            width: 78px;
            margin-bottom: 3px;
        }

        .brand-logo {
            width: 205px;
            max-width: 60%;
        }

        .tagline {
            font-size: 11px;
            margin-bottom: 6px;
        }

        .divider {
            margin-bottom: 7px;
        }

        .card-grid {
            gap: 7px;
        }

        .card-caption {
            min-height: 31px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .card-title {
            font-size: 13px;
        }

        .card-arrow {
            font-size: 17px;
        }

        .features-band {
            margin-top: 7px;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .feature-icon {
            width: 21px;
            height: 21px;
        }

        .feature-title {
            font-size: 7.5px;
        }

        .feature-subtitle {
            font-size: 6.5px;
        }
    }


    /* =========================================================
       PHONES
       ========================================================= */

    @media (max-width: 500px) {

        .home-page {
            padding:
                7px
                8px
                8px;
        }

        .guest-favourite {
            width: 68px;
            margin-bottom: 1px;
        }

        .brand-logo {
            width: 175px;
            max-width: 63%;
        }

        .tagline {
            font-size: 10px;
            margin-top: 1px;
            margin-bottom: 5px;
        }

        .divider {
            margin-bottom: 6px;
        }

        .card-grid {
            gap: 6px;
        }

        .stay-card {
            border-radius: 10px;
        }

        .card-caption {
            min-height: 28px;
            padding:
                0
                8px;
        }

        .card-title {
            font-size: 11px;
        }

        .card-arrow {
            font-size: 15px;
        }

        .features-band {
            margin-top: 6px;
            padding:
                5px
                0;
            border-radius: 9px;
        }

        .feature {
            padding:
                0
                3px;
        }

        .feature-icon {
            width: 18px;
            height: 18px;
            margin-bottom: 2px;
        }

        .feature-title {
            font-size: 6.5px;
            letter-spacing: 0;
        }

        .feature-subtitle {
            font-size: 5.5px;
        }
    }


    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 380px) {

        .home-page {
            padding:
                5px
                6px
                6px;
        }

        .guest-favourite {
            width: 60px;
        }

        .brand-logo {
            width: 155px;
        }

        .tagline {
            font-size: 9px;
            margin-bottom: 4px;
        }

        .divider {
            margin-bottom: 5px;
        }

        .card-grid {
            gap: 5px;
        }

        .card-caption {
            min-height: 25px;
            padding:
                0
                7px;
        }

        .card-title {
            font-size: 10px;
        }

        .card-arrow {
            font-size: 13px;
        }

        .features-band {
            margin-top: 5px;
            padding:
                4px
                0;
        }

        .feature-icon {
            width: 16px;
            height: 16px;
        }

        .feature-title {
            font-size: 5.8px;
        }

        .feature-subtitle {
            display: none;
        }
    }


    /* =========================================================
       VERY SHORT PHONE SCREENS
       ========================================================= */

    @media (max-height: 620px) and (max-width: 500px) {

        .guest-favourite {
            width: 55px;
        }

        .brand-logo {
            width: 145px;
        }

        .tagline {
            font-size: 8px;
            margin-bottom: 3px;
        }

        .divider {
            margin-bottom: 4px;
        }

        .card-caption {
            min-height: 23px;
        }

        .card-title {
            font-size: 9px;
        }

        .card-arrow {
            font-size: 12px;
        }

        .features-band {
            padding-top: 3px;
            padding-bottom: 3px;
        }

        .feature-icon {
            width: 14px;
            height: 14px;
        }

        .feature-title {
            font-size: 5px;
        }
    }

</style>
</head>


<body>

<main class="home-page">


    <!-- =====================================================
         GUEST FAVOURITE
         ===================================================== -->

    <img
        class="guest-favourite"
        src="guest-favourite.png"
        alt="Airbnb Guest Favourite"
    >


    <!-- =====================================================
         303 OYSTER BAY BRANDING
         ===================================================== -->

    <header class="brand">

        <img
            class="brand-logo"
            src="logo.png"
            alt="303 Oyster Bay — Surathkal · Mangaluru"
        >

        <p class="tagline">
            Where the sea slows you down.
        </p>

    </header>


    <!-- =====================================================
         DIVIDER
         ===================================================== -->

    <div class="divider"></div>


    <!-- =====================================================
         MAIN NAVIGATION CARDS
         ===================================================== -->

    <section
        class="card-grid"
        aria-label="303 Oyster Bay"
    >


        <!-- =================================================
             YOUR STAY
             ================================================= -->

        <a
            class="stay-card"
            href="arrival-guide.html"
            aria-label="Your Stay"
        >

            <img
                class="card-image"
                src="your-stay.PNG"
                alt="Sea view from 303 Oyster Bay"
            >

            <div class="card-caption">

                <span class="card-title">
                    Your Stay
                </span>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>


        <!-- =================================================
             THE APARTMENT
             ================================================= -->

        <a
            class="stay-card"
            href="The%20Apartment.pdf"
            aria-label="The Apartment"
        >

            <img
                class="card-image"
                src="apartment.jpg"
                alt="Living and dining area at 303 Oyster Bay"
            >

            <div class="card-caption">

                <span class="card-title">
                    The Apartment
                </span>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>


        <!-- =================================================
             EXPLORE
             ================================================= -->

        <a
            class="stay-card"
            href="In%20and%20around.pdf"
            aria-label="Explore"
        >

            <img
                class="card-image"
                src="Lighthouse.jpg"
                alt="Surathkal lighthouse and coast"
            >

            <div class="card-caption">

                <span class="card-title">
                    Explore
                </span>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>


        <!-- =================================================
             GALLERY
             ================================================= -->

        <a
            class="stay-card"
            href="gallery.html"
            aria-label="Gallery"
        >

            <img
                class="card-image"
                src="gallery.jpg"
                alt="303 Oyster Bay apartment"
            >

            <div class="card-caption">

                <span class="card-title">
                    Gallery
                </span>

                <span class="card-arrow">
                    →
                </span>

            </div>

        </a>


    </section>


    <!-- =====================================================
         FEATURES BAND
         ===================================================== -->

    <section
        class="features-band"
        aria-label="Property features"
    >


        <!-- =================================================
             2 BEDROOMS
             ================================================= -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 64 64"
                aria-hidden="true"
            >

                <path d="M8 48V27h48v21"/>

                <path d="M8 38h48"/>

                <path d="M14 27v-7h14v7"/>

                <path d="M8 48h48"/>

            </svg>

            <div class="feature-title">
                2 Bedrooms
            </div>

            <div class="feature-subtitle">
                Sleeps 4 + 1
            </div>

        </div>


        <!-- =================================================
             SEA VIEWS
             ================================================= -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 64 64"
                aria-hidden="true"
            >

                <path
                    d="M6 23c7-7 14-7 21 0s14 7 21 0 7-7 10-4"
                />

                <path
                    d="M6 34c7-7 14-7 21 0s14 7 21 0 7-7 10-4"
                />

                <path
                    d="M6 45c7-7 14-7 21 0s14 7 21 0 7-7 10-4"
                />

            </svg>

            <div class="feature-title">
                Uninterrupted<br>Sea Views
            </div>

        </div>


        <!-- =================================================
             FULL KITCHEN
             ================================================= -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 64 64"
                aria-hidden="true"
            >

                <rect
                    x="10"
                    y="12"
                    width="44"
                    height="40"
                    rx="3"
                />

                <circle
                    cx="22"
                    cy="25"
                    r="4"
                />

                <circle
                    cx="42"
                    cy="25"
                    r="4"
                />

                <circle
                    cx="22"
                    cy="40"
                    r="4"
                />

                <circle
                    cx="42"
                    cy="40"
                    r="4"
                />

            </svg>

            <div class="feature-title">
                Full Kitchen
            </div>

        </div>


        <!-- =================================================
             FREE PARKING
             ================================================= -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 64 64"
                aria-hidden="true"
            >

                <path d="M8 42h48"/>

                <path d="M13 42v-9l6-12h26l6 12v9"/>

                <path d="M18 21l-3-7"/>

                <path d="M46 21l3-7"/>

                <circle
                    cx="20"
                    cy="43"
                    r="5"
                />

                <circle
                    cx="44"
                    cy="43"
                    r="5"
                />

                <path d="M23 29h18"/>

            </svg>

            <div class="feature-title">
                Free Parking
            </div>

        </div>


        <!-- =================================================
             WI-FI
             ================================================= -->

        <div class="feature">

            <svg
                class="feature-icon"
                viewBox="0 0 64 64"
                aria-hidden="true"
            >

                <path d="M8 25c14-13 34-13 48 0"/>

                <path d="M17 35c9-8 21-8 30 0"/>

                <path d="M26 45c4-4 8-4 12 0"/>

                <circle
                    cx="32"
                    cy="53"
                    r="2"
                    fill="#684827"
                    stroke="none"
                />

            </svg>

            <div class="feature-title">
                High-Speed<br>Wi-Fi
            </div>

        </div>


    </section>


</main>

</body>
</html>
