<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================================================
   PAGE
   ========================================================= */

html {
    width: 100%;
    min-height: 100%;
}

body {
    width: 100%;
    min-height: 100%;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: #463322;

    background:
        #e8d8bd;

    overflow-x: hidden;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.remember-page {

    position: relative;

    width: 100%;

    min-height: 100vh;
    min-height: 100svh;

    padding-top: 0;

    padding-bottom: 155px;

    background-image:
        url("sand-background.jpg");

    background-size: cover;

    background-position:
        center top;

    background-repeat: repeat-y;
}


/* =========================================================
   SALT SAND STORIES
   SMALL CONTROLLED HEADER IMAGE
   ========================================================= */

.salt-stories {

    display: block;

    width: 185px;

    max-width: 48vw;

    height: auto;

    margin:

        8px
        12px
        2px
        auto;

    position: relative;

    z-index: 2;
}


/* =========================================================
   GALLERY CONTENT
   ========================================================= */

.remember-content {

    width: 100%;

    padding:

        8px
        0
        0
        22px;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category {

    width: 100%;

    margin-bottom: 25px;
}


/* =========================================================
   CATEGORY TITLE
   ========================================================= */

.category-title {

    margin:

        0
        0
        8px
        0;

    color: #463322;

    font-size: 26px;

    font-weight: normal;

    letter-spacing: 0.5px;

    line-height: 1.1;
}


/* =========================================================
   HORIZONTAL PHOTO ROW
   ========================================================= */

.photo-row {

    display: flex;

    flex-wrap: nowrap;

    gap: 12px;

    width: 100%;

    overflow-x: auto;

    overflow-y: hidden;

    padding:

        0
        18px
        8px
        0;

    scrollbar-width: none;

    -ms-overflow-style: none;

    -webkit-overflow-scrolling: touch;
}

.photo-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {

    flex:

        0 0
        165px;

    width: 165px;

    height: 145px;

    padding: 7px 7px 14px 7px;

    border:

        1px solid
        rgba(255,255,255,0.65);

    border-radius: 17px;

    background:
        #f4ead7;

    box-shadow:

        0 3px 8px
        rgba(70,42,20,0.20);

    cursor: pointer;

    appearance: none;

    -webkit-appearance: none;
}


/* =========================================================
   PHOTO
   ========================================================= */

.photo-card img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

    border-radius: 11px;
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 128px;

    z-index: 50;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding:

        0
        18px
        12px;

    background:

        linear-gradient(
            to bottom,
            rgba(232,216,189,0),
            rgba(232,216,189,0.82) 24%,
            rgba(232,216,189,0.96) 55%,
            rgba(232,216,189,1)
        );

    pointer-events: auto;
}


/* =========================================================
   TOP DIVIDER LINE
   ========================================================= */

.bottom-nav::before {

    content: "";

    position: absolute;

    left: 20px;
    right: 20px;

    top: 27px;

    height: 1px;

    background:
        rgba(70,51,34,0.72);
}


/* =========================================================
   NAV SIDE
   ========================================================= */

.nav-side {

    position: relative;

    z-index: 2;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    flex: 1;

    max-width: 250px;

    height: 92px;
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {

    width: 50%;

    height: 84px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    gap: 6px;

    text-decoration: none;

    color: #463322;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 14px;

    line-height: 1;
}


/* =========================================================
   NAV DIVIDERS
   ========================================================= */

.nav-item + .nav-item {

    border-left:

        1px solid
        rgba(70,51,34,0.55);
}


/* =========================================================
   NAV ICON
   ========================================================= */

.nav-icon {

    width: 38px;

    height: 38px;

    fill: none;

    stroke: #463322;

    stroke-width: 2.3;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   CENTRAL LOGO
   ========================================================= */

.logo-wrap {

    position: relative;

    z-index: 4;

    flex:

        0 0
        210px;

    height: 100px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding-bottom: 0;
}


.logo-wrap img {

    display: block;

    width: 205px;

    max-width: 100%;

    height: auto;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(35,25,16,0.92);

    z-index: 100;
}

.lightbox.active {
    display: flex;
}


.lightbox-image {

    max-width: 88vw;

    max-height: 82vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.35);
}


/* =========================================================
   LIGHTBOX BUTTONS
   ========================================================= */

.lightbox-close,
.lightbox-arrow {

    position: absolute;

    border: none;

    border-radius: 50%;

    background:
        rgba(244,234,215,0.95);

    color: #463322;

    text-align: center;

    cursor: pointer;
}


.lightbox-close {

    top: 18px;

    right: 20px;

    width: 42px;

    height: 42px;

    font-size: 25px;

    line-height: 42px;
}


.lightbox-arrow {

    top: 50%;

    transform:
        translateY(-50%);

    width: 44px;

    height: 44px;

    font-size: 27px;

    line-height: 44px;
}


.lightbox-prev {
    left: 14px;
}

.lightbox-next {
    right: 14px;
}

    document.getElementById("lightboxNext");


let currentCategory = "";

let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(category, index) {

    currentCategory = category;

    currentIndex = index;

    lightboxImage.src =
        galleryData[category][index];

    lightbox.classList.add("active");
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    lightboxImage.src = "";
}


/* =========================================================
   NEXT
   ========================================================= */

function showNext() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex + 1)
        % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function showPrevious() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length)
        % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PHOTO BUTTONS
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                const category =
                    card.dataset.category;

                const index =
                    Number(card.dataset.index);

                openLightbox(
                    category,
                    index
                );

            }
        );

    });


/* =========================================================
   LIGHTBOX BUTTONS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    showNext
);

lightboxPrev.addEventListener(
    "click",
    showPrevious
);


/* =========================================================
   CLICK OUTSIDE
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {
            return;
        }

        if (
            event.key === "Escape"
        ) {
            closeLightbox();
        }

        if (
            event.key === "ArrowRight"
        ) {
            showNext();
        }

        if (
            event.key === "ArrowLeft"
        ) {
            showPrevious();
        }

    }
);


/* =========================================================
   SWIPE
   ========================================================= */

let touchStartX = 0;


lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    },
    {
        passive: true
    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        const touchEndX =
            event.changedTouches[0]
                .screenX;

        const difference =
            touchEndX - touchStartX;

        if (
            Math.abs(difference) < 40
        ) {
            return;
        }

        if (
            difference < 0
        ) {

            showNext();

        } else {

            showPrevious();

        }

    },
    {
        passive: true
    }
);

</script>


</body>

</html>
