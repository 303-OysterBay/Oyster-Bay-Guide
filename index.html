<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=5.0, user-scalable=yes">

<title>303 OYSTER BAY • Home</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #d9b37a;
    color: #463322;
}


/* =========================
   MAIN PAGE
   ========================= */

.home-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    overflow-x: hidden;

    background-image:
        linear-gradient(
            rgba(220, 177, 120, 0.04),
            rgba(220, 177, 120, 0.04)
        ),
        url("sand-background.jpg");

    background-size: cover;
    background-position: center center;
    background-attachment: scroll;

    padding:
        clamp(22px, 5vw, 48px)
        clamp(18px, 4vw, 42px)
        58px;
}


/* =========================
   TOP AREA
   ========================= */

.top-area {
    position: relative;

    text-align: center;

    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    padding-top: clamp(4px, 1vw, 10px);
    padding-bottom: clamp(34px, 5vw, 58px);
}

.logo {
    display: block;

    width: 178px;
    max-width: 48vw;
    height: auto;

    margin: 0 auto 8px;
}

.tagline {
    margin: 0;

    font-size: 15px;
    line-height: 1.25;
    font-weight: 400;

    letter-spacing: 0.15px;

    color: #59412d;
}


/* =========================
   AIRBNB GUEST FAVOURITE
   ========================= */

.guest-favourite {
    position: absolute;

    top: 8px;
    right: 2.5%;

    width: 82px;
    height: auto;

    display: block;

    z-index: 5;

    margin: 0;
    padding: 0;

    background: transparent;
    border: 0;
    box-shadow: none;

    pointer-events: none;
}


/* =========================
   FOUR HOME CARDS
   ========================= */

.home-grid {
    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: clamp(16px, 2.5vw, 28px);
}

.home-card {
    position: relative;

    display: block;

    width: 100%;

    aspect-ratio: 1.02 / 1;

    overflow: hidden;

    border-radius: 30px;

    text-decoration: none;
    color: white;

    box-shadow:
        0 5px 12px rgba(50, 30, 15, 0.18);

    background: #8e6848;
}

.home-card img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: transform 0.35s ease;
}

.home-card::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to top,
            rgba(25, 16, 9, 0.72) 0%,
            rgba(25, 16, 9, 0.28) 42%,
            rgba(25, 16, 9, 0.02) 72%
        );

    z-index: 1;
}


/* =========================
   CARD CONTENT
   ========================= */

.home-card-content {
    position: absolute;

    left: 30px;
    right: 30px;
    bottom: 24px;

    z-index: 2;
}

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;

    padding: 0 30px 24px 30px;
}
.card-title {
    font-size: clamp(35px, 4vw, 49px);

    line-height: 0.95;

    font-weight: 400;

    margin: 0 0 9px;

    color: #fff;

    white-space: nowrap;
}

.card-description {
    width: 100%;
    max-width: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: clamp(15px, 1.65vw, 18px);

    line-height: 1.15;

    font-weight: 400;

    color: #fff;

    white-space: nowrap;
}


/* =========================
   COMPACT CHEVRON
   ========================= */

.card-arrow {
    position: absolute;

    right: 8px !important;
top: 10px !important;
bottom: auto !important;

    width: 18px;
    height: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 0;
    background: transparent;

    font-size: 0;
    line-height: 1;

    color: #fff;

    z-index: 5;
}

.card-arrow::after {
    content: "›";

    font-family: Arial, Helvetica, sans-serif;

    font-size: 30px;
    font-weight: 300;

    line-height: 1;

    color: #fff;
}

/* =========================
   FEATURES BAND
   ========================= */

.features-band {
    width: 100%;
    max-width: 1100px;

    margin: clamp(30px, 4vw, 44px) auto 0;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    background:
        rgba(255, 248, 235, 0.88);

    border:
        1px solid rgba(80, 55, 35, 0.16);

    border-radius: 32px;

    overflow: hidden;

    box-shadow:
        0 4px 10px rgba(50, 30, 15, 0.10);

    backdrop-filter: blur(3px);
}

.feature {
    min-height: 118px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 15px 8px;

    text-align: center;

    border-right:
        1px solid rgba(70, 50, 30, 0.18);
}

.feature:last-child {
    border-right: none;
}


/* Elegant thin-line icons */

.feature-icon {
    width: 27px;
    height: 27px;

    margin-bottom: 8px;

    fill: none;

    stroke: #463322;

    stroke-width: 1.8;

    stroke-linecap: round;
    stroke-linejoin: round;

    flex-shrink: 0;
}


/* Running-case feature text */

.feature-title {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;

    line-height: 1.15;

    letter-spacing: 0;

    color: #463322;

    white-space: nowrap;

    text-transform: none;
}


/* =========================
   SMALL PHONES
   ========================= */

@media (max-width: 600px) {

    .home-page {
        padding:
            22px
            18px
            58px;
    }

    .top-area {
        padding-top: 2px;
        padding-bottom: 36px;
    }

    .logo {
        width: 158px;
        max-width: 52vw;
        margin-bottom: 7px;
    }

    .tagline {
        font-size: 13px;
    }


    /* Guest Favourite */

    .guest-favourite {
        top: 5px;
        right: 1.5%;
        width: 72px;
    }


    /* Cards */

    .home-grid {
        gap: 16px;
    }

    .home-card {
        border-radius: 27px;
    }

   .home-card-content {
    left: 20px;
    right: 20px;
    bottom: 19px;
}

    .card-title {
        font-size: 30px;
        margin-bottom: 7px;
    }

    .card-description {
        width: 100%;
        max-width: none;

        font-size: 12px;

        line-height: 1.15;

        white-space: nowrap;
    }


    /* Small clean chevron */

   .card-arrow {
    right: 8px !important;
    top: 8px !important;
    bottom: auto !important;

    width: 18px;
    height: 20px;
    }
    .card-arrow::after {
        font-size: 27px;
    }


    /* Features */

    .features-band {
        margin-top: 30px;

        border-radius: 29px;
    }

    .feature {
        min-height: 100px;

        padding:
            11px 3px;
    }

    .feature-icon {
        width: 25px;
        height: 25px;

        margin-bottom: 7px;

        stroke-width: 1.8;
    }

    .feature-title {
        font-size: 11px;
    }
}


/* =========================
   VERY SMALL PHONES
   ========================= */

@media (max-width: 380px) {

    .home-page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .home-grid {
        gap: 12px;
    }

    .home-card {
        border-radius: 24px;
    }

    .home-card-content {
        left: 16px;
        right: 16px;
        bottom: 16px;
    }

    .card-title {
        font-size: 27px;
    }

    .card-description {
        font-size: 11px;
    }

    .card-arrow {
        right: 1px;
        bottom: 3px;
    }

    .card-arrow::after {
        font-size: 25px;
    }

    .features-band {
        border-radius: 25px;
    }

    .feature {
        min-height: 91px;

        padding-left: 2px;
        padding-right: 2px;
    }

    .feature-icon {
        width: 23px;
        height: 23px;
    }

    .feature-title {
        font-size: 10px;
    }
}

</style>
</head>


<body>

<div class="home-page">


    <!-- =========================
         TOP
         ========================= -->

    <header class="top-area">

        <img
            src="logo.png"
            alt="303 Oyster Bay"

        >

            Where the sea slows you down.
        </h1>

        <img
            src="guest-favourite.png"
            alt="Airbnb Guest Favourite"

        >

    </header>



    <!-- =========================
         FOUR DESTINATIONS
         ========================= -->

    <main class="home-grid">

                </div>

        <!-- REMEMBER -->

        <a href="Remember.html" class="home-card">

    </main>



    <!-- =========================

    <section class="features-band">

        <!-- SLEEPS -->

        <!-- PARKING -->

            <svg

            >
                <path d="M6 20l2-8h16l2 8"/>
                <path d="M5 20h22v6H5z"/>

        <div class="feature">

    </section>


</div>

</body>
</html>
