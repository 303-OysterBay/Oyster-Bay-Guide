<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>303 Oyster Bay — Surathkal, Mangaluru</title>

  <meta
    name="description"
    content="303 Oyster Bay — a beachside stay in Surathkal, Mangaluru."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #d8ad78;
      color: #4a2e18;
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================================
       PAGE / FULL SAND BACKGROUND
       ========================================================= */

    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      overflow: hidden;
      padding:
        clamp(22px, 4vw, 48px)
        clamp(18px, 5vw, 64px)
        34px;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;

      background:
        linear-gradient(
          rgba(215, 172, 118, 0.04),
          rgba(215, 172, 118, 0.04)
        ),
        url("sand-background.png")
        center top / cover no-repeat;

      background-color: #d8ad78;
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;
      width: min(100%, 1080px);
      margin: 0 auto;
      text-align: center;
    }


    /* =========================================================
       GUEST FAVOURITE
       ========================================================= */

    .guest-favourite {
      position: absolute;
      top: -2px;
      right: 0;

      width: clamp(78px, 12vw, 125px);

      z-index: 20;
      display: block;
    }

    .guest-favourite img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================================================
       LOGO
       ========================================================= */

    .logo {
      display: block;

      width: min(64vw, 390px);

      height: auto;

      margin:
        clamp(10px, 2vw, 20px)
        auto
        4px;
    }


    /* =========================================================
       TAGLINE
       ========================================================= */

    .tagline {
      margin:
        4px
        0
        clamp(17px, 2.5vw, 28px);

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(17px, 2.2vw, 24px);

      font-style: italic;
      font-weight: 400;

      letter-spacing: 0.01em;

      line-height: 1.15;

      color: #51321b;
    }


    /* =========================================================
       ANIMATED SHORELINE
       ========================================================= */

    .shore-wave {
      position: absolute;

      top: -18px;
      left: -5%;

      width: min(66vw, 720px);
      height: 245px;

      z-index: -1;

      pointer-events: none;

      overflow: visible;
    }

    .shore-wave svg {
      width: 100%;
      height: 100%;

      display: block;
      overflow: visible;
    }

    .wave-body {
      fill: rgba(255, 252, 245, 0.86);

      transform-origin: 28% 72%;

      animation:
        wave-wash
        7.5s
        ease-in-out
        infinite;
    }

    .wave-foam {
      fill: none;

      stroke:
        rgba(255, 255, 250, 0.94);

      stroke-width: 8;

      stroke-linecap: round;

      stroke-linejoin: round;

      opacity: 0.92;

      transform-origin: 26% 75%;

      animation:
        foam-wash
        7.5s
        ease-in-out
        infinite;
    }

    .wave-foam-soft {
      fill: none;

      stroke:
        rgba(255, 255, 255, 0.52);

      stroke-width: 13;

      stroke-linecap: round;

      stroke-linejoin: round;

      opacity: 0.65;

      transform-origin: 28% 75%;

      animation:
        foam-soft-wash
        7.5s
        ease-in-out
        infinite;
    }

    @keyframes wave-wash {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
        opacity: 0.72;
      }

      38% {
        transform:
          translate3d(0, 20px, 0)
          scale(1.035);
        opacity: 0.88;
      }

      54% {
        transform:
          translate3d(0, 25px, 0)
          scale(1.045);
        opacity: 0.93;
      }

      78% {
        transform:
          translate3d(0, 7px, 0)
          scale(1.015);
        opacity: 0.82;
      }
    }

    @keyframes foam-wash {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
        opacity: 0.70;
      }

      42% {
        transform:
          translate3d(0, 23px, 0)
          scale(1.04);
        opacity: 0.98;
      }

      56% {
        transform:
          translate3d(0, 27px, 0)
          scale(1.05);
        opacity: 0.96;
      }

      82% {
        transform:
          translate3d(0, 5px, 0)
          scale(1.01);
        opacity: 0.76;
      }
    }

    @keyframes foam-soft-wash {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
        opacity: 0.40;
      }

      40% {
        transform:
          translate3d(0, 18px, 0)
          scale(1.05);
        opacity: 0.70;
      }

      58% {
        transform:
          translate3d(0, 24px, 0)
          scale(1.06);
        opacity: 0.68;
      }

      80% {
        transform:
          translate3d(0, 5px, 0)
          scale(1.01);
        opacity: 0.44;
      }
    }


    /* =========================================================
       AMENITIES
       ========================================================= */

    .amenities {
      width: min(100%, 1080px);

      margin:
        0
        auto
        clamp(20px, 3vw, 32px);

      padding:
        16px
        0
        17px;

      border-top:
        1px solid
        rgba(74, 46, 24, 0.35);

      border-bottom:
        1px solid
        rgba(74, 46, 24, 0.35);

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      text-align: center;
    }

    .amenity {
      min-width: 0;

      padding:
        0
        clamp(6px, 1.7vw, 18px);

      border-right:
        1px solid
        rgba(74, 46, 24, 0.28);
    }

    .amenity:last-child {
      border-right: none;
    }

    .amenity-icon {
      width: 30px;
      height: 30px;

      margin:
        0
        auto
        7px;

      display: block;
    }

    .amenity-icon svg {
      width: 100%;
      height: 100%;

      fill: none;

      stroke: #56351d;

      stroke-width: 1.75;

      stroke-linecap: round;

      stroke-linejoin: round;
    }

    .amenity-title {
      font-size:
        clamp(14px, 1.8vw, 20px);

      font-weight: 500;

      line-height: 1.02;

      white-space: nowrap;
    }

    .amenity-subtitle {
      margin-top: 2px;

      font-size:
        clamp(12px, 1.55vw, 17px);

      font-style: italic;

      line-height: 1.0;

      white-space: nowrap;
    }


    /* =========================================================
       PHOTO GRID
       ========================================================= */

    .cards {
      width: min(100%, 1080px);

      margin:
        0
        auto;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        clamp(14px, 2vw, 24px);
    }

    .card {
      position: relative;

      display: flex;

      flex-direction: column;

      overflow: hidden;

      background: #f8f1e5;

      border:
        1px solid
        rgba(74, 46, 24, 0.12);

      box-shadow:
        0
        4px
        14px
        rgba(62, 36, 16, 0.12);

      border-radius: 2px;

      transition:
        box-shadow
        0.25s
        ease;
    }

    .card:hover {
      box-shadow:
        0
        7px
        20px
        rgba(62, 36, 16, 0.18);
    }

    .card-image {
      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      display: block;
    }

    .card-label {
      min-height: clamp(52px, 6vw, 70px);

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      padding:
        7px
        42px
        7px
        15px;

      background:
        rgba(250, 246, 238, 0.96);

      color: #4c2f1a;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      font-size:
        clamp(19px, 2.5vw, 28px);

      font-weight: 600;

      line-height: 1;

      text-align: center;
    }

    .card-arrow {
      position: absolute;

      right: 16px;

      top: 50%;

      transform:
        translateY(-50%);

      font-family:
        Arial,
        sans-serif;

      font-size: 22px;

      font-weight: 300;

      line-height: 1;
    }


    /* =========================================================
       SIGN-OFF
       ========================================================= */

    .closing {
      width: min(100%, 1080px);

      margin:
        24px
        auto
        0;

      display: flex;

      justify-content: flex-end;

      padding-right:
        clamp(4px, 1vw, 12px);
    }

    .signature {
      font-family:
        "Allura",
        "Brush Script MT",
        cursive;

      font-size:
        clamp(27px, 4vw, 42px);

      line-height: 0.9;

      text-align: right;

      color: #4b2d18;

      transform:
        rotate(-3deg);

      transform-origin:
        right center;
    }

    .signature span {
      display: block;
    }


    /* =========================================================
       SOUND CONTROL
       ========================================================= */

    .sound-control {
      position: fixed;

      right:
        14px;

      bottom:
        14px;

      z-index: 100;

      width: 38px;
      height: 38px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(74, 46, 24, 0.38);

      border-radius: 50%;

      background:
        rgba(248, 241, 229, 0.72);

      color: #4c2f1a;

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);

      cursor: pointer;

      padding: 0;

      transition:
        background
        0.2s
        ease,
        transform
        0.2s
        ease;
    }

    .sound-control:hover {
      background:
        rgba(248, 241, 229, 0.92);

      transform:
        scale(1.04);
    }

    .sound-control svg {
      width: 19px;
      height: 19px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.7;

      stroke-linecap: round;

      stroke-linejoin: round;
    }

    .sound-control[aria-pressed="true"] {
      background:
        rgba(248, 241, 229, 0.94);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .page {
        padding:
          18px
          12px
          28px;
      }

      .guest-favourite {
        top: -2px;
        right: 0;

        width: 86px;
      }

      .logo {
        width: min(66vw, 330px);

        margin-top:
          13px;
      }

      .tagline {
        font-size: 18px;

        margin-bottom:
          18px;
      }

      .shore-wave {
        top: -12px;
        left: -16%;

        width: 88vw;
        height: 190px;
      }

      .amenities {
        padding:
          13px
          0
          14px;

        margin-bottom:
          18px;
      }

      .amenity {
        padding:
          0
          3px;
      }

      .amenity-icon {
        width: 24px;
        height: 24px;

        margin-bottom:
          6px;
      }

      .amenity-title {
        font-size: 12px;
      }

      .amenity-subtitle {
        font-size: 10.5px;
      }

      .cards {
        gap: 11px;
      }

      .card-label {
        min-height: 48px;

        font-size: 18px;

        padding-right: 31px;
      }

      .card-arrow {
        right: 10px;

        font-size: 18px;
      }

      .closing {
        margin-top: 22px;
      }

      .signature {
        font-size: 30px;
      }

      .sound-control {
        width: 35px;
        height: 35px;

        right: 10px;
        bottom: 10px;
      }
    }


    /* =========================================================
       SMALL PHONES
       ========================================================= */

    @media (max-width: 390px) {

      .amenity-icon {
        width: 22px;
        height: 22px;
      }

      .amenity-title {
        font-size: 11px;
      }

      .amenity-subtitle {
        font-size: 9.5px;
      }

      .card-label {
        font-size: 17px;
      }

      .signature {
        font-size: 28px;
      }
    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      .wave-body,
      .wave-foam,
      .wave-foam-soft {
        animation: none;
      }

      .card,
      .sound-control {
        transition: none;
      }
    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =======================================================
         HERO
         ======================================================= -->

    <section class="hero" aria-label="303 Oyster Bay">

      <!-- Guest Favourite badge -->
      <div class="guest-favourite">
        <img
          src="guest-favourite.png"
          alt="Airbnb Guest Favourite"
        >
      </div>


      <!-- Animated shoreline -->
      <div
        class="shore-wave"
        aria-hidden="true"
      >

        <svg
          viewBox="0 0 720 245"
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            class="wave-body"
            d="
              M0,0
              C105,28 160,54 235,80
              C315,108 365,115 438,126
              C525,139 618,137 720,154
              L720,0
              Z
            "
          />

          <path
            class="wave-foam-soft"
            d="
              M-10,7
              C92,39 159,64 236,90
              C317,117 374,125 444,134
              C536,146 624,144 730,161
            "
          />

          <path
            class="wave-foam"
            d="
              M-8,9
              C89,38 157,63 234,88
              C311,113 369,122 441,132
              C531,144 620,142 730,159
            "
          />

          <path
            class="wave-foam"
            d="
              M18,28
              C100,51 158,74 220,96
              C296,122 356,130 427,140
              C512,151 605,150 706,165
            "
            style="
              stroke-width:4;
              opacity:.55;
            "
          />

        </svg>

      </div>


      <!-- Logo -->
      <img
        class="logo"
        src="logo.png"
        alt="303 Oyster Bay — Surathkal, Mangaluru"
      >


      <!-- Tagline -->
      <p class="tagline">
        Where the sea slows you down.
      </p>

    </section>


    <!-- =======================================================
         AMENITIES
         ======================================================= -->

    <section
      class="amenities"
      aria-label="Property features"
    >


      <!-- 2 Bedrooms -->
      <div class="amenity">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path d="M4 24V10" />
            <path d="M4 15H28V24" />
            <path d="M7 15V12C7 10.9 7.9 10 9 10H14C15.1 10 16 10.9 16 12V15" />
            <path d="M4 24H29" />

          </svg>

        </div>

        <div class="amenity-title">
          2 Bedrooms
        </div>

        <div class="amenity-subtitle">
          Sleeps 4 + 1
        </div>

      </div>


      <!-- Sea Views -->
      <div class="amenity">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path d="M3 10C6 10 6 7 9 7C12 7 12 10 15 10C18 10 18 7 21 7C24 7 24 10 29 10" />
            <path d="M3 16C6 16 6 13 9 13C12 13 12 16 15 16C18 16 18 13 21 13C24 13 24 16 29 16" />
            <path d="M3 22C6 22 6 19 9 19C12 19 12 22 15 22C18 22 18 19 21 19C24 19 24 22 29 22" />

          </svg>

        </div>

        <div class="amenity-title">
          Uninterrupted
        </div>

        <div class="amenity-subtitle">
          Sea Views
        </div>

      </div>


      <!-- Kitchen -->
      <div class="amenity">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <rect
              x="4"
              y="4"
              width="24"
              height="24"
              rx="2"
            />

            <circle cx="11" cy="11" r="3" />
            <circle cx="21" cy="11" r="3" />
            <circle cx="11" cy="21" r="3" />
            <circle cx="21" cy="21" r="3" />

          </svg>

        </div>

        <div class="amenity-title">
          Full Kitchen
        </div>

      </div>


      <!-- Parking -->
      <div class="amenity">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path d="M5 21L7 14L10 10H22L25 14L27 21" />
            <path d="M5 21V24H8V22H24V24H27V21" />
            <path d="M7 14H25" />
            <path d="M10 10L12 6H20L22 10" />
            <circle cx="10" cy="21" r="1.5" />
            <circle cx="22" cy="21" r="1.5" />

          </svg>

        </div>

        <div class="amenity-title">
          Free
        </div>

        <div class="amenity-subtitle">
          Parking
        </div>

      </div>


      <!-- Wi-Fi -->
      <div class="amenity">

        <div class="amenity-icon">

          <svg viewBox="0 0 32 32">

            <path d="M5 12C12 6 20 6 27 12" />
            <path d="M9 17C14 13 18 13 23 17" />
            <path d="M13 21C16 19 16 19 19 21" />
            <circle
              cx="16"
              cy="25"
              r="1"
              fill="#56351d"
              stroke="none"
            />

          </svg>

        </div>

        <div class="amenity-title">
          High-Speed
        </div>

        <div class="amenity-subtitle">
          Wi-Fi
        </div>

      </div>

    </section>


    <!-- =======================================================
         PHOTO CARDS
         ======================================================= -->

    <section
      class="cards"
      aria-label="303 Oyster Bay sections"
    >


      <!-- Your Stay -->
      <a
        class="card"
        href="arrival-guide.html"
        aria-label="Your Stay"
      >

        <img
          class="card-image"
          src="your-stay.PNG"
          alt="Balcony and sea view at 303 Oyster Bay"
        >

        <div class="card-label">
          <span>Your Stay</span>
          <span class="card-arrow">→</span>
        </div>

      </a>


      <!-- The Apartment -->
      <a
        class="card"
        href="The%20Apartment.pdf"
        aria-label="The Apartment"
      >

        <img
          class="card-image"
          src="apartment.jpg"
          alt="Interior of 303 Oyster Bay"
        >

        <div class="card-label">
          <span>The Apartment</span>
          <span class="card-arrow">→</span>
        </div>

      </a>


      <!-- Explore -->
      <a
        class="card"
        href="In%20and%20around.pdf"
        aria-label="Explore Surathkal and the coast"
      >

        <img
          class="card-image"
          src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Surathkal%20Light%20House%20Beach%20and%20Boats%20Karnataka%20India.jpg"
          alt="Surathkal Lighthouse, beach and boats"
        >

        <div class="card-label">
          <span>Explore</span>
          <span class="card-arrow">→</span>
        </div>

      </a>


      <!-- Gallery -->
      <a
        class="card"
        href="gallery.html"
        aria-label="Gallery"
      >

        <img
          class="card-image"
          src="gallery.jpg"
          alt="303 Oyster Bay exterior"
        >

        <div class="card-label">
          <span>Gallery</span>
          <span class="card-arrow">→</span>
        </div>

      </a>

    </section>


    <!-- =======================================================
         SIGNATURE
         ======================================================= -->

    <div class="closing">

      <div class="signature">
        <span>Sea you</span>
        <span>by the sea</span>
      </div>

    </div>


  </main>


  <!-- =========================================================
       SOUND
       ========================================================= -->

  <audio
    id="oceanSound"
    loop
    preload="none"
  >
    <source
      src="ocean-waves.mp3"
      type="audio/mpeg"
    >
  </audio>


  <button
    class="sound-control"
    id="soundControl"
    type="button"
    aria-label="Turn ocean sound on"
    aria-pressed="false"
    title="Ocean sound"
  >

    <!-- Speaker off -->
    <svg
      id="soundOffIcon"
      viewBox="0 0 32 32"
      aria-hidden="true"
    >
      <path d="M5 12H10L15 8V24L10 20H5Z" />
      <path d="M20 12L27 20" />
      <path d="M27 12L20 20" />
    </svg>


    <!-- Speaker on -->
    <svg
      id="soundOnIcon"
      viewBox="0 0 32 32"
      aria-hidden="true"
      style="display:none;"
    >
      <path d="M5 12H10L15 8V24L10 20H5Z" />
      <path d="M20 12C23 14 23 18 20 20" />
      <path d="M23 9C28 13 28 19 23 23" />
    </svg>

  </button>


  <script>

    /* =========================================================
       OCEAN SOUND
       ========================================================= */

    const sound =
      document.getElementById("oceanSound");

    const soundControl =
      document.getElementById("soundControl");

    const soundOffIcon =
      document.getElementById("soundOffIcon");

    const soundOnIcon =
      document.getElementById("soundOnIcon");


    soundControl.addEventListener(
      "click",
      async function () {

        if (sound.paused) {

          try {

            sound.volume = 0.22;

            await sound.play();

            soundControl.setAttribute(
              "aria-pressed",
              "true"
            );

            soundControl.setAttribute(
              "aria-label",
              "Turn ocean sound off"
            );

            soundOffIcon.style.display =
              "none";

            soundOnIcon.style.display =
              "block";

          } catch (error) {

            console.log(
              "Ocean sound could not be started.",
              error
            );

          }

        } else {

          sound.pause();

          soundControl.setAttribute(
            "aria-pressed",
            "false"
          );

          soundControl.setAttribute(
            "aria-label",
            "Turn ocean sound on"
          );

          soundOffIcon.style.display =
            "block";

          soundOnIcon.style.display =
            "none";
        }

      }
    );

  </script>
