<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;

    background:
        linear-gradient(
            rgba(222,198,158,.10),
            rgba(222,198,158,.10)
        ),
        url("sand-background.png?v=20260915");

    background-size:cover;
    background-position:center top;
    background-attachment:fixed;

    color:#573314;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:min(1200px,100%);

    /* CHANGED: no forced viewport height */
    min-height:0;

    margin:0 auto;

    padding:
        24px
        clamp(18px,4vw,48px)
        10px;
}


/* =========================================================
   TOP BRANDING
   ========================================================= */

.top{
    position:relative;
    z-index:2;
    text-align:center;
}

.guest-favourite{
    display:block;

    width:clamp(100px,11vw,140px);
    height:auto;

    margin:
        0 auto 5px;

    object-fit:contain;
}

.logo{
    display:block;

    width:clamp(235px,31vw,360px);
    max-width:82vw;
    height:auto;

    margin:0 auto;

    object-fit:contain;
}

.tagline{
    margin-top:4px;

    font-size:clamp(13px,1.5vw,18px);
    line-height:1.25;

    font-style:italic;

    color:#67431f;

    letter-spacing:.1px;
}


/* =========================================================
   FOUR MAIN CARDS
   ========================================================= */

.cards{
    position:relative;
    z-index:2;

    width:100%;
    max-width:1040px;

    margin:
        26px auto 0;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;
}

.card{
    display:block;

    overflow:hidden;

    text-decoration:none;

    color:#573314;

    background:#f7ead5;

    border-radius:9px;

    box-shadow:
        0 5px 14px rgba(73,45,20,.19),
        0 1px 2px rgba(73,45,20,.14);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 18px rgba(73,45,20,.23),
        0 2px 3px rgba(73,45,20,.15);
}


/* =========================================================
   CARD IMAGES
   ========================================================= */

.card-image{
    display:block;

    width:100%;

    height:clamp(205px,20vw,285px);

    object-fit:cover;
}

.card-explore .card-image{
    object-position:center center;
}

.card-gallery .card-image{
    object-position:center center;
}


/* =========================================================
   CARD CAPTION
   ========================================================= */

.card-caption{
    min-height:52px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        9px 15px 9px 18px;

    background:#f8ecd8;

    border-top:
        1px solid rgba(110,72,36,.10);
}

.card-title{
    font-size:clamp(18px,2vw,25px);
    line-height:1;
    font-weight:normal;
}

.arrow{
    flex:none;
    font-size:23px;
    line-height:1;
}


/* =========================================================
   FEATURE BAND
   ========================================================= */

.features{
    width:100%;
    max-width:1040px;

    margin:
        21px auto 0;

    padding:
        14px 3px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    background:
        rgba(249,237,215,.97);

    border-radius:10px;

    box-shadow:
        0 5px 14px rgba(73,45,20,.12);
}

.feature{
    min-width:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        0 9px;

    border-right:
        1px solid rgba(105,70,38,.19);
}

.feature:last-child{
    border-right:none;
}


/* =========================================================
   FEATURE ICONS
   ========================================================= */

.icon{
    width:28px;
    height:28px;

    margin-bottom:5px;

    color:#684321;
}

.icon svg{
    width:100%;
    height:100%;

    display:block;

    fill:none;

    stroke:currentColor;

    stroke-width:1.5;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.feature-main{
    font-size:clamp(11px,1.15vw,16px);
    line-height:1.1;
    white-space:normal;
}

.feature-sub{
    margin-top:3px;

    font-size:clamp(10px,1vw,13px);

    line-height:1.05;

    font-style:italic;

    color:#795b3b;
}


/* =========================================================
   BOTTOM SIGN-OFF
   ========================================================= */

.bottom{
    position:relative;

    width:100%;

    /*
       CHANGED:
       Shorter closing area so the page ends naturally.
    */
    height:130px;

    margin-top:5px;

    overflow:hidden;
}


/* =========================================================
   SEE YOU BY THE SEA
   ========================================================= */

.signature{
    position:absolute;

    z-index:2;

    left:50%;
    top:15px;

    transform:
        translateX(-50%)
        rotate(-5deg);

    width:max-content;
    max-width:94%;

    white-space:nowrap;

    font-family:
        "Caveat",
        cursive;

    font-size:
        clamp(42px,6vw,72px);

    font-weight:600;

    line-height:.9;

    letter-spacing:-1.5px;

    color:
        rgba(112,76,39,.76);

    text-shadow:
        1px 1px 0 rgba(245,226,191,.55),
        -1px -1px 0 rgba(121,82,42,.20),
        0 2px 3px rgba(112,76,39,.10);
}


/* =========================================================
   TABLET
   ========================================================= */

@media(max-width:850px){

    .page{
        padding:
            20px 26px 8px;
    }

    .guest-favourite{
        width:115px;
    }

    .logo{
        width:300px;
        max-width:72vw;
    }

    .cards{
        margin-top:22px;
        gap:14px;
    }

    .card-image{
        height:220px;
    }

    .features{
        margin-top:17px;
        padding:13px 2px;
    }

    .feature{
        padding:
            0 5px;
    }

    .icon{
        width:25px;
        height:25px;
    }

    .bottom{
        height:125px;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    body{
        background-attachment:scroll;
    }

    .page{
        padding:
            16px 14px 5px;
    }

    .guest-favourite{
        width:94px;
        margin-bottom:3px;
    }

    .logo{
        width:235px;
        max-width:78vw;
    }

    .tagline{
        margin-top:2px;
        font-size:12px;
    }

    .cards{
        margin-top:18px;
        gap:10px;
    }

    .card{
        border-radius:7px;
    }

    .card-image{
        height:145px;
    }

    .card-caption{
        min-height:42px;

        padding:
            7px 9px 7px 11px;
    }

    .card-title{
        font-size:15px;
    }

    .arrow{
        font-size:18px;
    }


    /* Feature strip — UNCHANGED */

    .features{
        margin-top:13px;
        padding:9px 0;
        border-radius:7px;
    }

    .feature{
        padding:
            0 3px;
    }

    .icon{
        width:20px;
        height:20px;
        margin-bottom:3px;
    }

    .feature-main{
        font-size:9.5px;
        line-height:1.05;
    }

    .feature-sub{
        font-size:8px;
        margin-top:2px;
    }


    /*
       ONLY the closing area is shortened.
    */

    .bottom{
        height:95px;
        margin-top:3px;
    }

    .signature{
        top:12px;

        font-size:42px;

        letter-spacing:-1.2px;

        transform:
            translateX(-50%)
            rotate(-5deg);
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
        padding-bottom:3px;
    }

    .guest-favourite{
        width:88px;
    }

    .logo{
        width:220px;
    }

    .cards{
        gap:8px;
    }

    .card-image{
        height:130px;
    }

    .card-caption{
        min-height:39px;

        padding-left:8px;
        padding-right:7px;
    }

    .card-title{
        font-size:13px;
    }

    .arrow{
        font-size:16px;
    }

    .feature-main{
        font-size:8.5px;
    }

    .feature-sub{
        font-size:7.3px;
    }

    .bottom{
        height:88px;
    }

    .signature{
        font-size:35px;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- TOP BRANDING -->

    <header class="top">

        <img
            class="guest-favourite"
            src="guest-favourite.png?v=20260915"
            alt="Airbnb Guest Favourite">

        <img
            class="logo"
            src="logo.png?v=20260915"
            alt="303 Oyster Bay">

        <div class="tagline">
            Where the sea slows you down.
        </div>

    </header>


    <!-- FOUR MAIN CARDS -->

    <main class="cards">


        <a
            class="card"
            href="your-stay.html"
        >

            <img
                class="card-image"
                src="your-stay.PNG?v=20260915"
                alt="Your Stay"
            >

            <div class="card-caption">

                <span class="card-title">
                    Your Stay
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


        <a
            class="card"
            href="the-apartment.html"
        >

            <img
                class="card-image"
                src="apartment.jpg?v=20260915"
                alt="The Apartment"
            >

            <div class="card-caption">

                <span class="card-title">
                    The Apartment
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


        <a
            class="card card-explore"
            href="in-and-around.html"
        >

            <img
                class="card-image"
                src="Lighthouse.jpg?v=20260915"
                alt="Surathkal Lighthouse"
            >

            <div class="card-caption">

                <span class="card-title">
                    Explore
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


        <a
            class="card card-gallery"
            href="gallery.html"
        >

            <img
                class="card-image"
                src="gallery.jpg?v=20260915"
                alt="303 Oyster Bay Gallery"
            >

            <div class="card-caption">

                <span class="card-title">
                    Gallery
                </span>

                <span class="arrow">
                    →
                </span>

            </div>

        </a>


    </main>


    <!-- FEATURE BAND -->

    <section class="features">


        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 32 32">

                    <path d="M4 22v-7h24v7"/>
                    <path d="M4 19h24"/>
                    <path d="M7 15v-4h7a3 3 0 0 1 3 3v1"/>
                    <path d="M4 25v-3"/>
                    <path d="M28 25v-3"/>

                </svg>

            </div>

            <div class="feature-main">
                2 Bedrooms
            </div>

            <div class="feature-sub">
                Sleeps 4 + 1
            </div>

        </div>


        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 32 32">

                    <path
                        d="M3 12c4 0 4 4 8 4s4-4 8-4 4 4 10 4"
                    />

                    <path
                        d="M3 19c4 0 4 4 8 4s4-4 8-4 4 4 10 4"
                    />

                </svg>

            </div>

            <div class="feature-main">
                Uninterrupted<br>
                Sea Views
            </div>

        </div>


        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 32 32">

                    <rect
                        x="5"
                        y="6"
                        width="22"
                        height="20"
                        rx="2"
                    />

                    <circle cx="11" cy="12" r="2"/>
                    <circle cx="20" cy="12" r="2"/>
                    <circle cx="11" cy="20" r="2"/>
                    <circle cx="20" cy="20" r="2"/>

                </svg>

            </div>

            <div class="feature-main">
                Full Kitchen
            </div>

        </div>


        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 32 32">

                    <path d="M5 21v-7l3-7h16l3 7v7"/>
                    <path d="M8 14h16"/>
                    <path d="M9 21v3"/>
                    <path d="M23 21v3"/>

                    <circle cx="10" cy="19" r="1.5"/>
                    <circle cx="22" cy="19" r="1.5"/>

                </svg>

            </div>

            <div class="feature-main">
                Free Parking
            </div>

        </div>


        <div class="feature">

            <div class="icon">

                <svg viewBox="0 0 32 32">

                    <path d="M5 12c7-6 15-6 22 0"/>
                    <path d="M9 17c4-4 10-4 14 0"/>
                    <path d="M13 21c2-2 4-2 6 0"/>

                    <circle
                        cx="16"
                        cy="25"
                        r="1"
                    />

                </svg>

            </div>

            <div class="feature-main">
                High-Speed<br>
                Wi-Fi
            </div>

        </div>


    </section>


    <!-- CLOSING -->

    <footer class="bottom">

        <div class="signature">
            See you by the Sea
        </div>

    </footer>


</div>

</body>
</html>
