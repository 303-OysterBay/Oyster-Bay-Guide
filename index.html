<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>303 Oyster Bay — Surathkal, Mangaluru</title>

<meta
    name="description"
    content="303 Oyster Bay — a seaside stay in Surathkal, Mangaluru."
>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #d8ad73;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.home-page {
    width: 100%;
    height: 100vh;
    height: 100svh;

    max-width: 1200px;

    margin: 0 auto;

    padding:
        clamp(14px, 2.2vw, 30px)
        clamp(14px, 2.5vw, 34px)
        clamp(12px, 2vw, 24px);

    display: flex;
    flex-direction: column;

    background-image: url("sand-background.jpg");
    background-repeat: no-repeat;
    background-position: center top;
    background-size: cover;

    overflow: hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    flex-shrink: 0;

    position: relative;
    z-index: 2;
}


/* =========================================================
   AIRBNB GUEST FAVOURITE
   ========================================================= */

.guest-favourite {
    display: block;

    width:
        clamp(115px, 15vw, 185px);

    height: auto;

    margin:
        0
        auto
        clamp(4px, 0.7vw, 9px)
        auto;

    flex-shrink: 0;
}


/* =========================================================
   PROPERTY LOGO
   ========================================================= */

.property-logo {
    display: block;

    width:
        clamp(235px, 39vw, 455px);

    max-width: 72%;

    height: auto;

    margin:
        0
        auto
        clamp(4px, 0.7vw, 9px)
        auto;

    flex-shrink: 0;
}


/* =========================================================
   TAGLINE
   ========================================================= */

.tagline {
    margin: 0;

    color: #5b3a20;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-style: italic;

    font-size:
        clamp(15px, 1.9vw, 25px);

    line-height: 1.05;

    text-align: center;

    white-space: nowrap;
}


/* =========================================================
   CARD GRID
   ========================================================= */

.card-grid {
    width: 100%;

    flex: 1 1 auto;

    min-height: 0;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    grid-template-rows:
        repeat(2, minmax(0, 1fr));

    gap:
        clamp(9px, 1.2vw, 18px);

    margin-top:
        clamp(10px, 1.5vw, 20px);

    margin-bottom:
        clamp(10px, 1.4vw, 18px);
}


/* =========================================================
   CARDS
   ========================================================= */

.card {
    position: relative;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    border-radius:
        clamp(16px, 2vw, 28px);

    background: #f5e9d1;

    text-decoration: none;

    box-shadow:
        0 5px 12px rgba(71, 42, 20, 0.15);

    display: block;

    aspect-ratio: 1 / 1;
}


/* =========================================================
   CARD IMAGE
   ========================================================= */

.card-image {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================================================
   CARD CAPTION
   ========================================================= */

.card-caption {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height:
        clamp(46px, 8vw, 78px);

    padding:
        0
        clamp(13px, 2vw, 25px);

    display: flex;

    align-items: center;
    justify-content: space-between;

    background:
        rgba(250, 240, 219, 0.97);

    color: #604027;
}


/* =========================================================
   CARD TITLE
   ========================================================= */

.card-title {
    margin: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: 700;

    font-size:
        clamp(17px, 2.8vw, 34px);

    line-height: 1;

    white-space: nowrap;
}


/* =========================================================
   CARD ARROW
   ========================================================= */

.card-arrow {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(25px, 3vw, 38px);

    font-weight: 400;

    line-height: 1;

    margin-left: 8px;

    flex-shrink: 0;
}


/* =========================================================
   FEATURES BAND
   ========================================================= */

.features {
    width: 100%;

    flex-shrink: 0;

    min-height:
        clamp(70px, 9vw, 112px);

    padding:
        clamp(7px, 1vw, 13px)
        clamp(4px, 0.7vw, 10px);

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    align-items: center;

    background:
        rgba(250, 240, 219, 0.94);

    border-radius:
        clamp(17px, 2.2vw, 30px);

    box-shadow:
        0 4px 10px rgba(71, 42, 20, 0.12);
}


/* =========================================================
   FEATURE ITEM
   ========================================================= */

.feature {
    min-width: 0;

    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    position: relative;

    padding:
        0
        clamp(3px, 0.5vw, 7px);
}


/* =========================================================
   FEATURE DIVIDERS
   ========================================================= */

.feature:not(:last-child)::after {
    content: "";

    position: absolute;

    top: 8%;
    bottom: 8%;

    right: 0;

    width: 1px;

    background:
        rgba(105, 75, 47, 0.30);
}


/* =========================================================
   FEATURE ICON
   ========================================================= */

.feature svg {
    width:
        clamp(28px, 4vw, 50px);

    height:
        clamp(28px, 4vw, 50px);

    margin-bottom:
        clamp(3px, 0.6vw, 8px);

    flex-shrink: 0;

    fill: none;

    stroke: #604027;

    stroke-width: 2.2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   FEATURE MAIN TEXT
   ========================================================= */

.feature-title {
    margin: 0;

    color: #604027;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(9px, 1.35vw, 17px);

    font-weight: 700;

    line-height: 1.05;

    text-align: center;

    white-space: nowrap;
}


/* =========================================================
   FEATURE SUBTEXT
   ========================================================= */

.feature-subtitle {
    margin:
        2px
        0
        0;

    color: #80644a;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(7px, 0.95vw, 12px);

    font-style: italic;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}


/* =========================================================
   TABLET / MEDIUM SCREENS
   ========================================================= */

@media (max-width: 900px) {

    .home-page {
        padding:
            12px
            14px
            12px;
    }

    .guest-favourite {
        width: 120px;
        margin-bottom: 3px;
    }

    .property-logo {
        width: 285px;
        max-width: 67%;
        margin-bottom: 3px;
    }

    .tagline {
        font-size: 16px;
    }

    .card-grid {
        gap: 9px;
        margin-top: 9px;
        margin-bottom: 9px;
    }

    .card {
        border-radius: 17px;
    }

    .card-caption {
        height: 48px;
        padding-left: 13px;
        padding-right: 13px;
    }

    .card-title {
        font-size: 18px;
    }

    .card-arrow {
        font-size: 25px;
    }

    .features {
        min-height: 72px;
        border-radius: 18px;
    }

    .feature svg {
        width: 29px;
        height: 29px;
        margin-bottom: 3px;
    }

    .feature-title {
        font-size: 9px;
    }

    .feature-subtitle {
        font-size: 7px;
    }
}


/* =========================================================
   PHONE
   ========================================================= */

@media (max-width: 600px) {

    .home-page {
        padding:
            9px
            10px
            9px;
    }

    .guest-favourite {
        width: 118px;

        margin-top: 0;
        margin-bottom: 2px;
    }

    .property-logo {
        width: 270px;
        max-width: 72%;

        margin-bottom: 2px;
    }

    .tagline {
        font-size: 15px;
    }

    .card-grid {
        gap: 8px;

        margin-top: 8px;
        margin-bottom: 8px;
    }

    .card {
        aspect-ratio: 1 / 1;

        border-radius: 16px;

        box-shadow:
            0 3px 8px rgba(71, 42, 20, 0.15);
    }

    .card-caption {
        height: 38px;

        padding:
            0
            11px;
    }

    .card-title {
        font-size: 16px;
    }

    .card-arrow {
        font-size: 23px;
    }

    .features {
        min-height: 68px;

        padding:
            5px
            2px;

        border-radius: 17px;
    }

    .feature {
        padding:
            0
            2px;
    }

    .feature svg {
        width: 27px;
        height: 27px;

        margin-bottom: 3px;

        stroke-width: 2.1;
    }

    .feature-title {
        font-size: 8.5px;

        letter-spacing: -0.15px;
    }

    .feature-subtitle {
        font-size: 6.8px;
    }

    .feature:not(:last-child)::after {
        top: 10%;
        bottom: 10%;
    }
}


/* =========================================================
   SMALL PHONE
   ========================================================= */

@media (max-width: 390px) {

    .home-page {
        padding:
            7px
            8px
            7px;
    }

    .guest-favourite {
        width: 108px;
    }

    .property-logo {
        width: 250px;
        max-width: 73%;
    }

    .tagline {
        font-size: 14px;
    }

    .card-grid {
        gap: 7px;

        margin-top: 7px;
        margin-bottom: 7px;
    }

    .card-caption {
        height: 35px;

        padding:
            0
            9px;
    }

    .card-title {
        font-size: 14px;
    }

    .card-arrow {
        font-size: 20px;
    }

    .features {
        min-height: 64px;

        border-radius: 15px;
    }

    .feature svg {
        width: 24px;
        height: 24px;

        margin-bottom: 2px;
    }

    .feature-title {
        font-size: 7.7px;
    }

    .feature-subtitle {
        font-size: 6.2px;
    }
}


/* =========================================================
   VERY SHORT PHONE
   ========================================================= */

@media (max-height: 700px) and (max-width: 600px) {

    .home-page {
        padding:
            6px
            8px
            6px;
    }

    .guest-favourite {
        width: 100px;
    }

    .property-logo {
        width: 225px;
    }

    .tagline {
        font-size: 13px;
    }

    .card-grid {
        margin-top: 6px;
        margin-bottom: 6px;
        gap: 6px;
    }

    .card-caption {
        height: 32px;
    }

    .card-title {
        font-size: 13px;
    }

    .card-arrow {
        font-size: 19px;
    }

    .features {
        min-height: 58px;
    }

    .feature svg {
        width: 21px;
        height: 21px;
    }

    .feature-title {
        font-size: 7px;
    }

    .feature-subtitle {
        font-size: 5.8px;
    }
}

</style>
</head>


<body>

<main class="home-page">

</body>
