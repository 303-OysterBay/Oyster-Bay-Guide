<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Gallery — 303 Oyster Bay</title>

<meta
    name="description"
    content="Gallery — 303 Oyster Bay, Surathkal, Mangaluru."

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #d9b37c;
    color: #5b3a20;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.gallery-page {
    width: 100%;
    min-height: 100vh;

    position: relative;

    padding:
        clamp(24px, 4vw, 55px)
        clamp(18px, 4vw, 60px)
        0;

    background-color: #d9b37c;

    background-image:
        url("sand-background.jpg");

    background-repeat: no-repeat;

    background-position:
        center bottom;

    background-size:
        100% 100%;
}


/* =========================================================
   TOP AREA
   ========================================================= */

.gallery-header {
    position: relative;

    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    margin-bottom:
        clamp(26px, 4vw, 52px);
}


/* =========================================================
   HOME BUTTON
   ========================================================= */

.home-button {
    position: absolute;

    top: 0;
    left: 0;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    padding:
        11px
        19px;

    min-height: 44px;

    border-radius: 30px;

    background:
        rgba(250, 240, 219, 0.96);

    color: #5b3a20;

    text-decoration: none;

    font-size:
        clamp(14px, 1.8vw, 22px);

    font-weight: 400;

    box-shadow:
        0 3px 8px rgba(71, 42, 20, 0.12);

    z-index: 5;
}

.home-arrow {
    font-size: 1.25em;
    line-height: 1;
}


/* =========================================================
   SALT / SAND / STORIES COASTAL DETAIL
   ========================================================= */

.coastal-plaque {
    position: absolute;

    top: -5px;
    right: 0;

    width:
        clamp(155px, 22vw, 285px);

    min-height:
        clamp(82px, 11vw, 145px);

    padding:
        clamp(14px, 1.8vw, 24px)
        clamp(20px, 2.5vw, 34px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    transform: rotate(-3deg);

    background:
        linear-gradient(
            145deg,
            #9b7045,
            #c69a61 45%,
            #a97a4b
        );

    border-radius:
        4px
        3px
        6px
        2px;

    box-shadow:
        0 7px 13px rgba(61, 37, 20, 0.22);

    z-index: 3;

    overflow: visible;
}


/* driftwood planks */

.coastal-plaque::before,
.coastal-plaque::after {
    content: "";

    position: absolute;

    height: 9px;

    border-radius: 50%;

    background:
        #76502f;

    opacity: 0.8;
}

.coastal-plaque::before {
    width: 105%;
    left: -3%;
    top: 18%;
    transform: rotate(4deg);
}

.coastal-plaque::after {
    width: 92%;
    right: -2%;
    bottom: 17%;
    transform: rotate(-5deg);
}


/* little rope / coastal detail */

.coastal-rope {
    position: absolute;

    width: 28px;
    height: 28px;

    right: -18px;
    bottom: -12px;

    border:
        3px solid #705032;

    border-radius: 50%;

    opacity: 0.8;
}


/* plaque text */

.coastal-plaque span {
    position: relative;
    z-index: 2;

    color: #382513;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(16px, 2vw, 26px);

    font-weight: 500;

    line-height: 1.05;

    letter-spacing:
        0.02em;

    text-align: center;
}


/* =========================================================
   GALLERY TITLE
   ========================================================= */

.gallery-title {
    margin:
        clamp(42px, 5vw, 62px)
        0
        0;

    color: #5b3a20;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(48px, 7vw, 92px);

    font-weight: 400;

    line-height: 0.95;

    text-align: center;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.gallery-category {
    width: 100%;

    margin-bottom:
        clamp(38px, 5vw, 68px);
}


/* =========================================================
   CATEGORY HEADING
   ========================================================= */

.category-heading {
    display: flex;

    align-items: center;

    width: 100%;

    margin-bottom:
        clamp(12px, 1.8vw, 22px);
}


/* =========================================================
   CATEGORY ICON
   ========================================================= */

.category-icon {
    width:
        clamp(36px, 4.5vw, 60px);

    height:
        clamp(36px, 4.5vw, 60px);

    flex-shrink: 0;

    margin-right:
        clamp(12px, 1.5vw, 20px);

    fill: none;

    stroke: #5b3a20;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   CATEGORY NAME
   ========================================================= */

.category-name {
    margin: 0;

    flex-shrink: 0;

    color: #5b3a20;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(25px, 3.4vw, 44px);

    font-weight: 400;

    line-height: 1;
}


/* =========================================================
   CATEGORY RULE
   ========================================================= */

.category-rule {
    height: 1px;

    flex: 1;

    margin-left:
        clamp(12px, 2vw, 28px);

    background:
        rgba(91, 58, 32, 0.58);
}


/* =========================================================
   PHOTO STRIP
   ========================================================= */

.photo-strip {
    width: 100%;

    display: flex;

    gap:
        clamp(12px, 1.5vw, 20px);

    overflow-x: auto;

    overflow-y: hidden;

    padding:
        2px
        0
        10px;

    scroll-behavior: smooth;

    overscroll-behavior-x: contain;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: none;
}

.photo-strip::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {
    position: relative;

    flex:
        0 0
        clamp(220px, 21vw, 310px);

    aspect-ratio:
        1.42 / 1;

    border: 0;

    padding: 0;

    border-radius:
        clamp(13px, 1.5vw, 21px);

    overflow: hidden;

    background: #ead8b9;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(71, 42, 20, 0.17);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.photo-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 18px rgba(71, 42, 20, 0.23);
}

.photo-card img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =========================================================
   FIVE-IMAGE PROTOTYPE
   The fifth image deliberately peeps into view.
   ========================================================= */

.photo-card:nth-child(5) {
    margin-right:
        clamp(80px, 9vw, 130px);
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    padding:
        clamp(18px, 4vw, 50px);

    background:
        rgba(38, 24, 13, 0.88);
}

.lightbox.active {
    display: flex;
}


/* =========================================================
   LIGHTBOX IMAGE
   ========================================================= */

.lightbox-image {
    max-width: 92vw;
    max-height: 88vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius:
        clamp(12px, 1.5vw, 22px);

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.38);

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   LIGHTBOX CLOSE
   ========================================================= */

.lightbox-close {
    position: absolute;

    top:
        clamp(14px, 2vw, 28px);

    right:
        clamp(14px, 2vw, 28px);

    width:
        clamp(42px, 5vw, 58px);

    height:
        clamp(42px, 5vw, 58px);

    border: none;

    border-radius: 50%;

    background:
        rgba(250, 240, 219, 0.96);

    color: #5b3a20;

    font-size:
        clamp(25px, 3vw, 38px);

    line-height: 1;

    cursor: pointer;

    z-index: 1002;
}


/* =========================================================
   LIGHTBOX NAVIGATION
   ========================================================= */

.lightbox-nav {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width:
        clamp(44px, 5vw, 62px);

    height:
        clamp(44px, 5vw, 62px);

    border: none;

    border-radius: 50%;

    background:
        rgba(250, 240, 219, 0.96);

    color: #5b3a20;

    font-size:
        clamp(25px, 3vw, 38px);

    cursor: pointer;

    z-index: 1002;

    display: flex;

    align-items: center;
    justify-content: center;
}

.lightbox-prev {
    left:
        clamp(12px, 2vw, 30px);
}

.lightbox-next {
    right:
        clamp(12px, 2vw, 30px);
}


/* =========================================================
   LIGHTBOX COUNTER
   ========================================================= */

.lightbox-counter {
    position: absolute;

    bottom:
        clamp(14px, 2vw, 28px);

    left: 50%;

    transform: translateX(-50%);

    color: #f7ecd8;

    font-size:
        clamp(12px, 1.5vw, 17px);

    letter-spacing:
        0.04em;

    z-index: 1002;
}


/* =========================================================
   BOTTOM BRAND AREA
   ========================================================= */

.gallery-footer {
    width: 100%;

    display: flex;

    justify-content: center;
    align-items: flex-end;

    padding:
        clamp(55px, 8vw, 100px)
        0
        clamp(24px, 4vw, 50px);

    position: relative;
}


/* =========================================================
   FOOTER LOGO
   ========================================================= */

.footer-logo {
    display: block;

    width:
        clamp(210px, 27vw, 340px);

    max-width: 55vw;

    height: auto;

    margin: 0 auto;
}


/* =========================================================
   SMALL DECORATIVE SHELLS
   These are deliberately subtle and remain at the bottom.
   ========================================================= */

.gallery-footer::before {
    content: "◜";

    position: absolute;

    left:
        clamp(12px, 5vw, 65px);

    bottom:
        clamp(20px, 3vw, 40px);

    color: rgba(91, 58, 32, 0.55);

    font-size:
        clamp(45px, 7vw, 90px);

    transform: rotate(-35deg);
}

.gallery-footer::after {
    content: "◝";

    position: absolute;

    right:
        clamp(12px, 5vw, 65px);

    bottom:
        clamp(20px, 3vw, 40px);

    color: rgba(91, 58, 32, 0.55);

    font-size:
        clamp(45px, 7vw, 90px);

    transform: rotate(35deg);
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

    .gallery-page {
        padding:
            22px
            18px
            0;
    }

    .coastal-plaque {
        width: 170px;
        min-height: 88px;
    }

    .coastal-plaque span {
        font-size: 16px;
    }

    .gallery-title {
        margin-top: 52px;
        font-size: 58px;
    }

    .photo-card {
        flex-basis: 255px;
    }
}


/* =========================================================
   PHONE
   ========================================================= */

@media (max-width: 600px) {

    .gallery-page {
        padding:
            16px
            12px
            0;
    }


    /* -----------------------------
       HEADER
       ----------------------------- */

    .gallery-header {
        margin-bottom: 30px;
    }


    /* -----------------------------
       HOME
       ----------------------------- */

    .home-button {
        top: 0;
        left: 0;

        min-height: 38px;

        padding:
            8px
            13px;

        gap: 6px;

        font-size: 14px;
    }


    /* -----------------------------
       COASTAL PLAQUE
       ----------------------------- */

    .coastal-plaque {
        top: -2px;
        right: 0;

        width: 122px;

        min-height: 70px;

        padding:
            9px
            13px;
    }

    .coastal-plaque span {
        font-size: 14px;
    }

    .coastal-plaque::before,
    .coastal-plaque::after {
        height: 6px;
    }


    /* -----------------------------
       TITLE
       ----------------------------- */

    .gallery-title {
        margin-top: 78px;

        font-size: 48px;

        line-height: 1;
    }


    /* -----------------------------
       CATEGORY
       ----------------------------- */

    .gallery-category {
        margin-bottom: 38px;
    }

    .category-heading {
        margin-bottom: 11px;
    }

    .category-icon {
        width: 32px;
        height: 32px;

        margin-right: 9px;
    }

    .category-name {
        font-size: 25px;
    }

    .category-rule {
        margin-left: 10px;
    }


    /* -----------------------------
       PHOTO STRIP
       ----------------------------- */

    .photo-strip {
        gap: 9px;

        padding-bottom: 8px;
    }

    .photo-card {
        flex-basis:
            68vw;

        aspect-ratio:
            1.35 / 1;

        border-radius: 14px;
    }

    .photo-card:nth-child(5) {
        margin-right: 65px;
    }


    /* -----------------------------
       FOOTER
       ----------------------------- */

    .gallery-footer {
        padding:
            48px
            0
            26px;
    }

    .footer-logo {
        width: 210px;
    }
}


/* =========================================================
   SMALL PHONE
   ========================================================= */

@media (max-width: 390px) {

    .gallery-page {
        padding-left: 10px;
        padding-right: 10px;
    }

    .coastal-plaque {
        width: 112px;
        min-height: 65px;
    }

    .coastal-plaque span {
        font-size: 13px;
    }

    .gallery-title {
        margin-top: 75px;
        font-size: 43px;
    }

    .category-name {
        font-size: 23px;
    }

    .category-icon {
        width: 29px;
        height: 29px;
    }

    .photo-card {
        flex-basis: 72vw;
    }

    .footer-logo {
        width: 195px;
    }
}

</style>

                    alt="Kitchen"
                >

            <button
                class="photo-card"
                data-category="Kitchen"
                data-index="1"
                type="button"
            >
                <img
                    src="Blank Kitchen.png"
                >
            </button>


            <button
                class="photo-card"
                data-category="Kitchen"
                data-index="2"
                type="button"
            >
                <img
                    src="Blank Kitchen.png"
                >
            </button>


            <button
                class="photo-card"
                data-category="Kitchen"
                data-index="3"
                type="button"
            >
                <img
                    src="Blank Kitchen.png"
                >
            </button>


            <button
                class="photo-card"
                data-category="Kitchen"
                data-index="4"

    <!-- =====================================================

<!-- =========================================================
     LIGHTBOX
     ========================================================= -->

<div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
>


    <button
        class="lightbox-close"
        id="lightboxClose"
        type="button"
        aria-label="Close image"
    >
        ×
    </button>


    <button
        class="lightbox-nav lightbox-prev"
        id="lightboxPrev"
        type="button"
        aria-label="Previous image"
    >
        ‹
    </button>


    <img
        class="lightbox-image"
        id="lightboxImage"
        src=""
        alt=""
    >


    <button
        class="lightbox-nav lightbox-next"
        id="lightboxNext"
        type="button"
        aria-label="Next image"
    >
        ›
    </button>


    <div
        class="lightbox-counter"
        id="lightboxCounter"
    ></div>


</div>



<script>

/* =========================================================
   GALLERY DATA
   ========================================================= */

const galleryData = {

    "Sea Views": [
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG"
    ],

    "Living": [
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg"
    ],

    "Bedroom": [
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg"
    ],

    "Kitchen": [
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png"
    ]

};


/* =========================================================
   LIGHTBOX ELEMENTS
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

const lightboxCounter =
    document.getElementById("lightboxCounter");


/* =========================================================
   CURRENT POSITION
   ========================================================= */

let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN LIGHTBOX
   ========================================================= */

function openLightbox(category, index) {

    currentCategory = category;
    currentIndex = index;

    updateLightbox();

    lightbox.classList.add("active");

    lightbox.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow = "hidden";
}


/* =========================================================
   UPDATE LIGHTBOX
   ========================================================= */

function updateLightbox() {

    const images =
        galleryData[currentCategory];

    lightboxImage.src =
        images[currentIndex];

    lightboxImage.alt =
        currentCategory +
        " — image " +
        (currentIndex + 1);

    lightboxCounter.textContent =
        currentCategory +
        "  •  " +
        (currentIndex + 1) +
        " / " +
        images.length;
}


/* =========================================================
   CLOSE LIGHTBOX
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    lightbox.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.style.overflow = "";
}


/* =========================================================
   NEXT IMAGE
   ========================================================= */

function nextImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex + 1) %
        images.length;

    updateLightbox();
}


/* =========================================================
   PREVIOUS IMAGE
   ========================================================= */

function previousImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length) %
        images.length;

    updateLightbox();
}


/* =========================================================
   THUMBNAIL CLICK EVENTS
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                const category =
                    card.dataset.category;

                const index =
                    Number(card.dataset.index);

                openLightbox(
                    category,
                    index
                );

            }
        );

    });


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* =========================================================
   CLICK OUTSIDE IMAGE
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {
            closeLightbox();
        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {
            return;
        }

        if (event.key === "Escape") {
            closeLightbox();
        }

        if (event.key === "ArrowRight") {
            nextImage();
        }

        if (event.key === "ArrowLeft") {
            previousImage();
        }

    }
);


/* =========================================================
   TOUCH SWIPE IN LIGHTBOX
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {
        passive: true
    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        touchEndX =
            event.changedTouches[0].screenX;

        const difference =
            touchEndX - touchStartX;

        if (
            Math.abs(difference) < 50
        ) {
            return;
        }

        if (difference < 0) {
            nextImage();
        } else {
            previousImage();
        }

    },
    {
        passive: true
    }
);

</script>


</body>
</html>
