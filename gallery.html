<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

    name="viewport"

<title>Gallery — 303 Oyster Bay</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;

    color: #5b3a20;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #d8ad73;
}


/* =========================================================
   PAGE
   ========================================================= */

.gallery-page {
    width: 100%;
    min-height: 100vh;

    overflow: hidden;

    background-color: #d8ad73;

    /*
       Use the sand image as texture only.
       Do NOT stretch the 1200x1600 composition.
    */
    background-image:
        url("sand-background.jpg");

    background-repeat: repeat-y;

    background-position:
        center top;

    background-size:
        1200px auto;
}


/* =========================================================
   CONTENT WRAPPER
   ========================================================= */

.gallery-content {
    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    padding:
        28px
        clamp(18px, 3vw, 40px)
        0;
}


/* =========================================================
   HEADER
   ========================================================= */

.gallery-header {
    position: relative;

    width: 100%;

    min-height:
        clamp(230px, 25vw, 330px);

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom:
        clamp(24px, 3vw, 40px);
}


/* =========================================================
   HOME BUTTON
   ========================================================= */

.home-button {
    position: absolute;

    top: 0;
    left: 0;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    padding:
        10px
        17px;

    border-radius: 30px;

    background:
        rgba(250, 240, 219, 0.96);

    color: #5b3a20;

    text-decoration: none;

    font-size:
        clamp(15px, 1.7vw, 21px);

    line-height: 1;

    box-shadow:
        0 3px 8px rgba(71, 42, 20, 0.14);

    z-index: 10;
}

.home-arrow {
    font-size: 1.25em;
}


/* =========================================================
   TOP COASTAL DECORATION
   ========================================================= */

.coastal-top {
    position: absolute;

    top: 0;
    right: 0;

    width:
        clamp(270px, 36vw, 470px);

    height:
        clamp(125px, 15vw, 190px);

    pointer-events: none;

    z-index: 2;
}


/* =========================================================
   DRIFTWOOD
   ========================================================= */

.driftwood {
    position: absolute;

    right: 0;
    top: 0;

    width: 78%;

    height: 26px;

    border-radius:
        50%;

    background:
        linear-gradient(
            90deg,
            #715033,
            #a67b4c 35%,
            #795638 70%,
            #b18a59
        );

    transform:
        rotate(-7deg);

    box-shadow:
        0 4px 7px rgba(60, 37, 20, 0.20);
}

.driftwood::before {
    content: "";

    position: absolute;

    width: 72%;
    height: 17px;

    left: 10px;
    top: 25px;

    border-radius: 50%;

    background:
        #8a6540;

    transform:
        rotate(5deg);
}

.driftwood::after {
    content: "";

    position: absolute;

    width: 48%;
    height: 13px;

    right: 2px;
    top: 43px;

    border-radius: 50%;

    background:
        #705034;

    transform:
        rotate(-5deg);
}


/* =========================================================
   SALT SAND STORIES PLAQUE
   ========================================================= */

.salt-sign {
    position: absolute;

    top: 28px;
    right: 5px;

    width:
        clamp(125px, 16vw, 210px);

    height:
        clamp(82px, 10vw, 125px);

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 12px;

    background:
        linear-gradient(
            135deg,
            #ad8151,
            #c69b63,
            #a97949
        );

    border-radius:
        3px
        5px
        3px
        4px;

    transform:
        rotate(-4deg);

    box-shadow:
        0 6px 10px rgba(65, 39, 20, 0.20);
}

.salt-sign::before,
.salt-sign::after {
    content: "";

    position: absolute;

    width: 92%;

    height: 5px;

    background:
        rgba(76, 49, 29, 0.50);

    border-radius: 50%;
}

.salt-sign::before {
    top: 18px;

    transform:
        rotate(2deg);
}

.salt-sign::after {
    bottom: 18px;

    transform:
        rotate(-3deg);
}

.salt-sign span {
    position: relative;

    z-index: 2;

    color: #4c301d;

    font-size:
        clamp(15px, 1.8vw, 23px);

    font-weight: 500;

    line-height: 1.05;

    text-align: center;
}


/* =========================================================
   GALLERY TITLE
   ========================================================= */

.gallery-title {
    margin:
        45px
        0
        0;

    color: #5b3a20;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(48px, 7vw, 88px);

    font-weight: 400;

    line-height: 1;

    text-align: center;

    position: relative;

    z-index: 5;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.gallery-category {
    width: 100%;

    margin-bottom:
        clamp(35px, 4vw, 55px);
}


/* =========================================================
   CATEGORY HEADER
   ========================================================= */

.category-heading {
    width: 100%;

    display: flex;

    align-items: center;

    margin-bottom:
        12px;
}


/* =========================================================
   CATEGORY ICON
   ========================================================= */

.category-icon {
    width:
        clamp(32px, 4vw, 52px);

    height:
        clamp(32px, 4vw, 52px);

    flex-shrink: 0;

    margin-right:
        11px;

    fill: none;

    stroke: #5b3a20;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   CATEGORY NAME
   ========================================================= */

.category-name {
    margin: 0;

    color: #5b3a20;

    font-size:
        clamp(24px, 3.3vw, 40px);

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;
}


/* =========================================================
   RULE
   ========================================================= */

.category-rule {
    flex: 1;

    height: 1px;

    margin-left:
        14px;

    background:
        rgba(91, 58, 32, 0.52);
}


/* =========================================================
   PHOTO STRIP
   ========================================================= */

.photo-strip {
    width: 100%;

    display: flex;

    gap:
        clamp(8px, 1.2vw, 15px);

    overflow-x: auto;

    overflow-y: hidden;

    padding:
        2px
        0
        7px;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    scroll-behavior: smooth;

    overscroll-behavior-x: contain;
}

.photo-strip::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO
   ========================================================= */

.photo-card {
    flex:
        0 0
        clamp(145px, 15vw, 205px);

    aspect-ratio:
        1.38 / 1;

    padding: 0;

    border: 0;

    border-radius:
        clamp(10px, 1.3vw, 17px);

    overflow: hidden;

    background:
        #ead8b9;

    box-shadow:
        0 4px 9px rgba(71, 42, 20, 0.15);

    cursor: pointer;

    transition:
        transform 0.18s ease;
}

.photo-card:hover {
    transform:
        translateY(-2px);
}

.photo-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/*
   The final visible card is not hidden.
   This creates the deliberate "there is more" cue.
*/

.photo-card:last-child {
    margin-right:
        80px;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    padding:
        55px
        55px
        60px;

    background:
        rgba(36, 24, 14, 0.90);
}

.lightbox.active {
    display: flex;
}


/* =========================================================
   LIGHTBOX IMAGE
   ========================================================= */

.lightbox-image {
    max-width: 90vw;
    max-height: 86vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius:
        15px;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.40);

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   CLOSE
   ========================================================= */

.lightbox-close {
    position: absolute;

    top: 16px;
    right: 18px;

    width: 46px;
    height: 46px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(250, 240, 219, 0.97);

    color: #5b3a20;

    font-size: 30px;

    line-height: 1;

    cursor: pointer;
}


/* =========================================================
   PREVIOUS / NEXT
   ========================================================= */

.lightbox-nav {
    position: absolute;

    top: 50%;

    transform:
        translateY(-50%);

    width: 48px;
    height: 48px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(250, 240, 219, 0.97);

    color: #5b3a20;

    font-size: 34px;

    line-height: 1;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;
}

.lightbox-prev {
    left: 15px;
}

.lightbox-next {
    right: 15px;
}


/* =========================================================
   COUNTER
   ========================================================= */

.lightbox-counter {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform:
        translateX(-50%);

    color: #f8ecd7;

    font-size: 13px;

    letter-spacing:
        0.03em;
}


/* =========================================================
   FOOTER
   ========================================================= */

.gallery-footer {
    position: relative;

    width: 100%;

    min-height:
        340px;

    margin-top:
        10px;

    padding:
        90px
        20px
        55px;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    /*
       The footer uses the actual sand asset as a
       dedicated 1200x1600 visual section rather
       than stretching it over the whole page.
    */

    background-image:
        url("sand-background.jpg");

    background-repeat: no-repeat;

    background-position:
        center bottom;

    background-size:
        100% auto;
}


/* =========================================================
   ACTUAL 303 LOGO ASSET
   ========================================================= */

.footer-logo {
    position: relative;

    z-index: 5;

    display: block;

    width:
        clamp(210px, 27vw, 330px);

    max-width: 60%;

    height: auto;

    margin: 0 auto;
}


/* =========================================================
   FOOTER SOFT SAND FADE
   ========================================================= */

.gallery-footer::before {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 0;

    height: 110px;

    background:
        linear-gradient(
            to bottom,
            rgba(216, 173, 115, 0),
            rgba(216, 173, 115, 0.28)
        );

    pointer-events: none;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

}

    }

       ----------------------------- */

    .gallery-title {

        font-size:
            47px;
    }


    /* -----------------------------

       ----------------------------- */

    .gallery-category {
        margin-bottom:
            34px;
    }

    .category-heading {
        margin-bottom:

    }

    .category-icon {

            30px;

    .photo-strip {

            29px;
    }

    .lightbox-prev {
        left:
            8px;
    }

    .lightbox-next {
        right:
            8px;
    }
}


/* =========================================================
   SMALL PHONE
   ========================================================= */

@media (max-width: 390px) {

    .gallery-header {

    }

    }

    .gallery-footer {
        min-height:
            270px;
    }

    .footer-logo {
        width:
            190px;
    }
}

</style>

                    data-category="Kitchen"
                    data-index="1"
                >
                    <img
                        src="Blank Kitchen.png"
                        alt="Kitchen"
                    >
                </button>


                <button
                    class="photo-card"
                    data-category="Kitchen"
                    data-index="2"
                >
                    <img
                        src="Blank Kitchen.png"
                        alt="Kitchen"
                    >
                </button>


                <button
                    class="photo-card"
                    data-category="Kitchen"
                    data-index="3"
                >
                    <img
                        src="Blank Kitchen.png"
                        alt="Kitchen"
                    >
                </button>


                <button
                    class="photo-card"
                    data-category="Kitchen"
                    data-index="4"
                >
                    <img
                        src="Blank Kitchen.png"
                        alt="Kitchen"
                    >
                </button>


            </div>

        </section>


    </div>



    <!-- =====================================================
         BOTTOM BRAND AREA
         ===================================================== -->

    <footer class="gallery-footer">

        <img
            class="footer-logo"
            src="logo.png"
            alt="303 Oyster Bay — Surathkal · Mangaluru"
        >

    </footer>


</main>



<!-- =========================================================
     LIGHTBOX
     ========================================================= -->

<div
    class="lightbox"
    id="lightbox"
>


    <button
        class="lightbox-close"
        id="lightboxClose"
        aria-label="Close"
    >
        ×
    </button>


    <button
        class="lightbox-nav lightbox-prev"
        id="lightboxPrev"
        aria-label="Previous image"
    >
        ‹
    </button>


    <img
        class="lightbox-image"
        id="lightboxImage"
        src=""
        alt=""
    >


    <button
        class="lightbox-nav lightbox-next"
        id="lightboxNext"
        aria-label="Next image"
    >
        ›
    </button>


    <div
        class="lightbox-counter"
        id="lightboxCounter"
    ></div>


</div>



<script>

/* =========================================================
   GALLERY DATA
   ========================================================= */

const galleryData = {

    "Sea Views": [
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG"
    ],

    "Living": [
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg"
    ],

    "Bedroom": [
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg"
    ],

    "Kitchen": [
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png"
    ]

};


/* =========================================================
   LIGHTBOX ELEMENTS
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

const lightboxCounter =
    document.getElementById("lightboxCounter");


/* =========================================================
   CURRENT IMAGE
   ========================================================= */

let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(
    category,
    index
) {

    currentCategory =
        category;

    currentIndex =
        index;

    updateLightbox();

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";
}


/* =========================================================
   UPDATE
   ========================================================= */

function updateLightbox() {

    const images =
        galleryData[currentCategory];

    lightboxImage.src =
        images[currentIndex];

    lightboxImage.alt =
        currentCategory +
        " — image " +
        (currentIndex + 1);

    lightboxCounter.textContent =
        currentCategory +
        "  •  " +
        (currentIndex + 1) +
        " / " +
        images.length;
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex + 1) %
        images.length;

    updateLightbox();
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (
            currentIndex -
            1 +
            images.length
        ) %
        images.length;

    updateLightbox();
}


/* =========================================================
   THUMBNAIL EVENTS
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                openLightbox(
                    card.dataset.category,
                    Number(
                        card.dataset.index
                    )
                );

            }
        );

    });


/* =========================================================
   BUTTONS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* =========================================================
   OUTSIDE CLICK
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {
            closeLightbox();
        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {
            return;
        }

        if (
            event.key === "Escape"
        ) {
            closeLightbox();
        }

        if (
            event.key === "ArrowRight"
        ) {
            nextImage();
        }

        if (
            event.key === "ArrowLeft"
        ) {
            previousImage();
        }

    }
);


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

let touchStartX = 0;

lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    },
    {
        passive: true
    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        const touchEndX =
            event.changedTouches[0]
                .screenX;

        const distance =
            touchEndX -
            touchStartX;

        if (
            Math.abs(distance) < 50
        ) {
            return;
        }

        if (
            distance < 0
        ) {
            nextImage();
        } else {
            previousImage();
        }

    },
    {
        passive: true
    }
);

</script>


</body>
</html>
