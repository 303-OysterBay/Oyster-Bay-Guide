<!DOCTYPE html>

      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Gallery | 303 OYSTER BAY</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #5b3b23;
}


/* =========================================================
   PAGE
   ========================================================= */

.gallery-page {
    position: relative;

    width: 100%;
    height: 100svh;
    min-height: 100svh;

    overflow: hidden;

    background-color: #d8b27c;
    background-image: url("sand-background.jpg");
    background-repeat: no-repeat;
    background-position: center top;
    background-size: cover;
}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.gallery-content {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    padding: 7px 14px 0;

    overflow: hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

.gallery-header {
    position: relative;

    width: 100%;

    /*
       Compact header.
       Most of the screen belongs to the gallery.
    */

    height: 126px;
}


/* =========================================================
   HOME
   ========================================================= */

.home-button {
    position: absolute;

    top: 2px;
    left: 2px;

    z-index: 20;

    display: flex;
    align-items: center;
    gap: 6px;

    padding: 8px 13px;

    border-radius: 24px;

    background: rgba(250, 239, 217, 0.96);

    color: #5b3b23;

    text-decoration: none;

    font-size: 14px;
    line-height: 1;

    box-shadow: 0 2px 6px rgba(80, 50, 25, 0.14);
}

.home-arrow {
    font-size: 19px;
    line-height: 1;
}


/* =========================================================
   SALT SAND STORIES
   ========================================================= */

.salt-stories {
    position: absolute;

    top: 0;
    right: 0;

    z-index: 15;

    /*
       Proper visual presence.
       Larger without changing its position.
    */

    width: 215px;

    height: auto;

    display: block;
}


/* =========================================================
   GALLERY TITLE
   ========================================================= */

.gallery-title {
    position: absolute;

    left: 0;
    right: 0;

    top: 67px;

    margin: 0;
    padding: 0;

    text-align: center;

    color: #5b3b23;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 45px;
    font-weight: 400;

    line-height: 1;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.gallery-category {
    width: 100%;

    margin: 0 0 9px 0;
    padding: 0;
}


/* =========================================================
   CATEGORY HEADER
   ========================================================= */

.category-heading {
    width: 100%;
    height: 27px;

    display: flex;
    align-items: center;

    margin-bottom: 4px;
}


/* =========================================================
   CATEGORY ICON
   ========================================================= */

.category-icon {
    flex: 0 0 26px;

    width: 26px;
    height: 26px;

    margin-right: 7px;

    fill: none;

    stroke: #5b3b23;

    stroke-width: 1.7;

    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================================================
   CATEGORY NAME
   ========================================================= */

.category-name {
    flex: 0 0 auto;

    margin: 0;
    padding: 0;

    color: #5b3b23;

    font-size: 21px;
    font-weight: 400;

    line-height: 1;
}


/* =========================================================
   LINE
   ========================================================= */

.category-line {
    flex: 1 1 auto;

    height: 1px;

    margin-left: 9px;

    background: rgba(91, 59, 35, 0.50);
}


/* =========================================================
   PHOTO STRIP
   ========================================================= */

.photo-strip {
    width: 100%;

    display: flex;
    flex-wrap: nowrap;

    gap: 8px;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 0 0 2px 0;
    margin: 0;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior-x: contain;
}

.photo-strip::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   POLAROID CARD
   ========================================================= */

.photo-card {

    /*
       IMPORTANT:
       Width remains narrow so the fifth image
       visibly peeps into the screen.

       Height increases to consume vertical
       real estate and create the Polaroid effect.
    */

    flex: 0 0 96px;

    width: 96px;

    height: 88px;

    padding: 5px 5px 13px 5px;

    margin: 0;

    border: 0;

    border-radius: 9px;

    overflow: hidden;

    background: #f4ead7;

    display: block;

    cursor: pointer;

    box-shadow:
        0 2px 5px rgba(70, 42, 20, 0.18);

    appearance: none;
    -webkit-appearance: none;
}


/* =========================================================
   POLAROID IMAGE
   ========================================================= */

.photo-card img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 6px;
}


/* =========================================================
   BOTTOM LOGO
   ========================================================= */

.gallery-footer {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    padding: 0 0 9px 0;

    z-index: 10;

    pointer-events: none;
}


.footer-logo {

    display: block;

    width: 190px;

    max-width: 58%;

    height: auto;

    margin: 0 auto;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(35, 24, 15, 0.92);

    padding: 40px;
}

.lightbox.active {
    display: flex;
}


/* =========================================================
   LARGE IMAGE
   ========================================================= */

.lightbox-image {

    display: block;

    max-width: 90vw;
    max-height: 82vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 13px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.40);

    user-select: none;
}


/* =========================================================
   CLOSE
   ========================================================= */

.lightbox-close {

    position: absolute;

    top: 13px;
    right: 13px;

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;
    border-radius: 50%;

    background: #f5ead6;

    color: #5b3b23;

    font-size: 29px;
    line-height: 42px;

    text-align: center;

    cursor: pointer;
}


/* =========================================================
   LIGHTBOX NAVIGATION
   ========================================================= */

.lightbox-nav {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;
    border-radius: 50%;

    background: #f5ead6;

    color: #5b3b23;

    font-size: 32px;
    line-height: 40px;

    text-align: center;

    cursor: pointer;
}

.lightbox-prev {
    left: 8px;
}

.lightbox-next {
    right: 8px;
}


/* =========================================================
   COUNTER
   ========================================================= */

.lightbox-counter {

    position: absolute;

    bottom: 14px;
    left: 50%;

    transform: translateX(-50%);

    color: #f5ead6;

    font-size: 12px;

    white-space: nowrap;
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 601px) {

    .gallery-content {

        max-width: 1200px;

        left: 50%;

        transform: translateX(-50%);

        padding: 12px 30px 0;
    }


    .gallery-header {

<script>

/* =========================================================
   GALLERY DATA
   ========================================================= */

const galleryData = {

    "Sea Views": [
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG",
        "your-stay.PNG"
    ],

    "Living": [
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg"
    ],

    "Bedroom": [
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg"
    ],

    "Kitchen": [
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png"
    ]

};


/* =========================================================
   LIGHTBOX ELEMENTS
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

const lightboxCounter =
    document.getElementById("lightboxCounter");


/* =========================================================
   CURRENT IMAGE
   ========================================================= */

let currentCategory = "";

let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(
    category,
    index
) {

    currentCategory =
        category;

    currentIndex =
        index;

    updateLightbox();

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";
}


/* =========================================================
   UPDATE
   ========================================================= */

function updateLightbox() {

    const images =
        galleryData[currentCategory];

    lightboxImage.src =
        images[currentIndex];

    lightboxImage.alt =
        currentCategory +
        " image " +
        (currentIndex + 1);

    lightboxCounter.textContent =
        currentCategory +
        "  •  " +
        (currentIndex + 1) +
        " / " +
        images.length;
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (
            currentIndex + 1
        ) %
        images.length;

    updateLightbox();
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (
            currentIndex -
            1 +
            images.length
        ) %
        images.length;

    updateLightbox();
}


/* =========================================================
   THUMBNAILS
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                openLightbox(
                    card.dataset.category,
                    Number(
                        card.dataset.index
                    )
                );

            }
        );

    });


/* =========================================================
   BUTTONS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);

lightboxNext.addEventListener(
    "click",
    nextImage
);


/* =========================================================
   OUTSIDE CLICK
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }


        if (
            event.key === "ArrowRight"
        ) {

            nextImage();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousImage();

        }

    }
);


/* =========================================================
   MOBILE SWIPE
   ========================================================= */

let touchStartX = 0;


lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    },
    {
        passive: true
    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        const touchEndX =
            event.changedTouches[0]
                .screenX;

        const distance =
            touchEndX -
            touchStartX;


        if (
            Math.abs(distance) < 45
        ) {

            return;

        }


        if (
            distance < 0
        ) {

            nextImage();

        } else {

            previousImage();

        }

    },
    {
        passive: true
    }
);

</script>
