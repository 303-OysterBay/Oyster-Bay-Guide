<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>303 OYSTER BAY • Gallery</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #e8d8bd;
    color: #463322;
}

/* PAGE */
.gallery-page {
    position: relative;
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
    background-image: url("sand-background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* HOME BUTTON */
.home-button {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 20;

    width: 38px;
    height: 38px;

    border: none;
    border-radius: 50%;

    background: rgba(244, 234, 215, 0.92);
    color: #463322;

    font-size: 20px;
    line-height: 38px;
    text-align: center;

    text-decoration: none;

    box-shadow: 0 2px 5px rgba(70, 42, 20, 0.16);
}

/* TOP RIGHT ASSET */
.salt-stories {
    position: absolute;
    top: 7px;
    right: 9px;
    width: 215px;
    max-width: 52%;
    height: auto;
    z-index: 5;
}

/* HEADER */
.gallery-header {
    position: relative;
    height: 126px;
    width: 100%;
}

.gallery-title {
    position: absolute;
    top: 67px;
    left: 0;
    width: 100%;

    text-align: center;

    font-size: 25px;
    font-weight: normal;
    letter-spacing: 1.5px;
    color: #463322;

    z-index: 6;
}

/* CATEGORY AREA */
.gallery-content {
    position: relative;
    width: 100%;
    padding-left: 13px;
    padding-right: 0;
}

.category {
    width: 100%;
    margin-bottom: 9px;
}

.category-title {
    margin-bottom: 4px;

    font-size: 13px;
    font-weight: normal;
    letter-spacing: 1.3px;
    color: #463322;
}

/* HORIZONTAL PHOTO ROW */
.photo-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 7px;

    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;

    padding-right: 0;

    scrollbar-width: none;
    -ms-overflow-style: none;
}

.photo-row::-webkit-scrollbar {
    display: none;
}

/* POLAROID */
.photo-card {
    flex: 0 0 96px;
    width: 96px;
    height: 88px;

    padding: 5px 5px 13px 5px;

    border-radius: 9px;

    background: #f4ead7;

    box-shadow: 0 2px 5px rgba(70, 42, 20, 0.18);

    border: none;

    cursor: pointer;
}

.photo-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 6px;
}

/* FOOTER LOGO */
.gallery-footer {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding: 0 0 9px 0;

    z-index: 10;

    pointer-events: none;
}

.footer-logo {
    width: 190px;
    max-width: 58%;
    height: auto;
}

/* LIGHTBOX */
.lightbox {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(35, 25, 16, 0.90);

    z-index: 100;
}

.lightbox.active {
    display: flex;
}

.lightbox-image {
    max-width: 88vw;
    max-height: 82vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}

.lightbox-close {
    position: absolute;

    top: 18px;
    right: 20px;

    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: rgba(244, 234, 215, 0.95);
    color: #463322;

    font-size: 25px;
    line-height: 42px;
    text-align: center;

    cursor: pointer;
}

.lightbox-arrow {
    position: absolute;

    top: 50%;
    transform: translateY(-50%);

    width: 44px;
    height: 44px;

    border: none;
    border-radius: 50%;

    background: rgba(244, 234, 215, 0.90);
    color: #463322;

    font-size: 27px;
    line-height: 44px;
    text-align: center;

    cursor: pointer;
}

.lightbox-prev {
    left: 14px;
}

.lightbox-next {
    right: 14px;
}


/* DESKTOP */
@media (min-width: 700px) {

    .home-button {
        top: 20px;
        left: 20px;
    }

    .salt-stories {
        top: 12px;
        right: 20px;
        width: 260px;
    }

    .gallery-header {
        height: 165px;
    }

    .gallery-title {
        top: 88px;
        font-size: 34px;
        letter-spacing: 2px;
    }

    .gallery-content {
        padding-left: 30px;
    }

    .category {
        margin-bottom: 18px;
    }

    .category-title {
        font-size: 16px;
        margin-bottom: 7px;
    }

    .photo-row {
        gap: 12px;
    }

    .photo-card {
        flex-basis: 150px;
        width: 150px;
        height: 138px;
        padding: 7px 7px 19px 7px;
    }

    .photo-card img {
        border-radius: 7px;
    }

    .footer-logo {
        width: 230px;
    }
}


/* SMALL PHONES */
@media (max-width: 390px) {

    .salt-stories {
        width: 205px;
        max-width: 54%;
        top: 6px;
        right: 7px;
    }

    .gallery-header {
        height: 120px;
    }

    .gallery-title {
        top: 65px;
        font-size: 23px;
    }

    .gallery-content {
        padding-left: 11px;
    }

    .category {
        margin-bottom: 8px;
    }

    .category-title {
        font-size: 12px;
        margin-bottom: 3px;
    }

    .photo-row {
        gap: 6px;
    }

    .photo-card {
        flex-basis: 91px;
        width: 91px;
        height: 88px;
        padding: 5px 5px 13px 5px;
    }

    .footer-logo {
        width: 180px;
    }
}


/* VERY SHORT PHONES */
@media (max-height: 700px) {

    .salt-stories {
        width: 190px;
    }

    .gallery-header {
        height: 108px;
    }

    .gallery-title {
        top: 58px;
        font-size: 22px;
    }

    .category {
        margin-bottom: 6px;
    }

    .category-title {
        margin-bottom: 2px;
        font-size: 11px;
    }

    .photo-card {
        height: 77px;
    }

    .footer-logo {
        width: 165px;
        padding-bottom: 5px;
    }
}
</style>
</head>

<body>

<div class="gallery-page">

    <!-- HOME -->
    <a href="index.html" class="home-button" aria-label="Home">⌂</a>

    <!-- SALT SAND STORIES -->
    <img
        src="Salt Sand Stories.png"
        class="salt-stories"
        alt="Salt Sand Stories"
    >

    <!-- HEADER -->
    <div class="gallery-header">
        <h1 class="gallery-title">Gallery</h1>
    </div>


    <!-- GALLERY -->
    <main class="gallery-content">

        <!-- SEA VIEWS -->
        <section class="category">
            <h2 class="category-title">Sea Views</h2>

            <div class="photo-row">

                <button class="photo-card"
                        data-category="Sea Views"
                        data-index="0">
                    <img src="Sea View1.jpg" alt="Sea View 1">
                </button>

                <button class="photo-card"
                        data-category="Sea Views"
                        data-index="1">
                    <img src="Sea View2.jpg" alt="Sea View 2">
                </button>

                <button class="photo-card"
                        data-category="Sea Views"
                        data-index="2">
                    <img src="Sea View3.jpg" alt="Sea View 3">
                </button>

                <button class="photo-card"
                        data-category="Sea Views"
                        data-index="3">
                    <img src="Sea View4.jpg" alt="Sea View 4">
                </button>

                <button class="photo-card"
                        data-category="Sea Views"
                        data-index="4">
                    <img src="Sea View5.jpg" alt="Sea View 5">
                </button>

            </div>
        </section>


        <!-- LIVING -->
        <section class="category">
            <h2 class="category-title">Living</h2>

            <div class="photo-row">

                <button class="photo-card"
                        data-category="Living"
                        data-index="0">
                    <img src="apartment.jpg" alt="Living">
                </button>

                <button class="photo-card"
                        data-category="Living"
                        data-index="1">
                    <img src="apartment.jpg" alt="Living">
                </button>

                <button class="photo-card"
                        data-category="Living"
                        data-index="2">
                    <img src="apartment.jpg" alt="Living">
                </button>

                <button class="photo-card"
                        data-category="Living"
                        data-index="3">
                    <img src="apartment.jpg" alt="Living">
                </button>

                <button class="photo-card"
                        data-category="Living"
                        data-index="4">
                    <img src="apartment.jpg" alt="Living">
                </button>

            </div>
        </section>


        <!-- BEDROOM -->
        <section class="category">
            <h2 class="category-title">Bedroom</h2>

            <div class="photo-row">

                <button class="photo-card"
                        data-category="Bedroom"
                        data-index="0">
                    <img src="gallery.jpg" alt="Bedroom">
                </button>

                <button class="photo-card"
                        data-category="Bedroom"
                        data-index="1">
                    <img src="gallery.jpg" alt="Bedroom">
                </button>

                <button class="photo-card"
                        data-category="Bedroom"
                        data-index="2">
                    <img src="gallery.jpg" alt="Bedroom">
                </button>

                <button class="photo-card"
                        data-category="Bedroom"
                        data-index="3">
                    <img src="gallery.jpg" alt="Bedroom">
                </button>

                <button class="photo-card"
                        data-category="Bedroom"
                        data-index="4">
                    <img src="gallery.jpg" alt="Bedroom">
                </button>

            </div>
        </section>


        <!-- KITCHEN -->
        <section class="category">
            <h2 class="category-title">Kitchen</h2>

            <div class="photo-row">

                <button class="photo-card"
                        data-category="Kitchen"
                        data-index="0">
                    <img src="Blank Kitchen.png" alt="Kitchen">
                </button>

                <button class="photo-card"
                        data-category="Kitchen"
                        data-index="1">
                    <img src="Blank Kitchen.png" alt="Kitchen">
                </button>

                <button class="photo-card"
                        data-category="Kitchen"
                        data-index="2">
                    <img src="Blank Kitchen.png" alt="Kitchen">
                </button>

                <button class="photo-card"
                        data-category="Kitchen"
                        data-index="3">
                    <img src="Blank Kitchen.png" alt="Kitchen">
                </button>

                <button class="photo-card"
                        data-category="Kitchen"
                        data-index="4">
                    <img src="Blank Kitchen.png" alt="Kitchen">
                </button>

            </div>
        </section>

    </main>


    <!-- BOTTOM LOGO -->
    <footer class="gallery-footer">
        <img
            src="logo.png"
            class="footer-logo"
            alt="303 Oyster Bay"
        >
    </footer>


    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">

        <button class="lightbox-close" id="lightboxClose"
                aria-label="Close">×</button>

        <button class="lightbox-arrow lightbox-prev"
                id="lightboxPrev"
                aria-label="Previous">‹</button>

        <img
            class="lightbox-image"
            id="lightboxImage"
            src=""
            alt=""
        >

        <button class="lightbox-arrow lightbox-next"
                id="lightboxNext"
                aria-label="Next">›</button>

    </div>


<script>

/* GALLERY DATA */

const galleryData = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg",
        "apartment.jpg"
    ],

    "Bedroom": [
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg",
        "gallery.jpg"
    ],

    "Kitchen": [
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png",
        "Blank Kitchen.png"
    ]

};


/* LIGHTBOX */

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxClose = document.getElementById("lightboxClose");
const lightboxPrev = document.getElementById("lightboxPrev");
const lightboxNext = document.getElementById("lightboxNext");

let currentCategory = "";
let currentIndex = 0;


/* OPEN IMAGE */

function openLightbox(category, index) {

    currentCategory = category;
    currentIndex = index;

    lightboxImage.src = galleryData[category][index];

    lightbox.classList.add("active");

}


/* CLOSE */

function closeLightbox() {

    lightbox.classList.remove("active");

    lightboxImage.src = "";

}


/* NEXT */

function showNext() {

    const images = galleryData[currentCategory];

    currentIndex = (currentIndex + 1) % images.length;

    lightboxImage.src = images[currentIndex];

}


/* PREVIOUS */

function showPrevious() {

    const images = galleryData[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length) % images.length;

    lightboxImage.src = images[currentIndex];

}


/* CLICK THUMBNAILS */

document.querySelectorAll(".photo-card").forEach(card => {

    card.addEventListener("click", () => {

        const category = card.dataset.category;
        const index = Number(card.dataset.index);

        openLightbox(category, index);

    });

});


/* BUTTONS */

lightboxClose.addEventListener("click", closeLightbox);

lightboxNext.addEventListener("click", showNext);

lightboxPrev.addEventListener("click", showPrevious);


/* CLOSE BY CLICKING OUTSIDE */

lightbox.addEventListener("click", event => {

    if (event.target === lightbox) {
        closeLightbox();
    }

});


/* KEYBOARD */

document.addEventListener("keydown", event => {

    if (!lightbox.classList.contains("active")) return;

    if (event.key === "Escape") {
        closeLightbox();
    }

    if (event.key === "ArrowRight") {
        showNext();
    }

    if (event.key === "ArrowLeft") {
        showPrevious();
    }

});


/* SWIPE */

let touchStartX = 0;

lightbox.addEventListener("touchstart", event => {

    touchStartX = event.changedTouches[0].screenX;

}, { passive: true });


lightbox.addEventListener("touchend", event => {

    const touchEndX = event.changedTouches[0].screenX;
    const difference = touchEndX - touchStartX;

    if (Math.abs(difference) < 40) return;

    if (difference < 0) {
        showNext();
    } else {
        showPrevious();
    }

}, { passive: true });

</script>

</div>

</body>
</html>
