<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;
    background: #d8b27c;
    color: #5b3b23;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   PAGE
   ========================================================= */

.gallery-page {

    width: 100%;
    min-height: 100vh;

    position: relative;

    overflow-x: hidden;

    background-color: #d8b27c;

    /*
       IMPORTANT:
       One background image only.
       No repeat.
       No second wave appearing at the bottom.
    */

    background-image:
        url("sand-background.jpg");

    background-repeat:
        no-repeat;

    background-position:
        center top;

    background-size:
        cover;
}


/* =========================================================
   CONTENT
   ========================================================= */

.gallery-content {

    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    padding:
        12px
        clamp(18px, 3vw, 36px)
        0;
}


/* =========================================================
   HEADER
   ========================================================= */

.gallery-header {

    position: relative;

    width: 100%;

    height: 170px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 3px;
}


/* =========================================================
   HOME BUTTON
   ========================================================= */

.home-button {

    position: absolute;

    top: 0;
    left: 0;

    z-index: 10;

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        8px
        14px;

    border-radius:
        24px;

    background:
        rgba(250, 239, 217, 0.96);

    color:
        #5b3b23;

    text-decoration:
        none;

    font-size:
        15px;

    line-height:
        1;

    box-shadow:
        0 2px 6px rgba(80, 50, 25, 0.14);
}

.home-arrow {

    font-size:
        20px;

    line-height:
        1;
}


/* =========================================================
   SALT SAND STORIES
   ========================================================= */

.salt-stories {

    position: absolute;

    top: 0;
    right: 0;

    z-index: 5;

    /*
       Approximately 20% larger than the previous version.
    */

    width:
        clamp(150px, 18vw, 225px);

    height:
        auto;

    display:
        block;
}


/* =========================================================
   GALLERY TITLE
   ========================================================= */

.gallery-title {

    margin:
        55px 0 0 0;

    padding:
        0;

    color:
        #5b3b23;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(48px, 6vw, 72px);

    font-weight:
        400;

    line-height:
        1;

    text-align:
        center;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.gallery-category {

    width:
        100%;

    margin:
        0 0 18px 0;
}


/* =========================================================
   CATEGORY HEADING
   ========================================================= */

.category-heading {

    width:
        100%;

    height:
        32px;

    display:
        flex;

    align-items:
        center;

    margin-bottom:
        6px;
}


/* =========================================================
   CATEGORY ICON
   ========================================================= */

.category-icon {

    flex:
        0 0 30px;

    width:
        30px;

    height:
        30px;

    margin-right:
        8px;

    fill:
        none;

    stroke:
        #5b3b23;

    stroke-width:
        1.8;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}


/* =========================================================
   CATEGORY NAME
   ========================================================= */

.category-name {

    flex:
        0 0 auto;

    margin:
        0;

    padding:
        0;

    color:
        #5b3b23;

    font-size:
        clamp(22px, 2.7vw, 32px);

    font-weight:
        400;

    line-height:
        1;
}


/* =========================================================
   CATEGORY LINE
   ========================================================= */

.category-line {

    flex:
        1 1 auto;

    height:
        1px;

    margin-left:
        10px;

    background:
        rgba(91, 59, 35, 0.48);
}


/* =========================================================
   PHOTO STRIP
   ========================================================= */

.photo-strip {

    width:
        100%;

    display:
        flex;

    flex-wrap:
        nowrap;

    gap:
        10px;

    overflow-x:
        auto;

    overflow-y:
        hidden;

    padding:
        0 0 3px 0;

    scrollbar-width:
        none;

    -webkit-overflow-scrolling:
        touch;

    overscroll-behavior-x:
        contain;
}

.photo-strip::-webkit-scrollbar {
    display:
        none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {

    /*
       Four images remain completely visible,
       with part of the fifth one showing.
    */

    flex:
        0 0 clamp(135px, 16vw, 190px);

    width:
        clamp(135px, 16vw, 190px);

    aspect-ratio:
        1.42 / 1;

    padding:
        0;

    margin:
        0;

    border:
        none;

    border-radius:
        12px;

    overflow:
        hidden;

    background:
        #ead6b2;

    box-shadow:
        0 2px 6px rgba(70, 42, 20, 0.13);

    cursor:
        pointer;

    display:
        block;

    flex-shrink:
        0;
}

.photo-card img {

    display:
        block;

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;
}


/* =========================================================
   FOOTER
   ========================================================= */

.gallery-footer {

    width:
        100%;

    max-width:
        1200px;

    margin:
        0 auto;

    /*
       No artificial 220/250px blank area.
       Logo follows the gallery naturally.
    */

    display:
        flex;

    align-items:
        flex-end;

    justify-content:
        center;

    padding:
        20px
        20px
        30px;
}


/* =========================================================
   303 LOGO
   ========================================================= */

.footer-logo {

    display:
        block;

    width:
        clamp(190px, 24vw, 290px);

    max-width:
        65%;

    height:
        auto;

    margin:
        0 auto;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position:
        fixed;

    inset:
        0;

    z-index:
        1000;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    background:
        rgba(35, 24, 15, 0.91);

    padding:
        45px 55px;
}

.lightbox.active {
    display:
        flex;
}


/* =========================================================
   ENLARGED IMAGE
   ========================================================= */

.lightbox-image {

    display:
        block;

    max-width:
        90vw;

    max-height:
        84vh;

    width:
        auto;

    height:
        auto;

    object-fit:
        contain;

    border-radius:
        14px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.40);

    user-select:
        none;
}


/* =========================================================
   CLOSE
   ========================================================= */

.lightbox-close {

    position:
        absolute;

    top:
        14px;

    right:
        15px;

    width:
        44px;

    height:
        44px;

    border:
        none;

    border-radius:
        50%;

    background:
        #f5ead6;

    color:
        #5b3b23;

    font-size:
        30px;

    line-height:
        44px;

    text-align:
        center;

    cursor:
        pointer;
}


/* =========================================================
   LIGHTBOX NAVIGATION
   ========================================================= */

.lightbox-nav {

    position:
        absolute;

    top:
        50%;

    transform:
        translateY(-50%);

    width:
        44px;

    height:
        44px;

    border:
        none;

    border-radius:
        50%;

    background:
        #f5ead6;

    color:
        #5b3b23;

    font-size:
        34px;

    line-height:
        42px;

    text-align:
        center;

    cursor:
        pointer;
}

.lightbox-prev {
    left:
        12px;
}

.lightbox-next {
    right:
        12px;
}


/* =========================================================
   COUNTER
   ========================================================= */

.lightbox-counter {

    position:
        absolute;

    bottom:
        16px;

    left:
        50%;

    transform:
        translateX(-50%);

    color:
        #f5ead6;

    font-size:
        13px;

    white-space:
        nowrap;
}

/* =========================================================

   ========================================================= */

let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(
    category,
    index
) {

    currentCategory =
        category;

    currentIndex =
        index;

    updateLightbox();

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";
}


/* =========================================================
   UPDATE
   ========================================================= */

function updateLightbox() {

    const images =
        galleryData[currentCategory];

    lightboxImage.src =
        images[currentIndex];

    lightboxImage.alt =
        currentCategory +
        " image " +
        (currentIndex + 1);

    lightboxCounter.textContent =
        currentCategory +
        "  •  " +
        (currentIndex + 1) +
        " / " +
        images.length;
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex + 1) %
        images.length;

    updateLightbox();
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (
            currentIndex -
            1 +
            images.length
        ) %
        images.length;

    updateLightbox();
}


/* =========================================================
   THUMBNAIL CLICKS
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                openLightbox(
                    card.dataset.category,
                    Number(
                        card.dataset.index
                    )
                );

            }
        );

    });


/* =========================================================
   BUTTONS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);

lightboxNext.addEventListener(
    "click",
    nextImage
);


/* =========================================================
   OUTSIDE CLICK
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {
            return;
        }

        if (
            event.key === "Escape"
        ) {
            closeLightbox();
        }

        if (
            event.key === "ArrowRight"
        ) {
            nextImage();
        }

        if (
            event.key === "ArrowLeft"
        ) {
            previousImage();
        }

    }
);


/* =========================================================
   MOBILE SWIPE
   ========================================================= */

let touchStartX = 0;


lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    },
    {
        passive: true
    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        const touchEndX =
            event.changedTouches[0]
                .screenX;

        const distance =
            touchEndX -
            touchStartX;

        if (
            Math.abs(distance) < 45
        ) {
            return;
        }

        if (
            distance < 0
        ) {

            nextImage();

        } else {

            previousImage();

        }

    },
    {
        passive: true
    }
);

</script>


</body>
</html>
