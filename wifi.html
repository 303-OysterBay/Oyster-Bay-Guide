<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay — Wi-Fi</title>

<style>

    /* =========================================================
       303 OYSTER BAY — WI-FI
       Responsive recreation of the original 1200 × 1600 design
       ========================================================= */

    :root {
        --navy: #073b58;
        --airtel-red: #e51b2a;
        --glass: rgba(255, 242, 215, 0.78);
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #d8ad73;
        overflow-x: hidden;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .wifi-page {
        position: relative;

        width: 100%;
        max-width: 1200px;

        min-height: 100vh;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
        align-items: center;

        padding:
            clamp(55px, 7vw, 90px)
            clamp(24px, 8vw, 95px)
            clamp(45px, 6vw, 75px);

        /*
         * YOUR EXISTING ASSET
         */
        background-image: url("sand-background.png");

        background-repeat: no-repeat;
        background-position: center top;

        /*
         * Keeps the texture natural while allowing
         * the page to grow vertically on small screens.
         */
        background-size: cover;

        background-color: #d8ad73;
    }


    /* =========================================================
       AIRFIBER BRANDING
       ========================================================= */

    .airtel-block {
        width: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;

        margin-bottom:
            clamp(28px, 4vw, 48px);
    }


    /*
     * Airtel logo sourced from Wikimedia Commons.
     * This is kept separate from your Oyster Bay logo asset.
     */

    .airtel-logo {
        display: block;

        width:
            clamp(155px, 18vw, 215px);

        height: auto;

        margin-bottom:
            clamp(4px, 0.7vw, 9px);
    }


    .airfiber {
        margin: 0;

        color: var(--airtel-red);

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(30px, 4.4vw, 55px);

        font-weight: 700;

        line-height: 1;

        letter-spacing: 0;
    }


    /* =========================================================
       WI-FI TITLE
       ========================================================= */

    .wifi-title {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        gap:
            clamp(18px, 4vw, 48px);

        margin-bottom:
            clamp(35px, 5vw, 60px);
    }


    .wifi-title::before,
    .wifi-title::after {
        content: "";

        height: 4px;

        flex: 1;

        max-width: 150px;

        background: var(--navy);

        border-radius: 10px;
    }


    .wifi-title span {
        flex: 0 0 auto;

        color: var(--navy);

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(34px, 5.4vw, 68px);

        font-weight: 700;

        letter-spacing:
            clamp(5px, 0.75vw, 10px);

        line-height: 1;
    }


    /* =========================================================
       INFORMATION CARDS
       ========================================================= */

    .wifi-information {
        width: 100%;

        display: flex;
        flex-direction: column;

        gap:
            clamp(22px, 2.5vw, 32px);
    }


    .wifi-card {
        width: 100%;

        min-height:
            clamp(135px, 14vw, 190px);

        display: flex;
        align-items: center;

        padding:
            clamp(20px, 2.5vw, 32px)
            clamp(24px, 4vw, 48px);

        background: var(--glass);

        border: 1px solid rgba(255,255,255,0.5);

        border-radius:
            clamp(22px, 3vw, 38px);

        box-shadow:
            0 8px 24px rgba(86, 51, 17, 0.08);

        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
    }


    /* =========================================================
       ICON COLUMN
       ========================================================= */

    .wifi-card-icon {
        width:
            clamp(92px, 12vw, 145px);

        min-width:
            clamp(92px, 12vw, 145px);

        height: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        padding-right:
            clamp(18px, 2.5vw, 30px);

        border-right:
            2px solid rgba(7, 59, 88, 0.9);
    }


    .wifi-card-icon svg {
        width:
            clamp(58px, 7.5vw, 96px);

        height:
            clamp(58px, 7.5vw, 96px);

        display: block;

        fill: var(--navy);
    }


    /* =========================================================
       CARD TEXT
       ========================================================= */

    .wifi-card-content {
        min-width: 0;

        padding-left:
            clamp(0px, 0.5vw, 7px);
    }


    .wifi-label {
        margin: 0 0
            clamp(8px, 1vw, 14px);

        color: var(--navy);

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(15px, 1.7vw, 24px);

        font-weight: 700;

        letter-spacing:
            clamp(3px, 0.45vw, 6px);

        line-height: 1.1;
    }


    .wifi-value {
        margin: 0;

        color: var(--navy);

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(25px, 3.35vw, 45px);

        font-weight: 600;

        line-height: 1.12;

        overflow-wrap: anywhere;
    }


    /* =========================================================
       303 OYSTER BAY LOGO
       ========================================================= */

    .property-logo {
        display: block;

        /*
         * YOUR EXISTING ASSET
         */
        width:
            clamp(250px, 37vw, 430px);

        max-width: 70%;

        height: auto;

        margin-top:
            clamp(55px, 7vw, 95px);
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 700px) {

        .wifi-page {
            padding:
                45px
                22px
                50px;
        }

        .wifi-title {
            margin-bottom: 34px;
        }

        .wifi-title::before,
        .wifi-title::after {
            height: 3px;
        }

        .wifi-card {
            min-height: 125px;

            padding:
                18px 20px;
        }

        .wifi-card-icon {
            width: 80px;
            min-width: 80px;

            padding-right: 16px;
        }

        .wifi-card-icon svg {
            width: 54px;
            height: 54px;
        }

        .wifi-value {
            font-size: 23px;
        }

        .property-logo {
            width: 58%;
        }
    }


    /* =========================================================
       PHONE
       ========================================================= */

    @media (max-width: 500px) {

        .wifi-page {
            min-height: 100vh;

            padding:
                34px
                15px
                38px;

            /*
             * On narrow screens we want the sand texture
             * to cover the complete page rather than producing
             * the "mini-skirt" crop.
             */
            background-size: auto 100%;
            background-position: center top;
        }


        .airtel-block {
            margin-bottom: 27px;
        }


        .airtel-logo {
            width: 170px;
        }


        .airfiber {
            font-size: 31px;
        }


        .wifi-title {
            gap: 12px;

            margin-bottom: 29px;
        }


        .wifi-title::before,
        .wifi-title::after {
            max-width: 70px;
            height: 3px;
        }


        .wifi-title span {
            font-size: 33px;
            letter-spacing: 5px;
        }


        .wifi-information {
            gap: 18px;
        }


        .wifi-card {
            min-height: 122px;

            padding:
                17px 16px;

            gap: 0;

            border-radius: 24px;
        }


        .wifi-card-icon {
            width: 70px;
            min-width: 70px;

            padding-right: 13px;
        }


        .wifi-card-icon svg {
            width: 50px;
            height: 50px;
        }


        .wifi-card-content {
            padding-left: 15px;
        }


        .wifi-label {
            font-size: 12px;

            letter-spacing: 2.4px;

            margin-bottom: 7px;
        }


        .wifi-value {
            font-size: 21px;

            line-height: 1.15;
        }


        .property-logo {
            width: 65%;

            max-width: 290px;

            margin-top: 48px;
        }
    }


    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 360px) {

        .wifi-page {
            padding-left: 12px;
            padding-right: 12px;
        }


        .airtel-logo {
            width: 150px;
        }


        .airfiber {
            font-size: 28px;
        }


        .wifi-title span {
            font-size: 29px;
        }


        .wifi-card {
            padding-left: 12px;
            padding-right: 12px;
        }


        .wifi-card-icon {
            width: 61px;
            min-width: 61px;

            padding-right: 10px;
        }


        .wifi-card-icon svg {
            width: 45px;
            height: 45px;
        }


        .wifi-card-content {
            padding-left: 12px;
        }


        .wifi-label {
            font-size: 11px;
            letter-spacing: 2px;
        }


        .wifi-value {
            font-size: 18px;
        }


        .property-logo {
            width: 70%;
        }
    }

</style>
</head>


<body>

<div class="wifi-page">


    <!-- =====================================================
         AIRTEL AIRFIBER
         ===================================================== -->

    <header class="airtel-block">

        <img
            class="airtel-logo"
            src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Airtel_logo.svg"
            alt="Airtel"

        <div class="airfiber">

    <!-- =====================================================

         ===================================================== -->

    <div class="wifi-title">

    <!-- =====================================================

    <main class="wifi-information">

    </main>


    <!-- =====================================================
         303 OYSTER BAY LOGO
         ===================================================== -->

    <img
        class="property-logo"
        src="logo.png"
        alt="303 Oyster Bay — Surathkal · Mangaluru"
    >


</div>

</body>
</html>
