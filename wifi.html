<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>303 Oyster Bay — Wi-Fi</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        overflow-x: hidden;
        background: #d8ad73;
    }


    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .wifi-page {
        width: 100%;
        max-width: 1200px;
        min-height: 100vh;
        min-height: 100svh;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
        align-items: center;

        padding:
            clamp(40px, 5vw, 70px)
            clamp(24px, 8vw, 95px)
            clamp(35px, 5vw, 60px);

        background-image: url("sand-background.png");
        background-repeat: no-repeat;
        background-position: center top;
        background-size: cover;

        background-color: #d8ad73;
    }


    /* =========================================================
       AIRTEL / AIRFIBER
       ========================================================= */

    .airtel-block {
        width: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;

        margin-bottom: clamp(20px, 3vw, 35px);
    }

    .airtel-logo {
        display: block;

        width: clamp(125px, 17vw, 205px);
        height: auto;

        margin-bottom: 3px;
    }

    .airfiber {
        margin: 0;

        color: #e51b2a;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(25px, 4vw, 50px);

        font-weight: 700;

        line-height: 1;
    }


    /* =========================================================
       WI-FI HEADING
       ========================================================= */

    .wifi-title {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: clamp(15px, 3.5vw, 45px);

        margin-bottom: clamp(25px, 4vw, 48px);
    }

    .wifi-title::before,
    .wifi-title::after {
        content: "";

        height: 4px;

        flex: 1;

        max-width: 150px;

        background: #073b58;

        border-radius: 10px;
    }

    .wifi-title span {
        flex: 0 0 auto;

        color: #073b58;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(30px, 5vw, 64px);

        font-weight: 700;

        letter-spacing:
            clamp(4px, 0.7vw, 9px);

        line-height: 1;
    }


    /* =========================================================
       INFORMATION CARDS
       ========================================================= */

    .wifi-information {
        width: 100%;

        display: flex;
        flex-direction: column;

        gap: clamp(16px, 2.2vw, 28px);
    }

    .wifi-card {
        width: 100%;

        min-height:
            clamp(115px, 13vw, 175px);

        display: flex;
        align-items: center;

        padding:
            clamp(16px, 2vw, 28px)
            clamp(20px, 3.5vw, 42px);

        background: rgba(255, 242, 215, 0.80);

        border:
            1px solid rgba(255,255,255,0.55);

        border-radius:
            clamp(22px, 3vw, 36px);

        box-shadow:
            0 7px 22px rgba(80, 45, 10, 0.08);

        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
    }


    /* =========================================================
       ICONS
       ========================================================= */

    .wifi-card-icon {
        width:
            clamp(78px, 11vw, 130px);

        min-width:
            clamp(78px, 11vw, 130px);

        height: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        padding-right:
            clamp(14px, 2vw, 26px);

        border-right:
            2px solid #073b58;
    }

    .wifi-card-icon svg {
        display: block;

        width:
            clamp(50px, 7vw, 88px);

        height:
            clamp(50px, 7vw, 88px);

        fill: #073b58;
    }


    /* =========================================================
       CARD TEXT
       ========================================================= */

    .wifi-card-content {
        min-width: 0;

        padding-left:
            clamp(14px, 2vw, 25px);
    }

    .wifi-label {
        margin:
            0 0 clamp(5px, 0.8vw, 10px);

        color: #073b58;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:
            clamp(12px, 1.5vw, 21px);

        font-weight: 700;

        letter-spacing:
            clamp(2px, 0.4vw, 5px);

        line-height: 1.1;
    }

    .wifi-value {
        margin: 0;

        color: #073b58;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        font-size:
            clamp(21px, 3.1vw, 42px);

        font-weight: 600;

        line-height: 1.12;

        overflow-wrap: anywhere;
    }


    /* =========================================================
       303 OYSTER BAY LOGO
       ========================================================= */

    .property-logo {
        display: block;

        width:
            clamp(220px, 34vw, 400px);

        max-width: 68%;

        height: auto;

        margin-top:
            clamp(35px, 5vw, 65px);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 500px) {

        .wifi-page {
            min-height: 100svh;

            padding:
                25px
                15px
                24px;

            /*
             * The texture fills the available page height,
             * instead of producing the cropped "mini-skirt"
             * effect of the original fixed image.
             */
            background-size: auto 100%;
            background-position: center top;
        }


        /* ---------- Airtel ---------- */

        .airtel-block {
            margin-bottom: 18px;
        }

        .airtel-logo {
            width: 125px;
            margin-bottom: 2px;
        }

        .airfiber {
            font-size: 25px;
        }


        /* ---------- WI-FI ---------- */

        .wifi-title {
            gap: 10px;
            margin-bottom: 22px;
        }

        .wifi-title::before,
        .wifi-title::after {
            height: 3px;
            max-width: 62px;
        }

        .wifi-title span {
            font-size: 29px;
            letter-spacing: 4px;
        }


        /* ---------- Cards ---------- */

        .wifi-information {
            gap: 14px;
        }

        .wifi-card {
            min-height: 105px;

            padding:
                14px
                15px;

            border-radius: 21px;
        }

        .wifi-card-icon {
            width: 62px;
            min-width: 62px;

            padding-right: 11px;
        }

        .wifi-card-icon svg {
            width: 44px;
            height: 44px;
        }

        .wifi-card-content {
            padding-left: 13px;
        }

        .wifi-label {
            font-size: 11px;
            letter-spacing: 2.2px;
            margin-bottom: 5px;
        }

        .wifi-value {
            font-size: 19px;
            line-height: 1.1;
        }


        /* ---------- Oyster Bay logo ---------- */

        .property-logo {
            width: 55%;
            max-width: 245px;

            margin-top: 30px;
        }
    }


    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 360px) {

        .wifi-page {
            padding:
                22px
                12px
                20px;
        }

        .airtel-logo {
            width: 115px;
        }

        .airfiber {
            font-size: 23px;
        }

        .wifi-title {
            margin-bottom: 19px;
        }

        .wifi-title span {
            font-size: 27px;
            letter-spacing: 3px;
        }

        .wifi-card {
            min-height: 98px;

            padding:
                12px
                12px;
        }

        .wifi-card-icon {
            width: 57px;
            min-width: 57px;

            padding-right: 9px;
        }

        .wifi-card-icon svg {
            width: 41px;
            height: 41px;
        }

        .wifi-card-content {
            padding-left: 11px;
        }

        .wifi-label {
            font-size: 10px;
            letter-spacing: 1.8px;
        }

        .wifi-value {
            font-size: 17px;
        }

        .property-logo {
            width: 60%;
            margin-top: 25px;
        }
    }

</style>
</head>


<body>

<div class="wifi-page">


    <!-- =====================================================
         AIRTEL AIRFIBER
         ===================================================== -->

    <header class="airtel-block">

        <img
            class="airtel-logo"
            src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Airtel_logo.svg"
            alt="Airtel"
        >

        <div class="airfiber">
            AIRFIBER
        </div>

    <!-- =====================================================
         WI-FI TITLE
         ===================================================== -->

    <div class="wifi-title">
        <span>WI-FI</span>
    </div>


    <!-- =====================================================
         WI-FI INFORMATION
         ===================================================== -->

    <main class="wifi-information">


        <!-- GATEWAY -->

        <section class="wifi-card">

            <div class="wifi-card-icon">

                <svg

                    <path d="

            </div>


            <div class="wifi-card-content">

                <p class="wifi-label">
                    GATEWAY

                <p class="wifi-value">
                    Airtel_303 Oyster Bay

            </div>

        </section>



        <!-- ACCESS CODE -->

        <section class="wifi-card">

            <div class="wifi-card-icon">

                <svg

                >

                    <path d="
                        M18 27
                        V20
                        C18 12 24 6 32 6
                        C40 6 46 12 46 20
                        V27
                        H40
                        V20
                        C40 15.6 36.4 12 32 12
                        C27.6 12 24 15.6 24 20
                        V27
                        Z
                    "/>

                    <path d="
                        M10 26
                        H54

                        V55
                        C60 58.3 57.3 61 54 61
                        H10

                    <circle

                    <rect
                        x="29"

            </div>


            <div class="wifi-card-content">

    </main>


    <!-- =====================================================
         303 OYSTER BAY LOGO
         ===================================================== -->

    <img
        class="property-logo"
        src="logo.png"
        alt="303 Oyster Bay — Surathkal · Mangaluru"
    >


</div>

</body>
</html>
