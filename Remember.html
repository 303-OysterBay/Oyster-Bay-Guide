<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>303 OYSTER BAY • Remember</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    color: #463322;
    font-family: Georgia, "Times New Roman", serif;
    background: #e8d8bd;
    overflow-x: hidden;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.remember-page {

    position: relative;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    padding-bottom: 92px;

    background-image: url("sand-background.jpg");
    background-size: cover;
    background-position: center top;
    background-repeat: repeat-y;

    overflow-x: hidden;
}


/* =========================================================
   SALT SAND STORIES
   ========================================================= */

.salt-stories {

    display: block;

    width: 275px;
    max-width: 72vw;

    height: auto;

    margin: 4px auto 2px auto;
}


/* =========================================================
   CONTENT
   ========================================================= */

.remember-content {

    width: 100%;

    padding-left: 15px;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category {

    width: 100%;

    margin-bottom: 12px;
}


/* =========================================================
   CATEGORY TITLE
   ========================================================= */

.category-title {

    margin: 0 0 3px 0;

    color: #463322;

    font-size: 16px;

    font-weight: normal;

    letter-spacing: 0.1px;

    line-height: 1.05;
}


/* =========================================================
   PHOTO ROW
   ========================================================= */

.photo-row {

    display: flex;

    flex-wrap: nowrap;

    gap: 8px;

    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 0 12px 2px 0;

    scrollbar-width: none;

    -ms-overflow-style: none;

    -webkit-overflow-scrolling: touch;
}

.photo-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {

    flex: 0 0 110px;

    width: 110px;
    height: 99px;

    padding: 5px 5px 9px;

    border: 1px solid rgba(255,255,255,0.78);

    border-radius: 13px;

    background: #f4ead7;

    box-shadow:
        0 2px 6px rgba(70,42,20,0.17);

    cursor: pointer;

    appearance: none;
    -webkit-appearance: none;
}


.photo-card img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 8px;
}


/* =========================================================
   =========================================================
   BOTTOM NAVIGATION
   =========================================================
   =========================================================

   IMPORTANT STRUCTURE:

   LEFT BAND       LOGO / SAND        RIGHT BAND
   ┌─────────────┐                   ┌─────────────┐
   │ Home │ Stay │      LOGO         │ Live │ Explore│
   └─────────────┘                   └─────────────┘

   The centre is NOT part of the band.
   The logo sits directly on the sand.
   ========================================================= */


/* =========================================================
   NAVIGATION CONTAINER
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 82px;

    z-index: 50;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding: 0 0 3px 0;

    pointer-events: none;
}


/* =========================================================
   LEFT / RIGHT BANDS
   ========================================================= */

.nav-band {

    position: relative;

    height: 66px;

    display: flex;

    align-items: stretch;

    pointer-events: auto;

    background:
        rgba(244,234,215,0.91);

    border-top:
        1px solid rgba(255,255,255,0.65);

    border-bottom:
        1px solid rgba(120,90,55,0.16);

    box-shadow:
        0 -2px 8px rgba(70,42,20,0.08);
}


/* =========================================================
   LEFT BAND
   ========================================================= */

.left-band {

    flex: 1;

    border-radius:
        0 30px 30px 0;

    margin-right: 0;
}


/* =========================================================
   RIGHT BAND
   ========================================================= */

.right-band {

    flex: 1;

    border-radius:
        30px 0 0 30px;

    margin-left: 0;
}


/* =========================================================
   NAV ITEMS
   ========================================================= */

.nav-item {

    position: relative;

    flex: 1;

    min-width: 0;

    height: 65px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    gap: 3px;

    padding-bottom: 5px;

    text-decoration: none;

    color: #463322;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 9px;

    line-height: 1;
}


/* =========================================================
   DIVIDER HOME / STAY
   ========================================================= */

.left-band .nav-item + .nav-item {

    border-left:
        1px solid rgba(70,51,34,0.36);
}


/* =========================================================
   DIVIDER LIVE / EXPLORE
   ========================================================= */

.right-band .nav-item + .nav-item {

    border-left:
        1px solid rgba(70,51,34,0.36);
}


/* =========================================================
   ICONS
   ========================================================= */

.nav-icon {

    width: 21px;
    height: 21px;

    fill: none;

    stroke: #463322;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   INDEPENDENT CENTRAL LOGO
   ========================================================= */

.logo-area {

    position: relative;

    z-index: 60;

    flex: 0 0 104px;

    height: 76px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    pointer-events: auto;

    /* NO background.
       The sand texture remains visible here. */
}


.logo-area img {

    display: block;

    width: 98px;

    height: auto;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(35,25,16,0.92);

    z-index: 100;
}


.lightbox.active {
    display: flex;
}


.lightbox-image {

    max-width: 88vw;

    max-height: 82vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);
}


/* =========================================================
   LIGHTBOX CLOSE
   ========================================================= */

.lightbox-close {

    position: absolute;

    top: 18px;
    right: 20px;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background:
        rgba(244,234,215,0.95);

    color: #463322;

    font-size: 25px;

    line-height: 42px;

    text-align: center;

    cursor: pointer;
}


/* =========================================================
   LIGHTBOX ARROWS
   ========================================================= */

.lightbox-arrow {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background:
        rgba(244,234,215,0.95);

    color: #463322;

    font-size: 27px;

    line-height: 44px;

    text-align: center;

    cursor: pointer;
}


.lightbox-prev {
    left: 14px;
}


.lightbox-next {
    right: 14px;
}


/* =========================================================
   LARGER SCREENS
   ========================================================= */

@media (min-width: 700px) {

    .remember-page {
        padding-bottom: 105px;
    }


    .salt-stories {

        width: 330px;

        max-width: 42vw;

        margin: 10px auto 6px;
    }


    .remember-content {

        padding-left: 40px;
    }


    .category {

    }


    .category-title {

        font-size: 21px;

        margin-bottom: 5px;
    }


    .photo-row {

        gap: 12px;
    }


    .photo-card {

        width: 175px;

        height: 155px;

        padding: 7px 7px 13px;

        border-radius: 17px;
    }


    .photo-card img {
        border-radius: 10px;
    }


    .bottom-nav {

        height: 105px;

        padding-bottom: 6px;
    }


    .nav-band {

        height: 72px;
    }


    .nav-item {

        height: 71px;

        font-size: 11px;

        gap: 4px;

        padding-bottom: 7px;
    }


    .nav-icon {

        width: 25px;
        height: 25px;
    }


    .logo-area {

        flex-basis: 135px;

        height: 90px;
    }


    .logo-area img {

        width: 125px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

    }

        height: 73px;
    }


    .logo-area img {

        width: 89px;
    }
}

</style>

<script>

/* =========================================================
   GALLERIES
   ========================================================= */

const galleries = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "Living1.jpg",
        "Living2.jpg",
        "Living3.jpg",
        "Living4.jpg",
        "Living5.jpg",
        "Living6.jpg",
        "Living7.jpg"
    ],

    "Bedroom": [
        "Bedroom1.jpg",
        "Bedroom2.jpg",
        "Bedroom3.jpg",
        "Bedroom4.jpg",
        "Bedroom5.jpg",
        "Bedroom6.jpg",
        "Bedroom7.jpg"
    ],

    "Kitchen": [
        "Kitchen1.jpg",
        "Kitchen2.jpg",
        "Kitchen3.jpg",
        "Kitchen4.jpg",
        "Kitchen5.jpg",
        "Kitchen6.jpg",
        "Kitchen7.jpg",
        "Kitchen8.jpg"
    ]

};


/* =========================================================
   LIGHTBOX ELEMENTS
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");


let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(category, index) {

    currentCategory = category;

    currentIndex = index;

    lightboxImage.src =
        galleries[category][index];

    lightboxImage.alt =
        category + " " + (index + 1);

    lightbox.classList.add("active");

    document.body.style.overflow = "hidden";
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    document.body.style.overflow = "";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage() {

    const images =
        galleries[currentCategory];

    currentIndex =
        (currentIndex + 1) % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage() {

    const images =
        galleries[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length)
        % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PHOTO BUTTONS
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(function(card) {

        card.addEventListener("click", function() {

            openLightbox(
                card.dataset.category,
                Number(card.dataset.index)
            );

        });

    });


/* =========================================================
   LIGHTBOX CONTROLS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* =========================================================
   BACKDROP
   ========================================================= */

lightbox.addEventListener(
    "click",
    function(event) {

        if (event.target === lightbox) {

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!lightbox.classList.contains("active")) {
            return;
        }

        if (event.key === "Escape") {
            closeLightbox();
        }

        if (event.key === "ArrowRight") {
            nextImage();
        }

        if (event.key === "ArrowLeft") {
            previousImage();
        }

    }
);

</script>
