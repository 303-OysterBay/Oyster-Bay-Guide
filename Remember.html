<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               viewport-fit=cover">

<title>303 OYSTER BAY • Remember</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    color: #463322;
    font-family: Georgia, "Times New Roman", serif;
    background: #e8d8bd;
}


/* =========================================================
   ONE SCREEN ONLY
   ========================================================= */

.remember-page {

    position: relative;

    width: 100%;
    height: 100vh;
    height: 100svh;
    height: 100dvh;

    overflow: hidden;

    background-image: url("sand-background.jpg");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}


/* =========================================================
   SAND TITLE
   =========================================================
   
   No Salt Sand Stories image.
   The lettering is made to look carved into the sand.
   ========================================================= */

.sand-title {

    width: 100%;

    height: 135px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding-top: 2px;

    text-align: center;

    overflow: hidden;
}


.sand-title-inner {

    position: relative;

    width: 260px;

    color: rgba(111, 71, 38, 0.72);

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size: 39px;

    font-weight: 600;

    line-height: 0.82;

    letter-spacing: -2px;

    transform: rotate(-3deg);

    text-shadow:

        /* carved depression */
        1px 2px 1px rgba(255,244,218,0.52),

        /* sand edge */
        -1px -1px 1px rgba(126,82,43,0.35),

        /* soft depth */
        0 2px 3px rgba(96,59,29,0.18);
}


.sand-title-inner span {
    display: block;
}


/* =========================================================
   MAIN GALLERY AREA
   ========================================================= */

.remember-content {

    position: absolute;

    left: 0;
    right: 0;

    top: 132px;

    bottom: 78px;

    width: 100%;

    overflow: hidden;

    padding-left: 14px;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category {

    width: 100%;

    margin-bottom: 8px;
}


/* =========================================================
   CATEGORY TITLE
   ========================================================= */

.category-title {

    margin: 0 0 3px 0;

    font-size: 15px;

    font-weight: normal;

    line-height: 1;

    letter-spacing: 0.1px;

    color: #463322;
}


/* =========================================================
   PHOTO ROW
   ========================================================= */

.photo-row {

    display: flex;

    flex-wrap: nowrap;

    gap: 7px;

    width: 100%;

    overflow-x: auto;

    overflow-y: hidden;

    padding: 0 12px 2px 0;

    scrollbar-width: none;

    -ms-overflow-style: none;

    -webkit-overflow-scrolling: touch;

    scroll-snap-type: x proximity;
}


.photo-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {

    flex: 0 0 108px;

    width: 108px;

    height: 94px;

    padding: 4px 4px 8px;

    border: 1px solid rgba(255,255,255,0.82);

    border-radius: 13px;

    background: #f4ead7;

    box-shadow:
        0 2px 5px rgba(70,42,20,0.16);

    cursor: pointer;

    appearance: none;

    -webkit-appearance: none;

    scroll-snap-align: start;
}


.photo-card img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 8px;
}


/* =========================================================
   BOTTOM NAVIGATION
   =========================================================
   
   IMPORTANT:
   
   The centre is NOT part of either band.
   
   Left:
   [ HOME | STAY ]
   
             LOGO
          on the sand
   
   Right:
   [ LIVE | EXPLORE ]
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    height: 78px;

    z-index: 50;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    pointer-events: none;
}


/* =========================================================
   LEFT AND RIGHT NAV BANDS
   ========================================================= */

.nav-band {

    position: relative;

    height: 58px;

    flex: 1;

    display: flex;

    align-items: stretch;

    pointer-events: auto;

    background:
        rgba(244,234,215,0.92);

    border-top:
        1px solid rgba(255,255,255,0.72);

    border-bottom:
        1px solid rgba(120,90,55,0.15);

    box-shadow:
        0 -2px 7px rgba(70,42,20,0.07);
}


/* =========================================================
   LEFT BAND
   ========================================================= */

.left-band {

    border-radius:
        0 28px 28px 0;
}


/* =========================================================
   RIGHT BAND
   ========================================================= */

.right-band {

    border-radius:
        28px 0 0 28px;
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {

    position: relative;

    flex: 1;

    height: 57px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    gap: 2px;

    padding-bottom: 5px;

    text-decoration: none;

    color: #463322;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 8px;

    line-height: 1;
}


/* =========================================================
   VERTICAL DIVIDERS
   ========================================================= */

.left-band .nav-item + .nav-item,
.right-band .nav-item + .nav-item {

    border-left:
        1px solid rgba(70,51,34,0.34);
}


/* =========================================================
   ICONS
   ========================================================= */

.nav-icon {

    width: 20px;
    height: 20px;

    fill: none;

    stroke: #463322;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   INDEPENDENT LOGO
   =========================================================
   
   NO BACKGROUND.
   NO BAND.
   NO SHADOW.
   NO OPACITY.
   
   The sand is visible completely through the centre.
   ========================================================= */

.logo-area {

    position: relative;

    z-index: 70;

    flex: 0 0 102px;

    height: 73px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    pointer-events: auto;

    background: transparent;

    box-shadow: none;
}


.logo-area img {

    display: block;

    width: 92px;

    height: auto;

    background: transparent;

    box-shadow: none;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(35,25,16,0.92);

    z-index: 100;
}


.lightbox.active {
    display: flex;
}


.lightbox-image {

    max-width: 88vw;

    max-height: 82vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);
}


/* =========================================================
   LIGHTBOX CLOSE
   ========================================================= */

.lightbox-close {

    position: absolute;

    top: 18px;
    right: 20px;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background:
        rgba(244,234,215,0.95);

    color: #463322;

    font-size: 25px;

    line-height: 42px;

    text-align: center;

    cursor: pointer;
}


/* =========================================================
   LIGHTBOX ARROWS
   ========================================================= */

.lightbox-arrow {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background:
        rgba(244,234,215,0.95);

    color: #463322;

    font-size: 27px;

    line-height: 44px;

    text-align: center;

    cursor: pointer;
}


.lightbox-prev {
    left: 14px;
}


.lightbox-next {
    right: 14px;
}


/* =========================================================
   LARGER DEVICES
   ========================================================= */

@media (min-width: 700px) {

    .sand-title {
        height: 185px;
    }


    .sand-title-inner {

        width: 340px;

        font-size: 48px;
    }

    }

    .nav-band {

    }


    .nav-item {

    }


    .nav-icon {

    }


    .logo-area {

        flex-basis: 135px;

        height: 91px;
    }


    .logo-area img {

    }
}


/* =========================================================

    }
}

</style>

<script>

/* =========================================================
   GALLERIES
   ========================================================= */

const galleries = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "Living1.jpg",
        "Living2.jpg",
        "Living3.jpg",
        "Living4.jpg",
        "Living5.jpg",
        "Living6.jpg",
        "Living7.jpg"
    ],

    "Bedroom": [
        "Bedroom1.jpg",
        "Bedroom2.jpg",
        "Bedroom3.jpg",
        "Bedroom4.jpg",
        "Bedroom5.jpg",
        "Bedroom6.jpg",
        "Bedroom7.jpg"
    ],

    "Kitchen": [
        "Kitchen1.jpg",
        "Kitchen2.jpg",
        "Kitchen3.jpg",
        "Kitchen4.jpg",
        "Kitchen5.jpg",
        "Kitchen6.jpg",
        "Kitchen7.jpg",
        "Kitchen8.jpg"
    ]

};


/* =========================================================
   LIGHTBOX
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");


let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(category, index) {

    currentCategory = category;

    currentIndex = index;

    lightboxImage.src =
        galleries[category][index];

    lightboxImage.alt =
        category + " " + (index + 1);

    lightbox.classList.add("active");

    document.body.style.overflow = "hidden";
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    document.body.style.overflow = "hidden";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage() {

    const images =
        galleries[currentCategory];

    currentIndex =
        (currentIndex + 1) % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage() {

    const images =
        galleries[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length)
        % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PHOTO CLICK
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(function(card) {

        card.addEventListener(
            "click",
            function() {

                openLightbox(
                    card.dataset.category,
                    Number(card.dataset.index)
                );

            }
        );

    });


/* =========================================================
   LIGHTBOX CONTROLS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* =========================================================
   BACKDROP
   ========================================================= */

lightbox.addEventListener(
    "click",
    function(event) {

        if (event.target === lightbox) {

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!lightbox.classList.contains("active")) {
            return;
        }

        if (event.key === "Escape") {
            closeLightbox();
        }

        if (event.key === "ArrowRight") {
            nextImage();
        }

        if (event.key === "ArrowLeft") {
            previousImage();
        }

    }
);

</script>
