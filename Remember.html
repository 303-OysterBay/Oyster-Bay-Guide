/* =========================================================
   RESET
   ========================================================= */

*{

    padding:0;
}

body{

    height:100%;
    overflow:hidden;

/* =========================================================
   THE SINGLE VIEWPORT
   ========================================================= */

.remember-page{

    position:relative;

    width:100%;
    height:100vh;
    height:100svh;
    height:100dvh;

    overflow:hidden;

    background-image:url("sand-background.jpg");
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
}


/* =========================================================
   GUEST FAVOURITE
   FIXED TO THE SAND COMPOSITION
   ========================================================= */

.guest-favourite-link{

    position:absolute;

    top:7px;
    right:8px;

    width:70px;

    z-index:60;

    display:block;

    text-decoration:none;

    pointer-events:auto;
}

.guest-favourite{

    display:block;

    width:70px;
    height:auto;

    margin:0;
    padding:0;

    border:0;

    background:transparent;

    box-shadow:none;
}


/* =========================================================
   SALT • SAND • STORIES

   HAND-ENGRAVED / PRESSED INTO THE SAND

   Brown rather than grey/black.
   Multiple very soft highlights and shadows create
   the impression of an indentation in the sand.
   ========================================================= */

.sand-stories{

    position:absolute;

    top:17px;
    left:50%;

    width:220px;

    transform:
        translateX(-50%)
        rotate(-2.5deg);

    z-index:20;

    text-align:center;

    font-family:
        "Bradley Hand",
        "Segoe Print",
        "Chalkboard SE",
        "Marker Felt",
        cursive;

    font-size:32px;

    font-weight:600;

    line-height:.88;

    letter-spacing:-1.2px;

    color:#80532f;

    /* engraved sand effect */
    text-shadow:

        /* light sand catching the upper edge */
        1px 1px 0 rgba(255,238,205,.58),

        /* darker recessed edge */
        -1px -1px 0 rgba(103,65,34,.45),

        /* inner depth */
        0 2px 1px rgba(91,56,28,.28),

        /* soft surrounding depression */
        0 3px 5px rgba(91,56,28,.13);

    pointer-events:none;
}

.sand-stories span{
    display:block;
}


/* =========================================================
   GALLERY AREA

   The whole page does not scroll.
   Only each individual photo row can scroll horizontally.
   ========================================================= */

.remember-content{

    position:absolute;

    left:0;
    right:0;

    top:124px;
    bottom:70px;

    width:100%;

    overflow:hidden;

    padding-left:11px;
    padding-right:0;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category{

    width:100%;

    margin-bottom:7px;
}


/* =========================================================
   CATEGORY HEADINGS
   ========================================================= */

.category-title{

    margin:0 0 3px 0;

    font-size:15px;

    font-weight:normal;

    line-height:1;

    color:#4b3320;

    letter-spacing:0;
}


/* =========================================================
   HORIZONTAL PHOTO ROW
   ========================================================= */

.photo-row{

    display:flex;

    flex-wrap:nowrap;

    gap:7px;

    width:100%;

    overflow-x:auto;
    overflow-y:hidden;

    padding:
        0
        10px
        3px
        0;

    scrollbar-width:none;

    -ms-overflow-style:none;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior-x:contain;

    touch-action:pan-x;
}

.photo-row::-webkit-scrollbar{
    display:none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card{

    flex:0 0 108px;

    width:108px;
    height:94px;

    padding:4px 4px 8px;

    border:1px solid rgba(255,255,255,.82);

    border-radius:13px;

    background:#f4ead7;

    box-shadow:
        0 2px 5px rgba(70,42,20,.16);

    cursor:pointer;

    appearance:none;
    -webkit-appearance:none;

    scroll-snap-align:start;
}

.photo-card img{

    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:8px;
}


/* =========================================================
   BOTTOM NAVIGATION

   IMPORTANT ARCHITECTURE:

   LEFT BAND:
       HOME | STAY

   CENTRE:
       TRANSPARENT SAND
       LARGE LOGO SITS HERE

   RIGHT BAND:
       LIVE | EXPLORE

   The logo is NOT inside this navigation.
   ========================================================= */

.bottom-nav{

    position:absolute;

    left:0;
    right:0;
    bottom:7px;

    height:57px;

    z-index:40;

    display:flex;

    align-items:stretch;

    justify-content:center;

    pointer-events:none;
}


/* =========================================================
   NAV BANDS

   Each band occupies half the screen minus the centre
   logo space.
   ========================================================= */

.nav-band{

    height:57px;

    display:flex;

    align-items:stretch;

    pointer-events:auto;

    background:
        rgba(247,238,221,.93);

    border-top:
        1px solid rgba(255,255,255,.78);

    border-bottom:
        1px solid rgba(112,78,43,.14);

    box-shadow:
        0 -2px 7px rgba(70,42,20,.07);
}


/* left side */

.left-band{

    width:calc(50% - 72px);

    border-radius:
        28px
        0
        0
        28px;
}


/* right side */

.right-band{

    width:calc(50% - 72px);

    border-radius:
        0
        28px
        28px
        0;
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item{

    position:relative;

    flex:1;

    height:57px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:2px;

    text-decoration:none;

    color:#4d3522;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:9px;

    line-height:1;

    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   NAV DIVIDERS
   ========================================================= */

.left-band .nav-item + .nav-item,
.right-band .nav-item + .nav-item{

    border-left:
        1px solid rgba(77,53,34,.28);
}


/* =========================================================
   NAV ICONS
   ========================================================= */

.nav-icon{

    width:22px;
    height:22px;

    fill:none;

    stroke:#4d3522;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =========================================================
   THE CENTRAL LOGO

   THIS IS PART OF THE SAND.

   It is deliberately larger than the navigation items
   and therefore rises visually above the nav band.

   It does NOT have a cream background.
   It does NOT belong to the nav.
   ========================================================= */

.sand-logo{

    position:absolute;

    left:50%;

    bottom:1px;

    transform:
        translateX(-50%);

    width:145px;
    height:auto;

    z-index:50;

    display:block;

    margin:0;
    padding:0;

    border:0;

    box-shadow:none;

}

.sand-logo img{

    margin:0;
    padding:0;

    background:transparent;

    border:0;

    box-shadow:none;

/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(35,25,16,.94);

    z-index:100;
}

.lightbox.active{
    display:flex;
}


/* =========================================================
   LIGHTBOX IMAGE
   ========================================================= */

.lightbox-image{

    border-radius:4px;

    box-shadow:

/* =========================================================
   LIGHTBOX CONTROLS
   ========================================================= */

.lightbox-close,

.lightbox-next{

    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

<script>

/* =========================================================
   LIGHTBOX
   ========================================================= */

const photoCards =
    Array.from(
        document.querySelectorAll(".photo-card")
    );

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

const lightboxCounter =
    document.getElementById("lightboxCounter");


let currentIndex = 0;


/* =========================================================
   OPEN IMAGE
   ========================================================= */

function openLightbox(index){

    currentIndex = index;

    const image =
        photoCards[currentIndex]
        .dataset.image;

    lightboxImage.src = image;

    lightboxImage.alt =
        photoCards[currentIndex]
        .querySelector("img")
        .alt;

    lightboxCounter.textContent =
        (currentIndex + 1)
        + " / "
        + photoCards.length;

    lightbox.classList.add("active");

    lightbox.setAttribute(
        "aria-hidden",
        "false"
    );
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox(){

    lightbox.classList.remove("active");

    lightbox.setAttribute(
        "aria-hidden",
        "true"
    );

    lightboxImage.src = "";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage(){

    currentIndex =
        (currentIndex + 1)
        % photoCards.length;

    openLightbox(currentIndex);
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage(){

    currentIndex =
        (currentIndex - 1 + photoCards.length)
        % photoCards.length;

    openLightbox(currentIndex);
}


/* =========================================================
   PHOTO CLICK
   ========================================================= */

photoCards.forEach(
    (card,index) => {

        card.addEventListener(
            "click",
            () => openLightbox(index)
        );

    }
);


/* =========================================================
   BUTTONS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* =========================================================
   CLICK OUTSIDE IMAGE
   ========================================================= */

lightbox.addEventListener(
    "click",
    (event) => {

        if(event.target === lightbox){
            closeLightbox();
        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if(
            !lightbox.classList.contains("active")
        ){
            return;
        }

        if(event.key === "Escape"){
            closeLightbox();
        }

        if(event.key === "ArrowRight"){
            nextImage();
        }

        if(event.key === "ArrowLeft"){
            previousImage();
        }

    }
);


/* =========================================================
   LIGHTBOX SWIPE
   ========================================================= */

let touchStartX = 0;


lightbox.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {passive:true}
);


lightbox.addEventListener(
    "touchend",
    (event) => {

        const touchEndX =
            event.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;

        if(Math.abs(distance) < 50){
            return;
        }

        if(distance < 0){
            nextImage();
        }
        else{
            previousImage();
        }

    },
    {passive:true}
);

</script>

</body>

</html>
