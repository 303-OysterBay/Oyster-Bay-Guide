<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               viewport-fit=cover">

<title>303 OYSTER BAY • Salt Sand Stories</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #e8d8bd;
    color: #463322;
}


/* =========================================================
   PAGE
   ========================================================= */

.remember-page {
    position: relative;
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;

    background-image: url("sand-background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================================================
   SALT • SAND • STORIES
   HAND-ENGRAVED INTO THE SAND
   ========================================================= */

.sand-title {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 235px;
    height: 124px;
    z-index: 5;
    pointer-events: none;
}

.sand-title-inner {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    font-family: "Segoe Print",
                 "Bradley Hand",
                 "Comic Sans MS",
                 cursive;

    font-size: 39px;
    font-weight: 600;
    line-height: 0.82;
    letter-spacing: -2px;

    color: rgba(111, 71, 38, 0.78);

    transform: rotate(-3deg);

    text-shadow:
        1px 2px 1px rgba(255,244,218,0.52),
        -1px -1px 1px rgba(126,82,43,0.35),
        0 2px 3px rgba(96,59,29,0.18);
}

.sand-title-inner span {
    display: block;
}


/* =========================================================
   AIRBNB GUEST FAVOURITE
   ========================================================= */

.guest-favourite {
    position: absolute;
    top: 12px;
    right: 9px;

    width: 150px;
    max-width: 30%;

    height: auto;

    z-index: 8;
}


/* =========================================================
   GALLERY AREA
   ========================================================= */

.remember-content {
    position: absolute;

    left: 0;
    right: 0;

    top: 132px;
    bottom: 145px;

    width: 100%;

    overflow: hidden;

    padding-left: 14px;
    padding-right: 0;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category {
    width: 100%;
    margin-bottom: 8px;
}

.category-title {
    margin: 0 0 3px 0;

    font-size: 15px;
    font-weight: normal;
    line-height: 1;

    letter-spacing: 0.1px;

    color: #463322;
}


/* =========================================================
   PHOTO ROW
   ========================================================= */

.photo-row {
    display: flex;
    flex-wrap: nowrap;

    gap: 7px;

    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 0 12px 2px 0;

    scrollbar-width: none;
    -ms-overflow-style: none;

    -webkit-overflow-scrolling: touch;

    scroll-snap-type: x proximity;
}

.photo-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {
    flex: 0 0 108px;

    width: 108px;
    height: 94px;

    padding: 4px 4px 8px;

    border: 1px solid rgba(255,255,255,0.82);
    border-radius: 13px;

    background: #f4ead7;

    box-shadow:
        0 2px 5px rgba(70,42,20,0.16);

    cursor: pointer;

    appearance: none;
    -webkit-appearance: none;

    scroll-snap-align: start;
}

.photo-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 8px;
}


/* =========================================================
   FROZEN BOTTOM NAVIGATION IMAGE
   ---------------------------------------------------------
   IMPORTANT:
   The artwork is NOT recreated in CSS.
   This is the frozen PNG asset.
   ========================================================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    height: 135px;

    z-index: 30;

    pointer-events: none;
}


/* THE FROZEN NAV ARTWORK */

.bottom-nav-image {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: auto;

    display: block;

    pointer-events: none;

    user-select: none;
    -webkit-user-drag: none;
}


/* =========================================================
   INVISIBLE CLICKABLE HOTSPOTS
   ---------------------------------------------------------
   These sit OVER the frozen artwork.
   They do not create or alter the artwork.
   ========================================================= */

.nav-hotspot {
    position: absolute;

    bottom: 0;

    height: 110px;

    z-index: 35;

    display: block;

    background: transparent;

    border: 0;

    text-decoration: none;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* LEFT PANEL */

.hotspot-home {
    left: 0;
    width: 17%;
}

.hotspot-stay {
    left: 17%;
    width: 18%;
}


/* RIGHT PANEL */

.hotspot-explore {
    right: 18%;
    width: 17%;
}

.hotspot-remember {
    right: 0;
    width: 18%;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(20,15,10,0.88);
}

.lightbox.active {
    display: flex;
}

.lightbox-image {
    max-width: 92vw;
    max-height: 84vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);
}

.lightbox-close,
.lightbox-arrow {
    position: absolute;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    font-family: Arial, sans-serif;

    z-index: 110;
}

.lightbox-close {
    top: 18px;
    right: 22px;

    font-size: 42px;
}

.lightbox-arrow {
    top: 50%;

    transform: translateY(-50%);

    font-size: 58px;

    width: 60px;
    height: 80px;
}

.lightbox-prev {
    left: 8px;
}

.lightbox-next {
    right: 8px;
}


/* =========================================================
   TABLET / DESKTOP
   ========================================================= */

@media (min-width: 700px) {

    .sand-title {
        width: 290px;
        height: 150px;
    }

    .sand-title-inner {
        font-size: 50px;
    }

    .guest-favourite {
        width: 210px;
        max-width: none;
        top: 16px;
        right: 18px;
    }

    .remember-content {
        top: 155px;
        bottom: 165px;
        padding-left: 30px;
    }

    .category {
        margin-bottom: 18px;
    }

    .category-title {
        font-size: 20px;
        margin-bottom: 5px;
    }

    .photo-row {
        gap: 12px;
    }

    .photo-card {
        flex-basis: 165px;
        width: 165px;
        height: 145px;

        padding: 7px 7px 13px;

        border-radius: 17px;
    }

    .photo-card img {
        border-radius: 9px;
    }

    .bottom-nav {
        height: 155px;
    }

    .nav-hotspot {
        height: 125px;
    }
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 390px) {

    .sand-title {
        width: 235px;
        height: 124px;
    }

    .sand-title-inner {
        font-size: 35px;
    }

    .guest-favourite {
        width: 125px;
        top: 7px;
        right: 6px;
    }

    .remember-content {
        top: 121px;
        bottom: 116px;
        padding-left: 12px;
    }

    .category {
        margin-bottom: 7px;
    }

    .category-title {
        font-size: 14px;
        margin-bottom: 3px;
    }

    .photo-row {
        gap: 6px;
    }

    .photo-card {
        flex-basis: 101px;
        width: 101px;
        height: 88px;

        padding: 4px 4px 7px;

        border-radius: 12px;
    }

    .photo-card img {
        border-radius: 7px;
    }

    .bottom-nav {
        height: 108px;
    }

    .nav-hotspot {
        height: 90px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 360px) {

    .sand-title {
        width: 225px;
        height: 120px;
    }

    .sand-title-inner {
        font-size: 33px;
    }

    .guest-favourite {
        width: 115px;
    }

    .remember-content {
        top: 118px;
        bottom: 105px;
    }

    .category-title {
        font-size: 13px;
    }

    .photo-card {
        flex-basis: 96px;
        width: 96px;
        height: 84px;
    }

    .bottom-nav {
        height: 100px;
    }

    .nav-hotspot {
        height: 84px;
    }
}

</style>
</head>


<body>

<script>

/* =========================================================
   GALLERY DATA
   ========================================================= */

const galleryData = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "Living1.jpg",
        "Living2.jpg",
        "Living3.jpg",
        "Living4.jpg",
        "Living5.jpg",
        "Living6.jpg",
        "Living7.jpg"
    ],

    "Bedroom": [
        "Bedroom1.jpg",
        "Bedroom2.jpg",
        "Bedroom3.jpg",
        "Bedroom4.jpg",
        "Bedroom5.jpg",
        "Bedroom6.jpg",
        "Bedroom7.jpg"
    ],

    "Kitchen": [
        "Kitchen1.jpg",
        "Kitchen2.jpg",
        "Kitchen3.jpg",
        "Kitchen4.jpg",
        "Kitchen5.jpg",
        "Kitchen6.jpg",
        "Kitchen7.jpg",
        "Kitchen8.jpg"
    ]

};


/* =========================================================
   LIGHTBOX
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

let currentCategory = "";
let currentIndex = 0;


function openLightbox(category, index) {

    currentCategory = category;
    currentIndex = index;

    lightboxImage.src =
        galleryData[category][index];

    lightboxImage.alt =
        category + " " + (index + 1);

    lightbox.classList.add("active");
}


function closeLightbox() {

    lightbox.classList.remove("active");

    lightboxImage.src = "";
}


function showNext() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex + 1) % images.length;

    lightboxImage.src =
        images[currentIndex];
}


function showPrevious() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length)
        % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* PHOTO CLICK */

document.querySelectorAll(".photo-card")
.forEach(card => {

    card.addEventListener("click", () => {

        openLightbox(
            card.dataset.category,
            Number(card.dataset.index)
        );

    });

});


/* LIGHTBOX CONTROLS */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    showNext
);

lightboxPrev.addEventListener(
    "click",
    showPrevious
);


/* CLICK OUTSIDE IMAGE */

lightbox.addEventListener("click", event => {

    if (event.target === lightbox) {
        closeLightbox();
    }

});


/* KEYBOARD */

document.addEventListener("keydown", event => {

    if (!lightbox.classList.contains("active")) {
        return;
    }

    if (event.key === "Escape") {
        closeLightbox();
    }

    if (event.key === "ArrowRight") {
        showNext();
    }

    if (event.key === "ArrowLeft") {
        showPrevious();
    }

});


/* =========================================================
   SWIPE SUPPORT
   ========================================================= */

let touchStartX = 0;

lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);


lightbox.addEventListener(
    "touchend",
    event => {

        const touchEndX =
            event.changedTouches[0].screenX;

        const difference =
            touchEndX - touchStartX;

        if (Math.abs(difference) < 40) {
            return;
        }

        if (difference < 0) {
            showNext();
        } else {
            showPrevious();
        }

    },
    { passive: true }
);

</script>
