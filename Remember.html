<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Remember • 303 Oyster Bay</title>

<style>

/* =========================================================
   RESET / PAGE
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#e8d8bd;
    color:#463322;
}

/* =========================================================
   MAIN SAND CANVAS
   ========================================================= */

.remember-page{
    position:relative;
    width:100%;
    height:100svh;
    min-height:100svh;
    overflow:hidden;

    background-image:url("sand-background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* =========================================================
   PAGE HEADER
   ========================================================= */

.page-header{
    position:relative;
    width:100%;
    height:126px;
}

.page-title{
    position:absolute;
    top:58px;
    left:0;
    width:100%;

    text-align:center;
    font-size:30px;
    font-weight:normal;
    letter-spacing:2px;
    color:#463322;
    z-index:5;
}

.page-title::after{
    content:"";
    display:block;
    width:64px;
    height:1px;
    background:rgba(70,51,34,.65);
    margin:9px auto 0;
}

/* =========================================================
   SALT • SAND • STORIES
   ========================================================= */

.salt-stories{
    position:absolute;
    top:7px;
    right:9px;

    width:215px;
    max-width:52%;
    height:auto;

    z-index:4;
}

/* =========================================================
   AIRBNB GUEST FAVOURITE
   ========================================================= */

.guest-favourite-link{
    position:absolute;
    top:10px;
    right:2.5%;

    width:82px;

    display:block;
    z-index:10;

    text-decoration:none;
}

.guest-favourite{
    display:block;
    width:82px;
    height:auto;

    margin:0;
    padding:0;

    background:transparent;
    border:0;
    box-shadow:none;
}

/* =========================================================
   GALLERY CONTENT
   ========================================================= */

.remember-content{
    position:relative;

    width:100%;
    height:calc(100svh - 126px - 118px);

    overflow:hidden;

    padding-left:13px;
    padding-right:0;
}

.category{
    width:100%;
    margin-bottom:9px;
}

.category-title{
    margin-bottom:4px;

    font-size:13px;
    font-weight:normal;
    letter-spacing:1.3px;

    color:#463322;
}

.photo-row{
    display:flex;
    flex-wrap:nowrap;

    gap:7px;

    width:100%;

    overflow-x:auto;
    overflow-y:hidden;

    padding-right:0;

    scrollbar-width:none;
    -ms-overflow-style:none;

    -webkit-overflow-scrolling:touch;
}

.photo-row::-webkit-scrollbar{
    display:none;
}

.photo-card{
    flex:0 0 96px;

    width:96px;
    height:88px;

    padding:5px 5px 13px;

    border:none;
    border-radius:9px;

    background:#f4ead7;

    box-shadow:0 2px 5px rgba(70,42,20,.18);

    cursor:pointer;
}

.photo-card img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:6px;
}

/* =========================================================
   INDEPENDENT LOGO ON THE SAND
   IMPORTANT: THIS IS NOT PART OF THE NAVIGATION
   ========================================================= */

.sand-logo{
    position:absolute;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    width:230px;
    height:auto;

    z-index:12;

    pointer-events:none;
}

/* =========================================================
   BOTTOM NAVIGATION
   TWO SEPARATE CREAM BANDS
   ========================================================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:7px;

    height:82px;

    z-index:30;

    display:flex;
    align-items:stretch;
    justify-content:space-between;

    padding:0 18px;

    pointer-events:none;
}

/* ---------------------------------------------------------
   EACH SIDE IS ITS OWN CREAM BAND
   --------------------------------------------------------- */

.nav-side{
    position:relative;

    display:flex;
    align-items:stretch;

    width:calc(50% - 145px);
    max-width:410px;
    min-width:250px;

    height:82px;

    background:rgba(248,239,220,.94);

    border-radius:3px;

    pointer-events:auto;
}

/* ---------------------------------------------------------
   NAV ITEMS
   --------------------------------------------------------- */

.nav-item{
    flex:1;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    height:100%;

    text-decoration:none;

    color:#463322;

    gap:6px;

    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    line-height:1;
}

.nav-item + .nav-item{
    border-left:1px solid rgba(70,51,34,.48);
}

.nav-icon{
    width:35px;
    height:35px;

    fill:none;
    stroke:#463322;

    stroke-width:2.2;

    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(25,18,11,.94);

    padding:20px;
}

.lightbox.active{
    display:flex;
}

.lightbox-image{
    max-width:94vw;
    max-height:88vh;

    object-fit:contain;

    border-radius:3px;

    box-shadow:0 8px 30px rgba(0,0,0,.45);
}

.lightbox-close,
.lightbox-prev,
.lightbox-next{
    position:absolute;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    background:transparent;

    color:#fff;

    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;

    z-index:110;
}

.lightbox-close{
    top:15px;
    right:20px;

    width:42px;
    height:42px;

    font-size:34px;
    font-weight:300;
}

.lightbox-prev,
.lightbox-next{
    top:50%;
    transform:translateY(-50%);

    width:48px;
    height:70px;

    font-size:48px;
    font-weight:200;
}

.lightbox-prev{
    left:8px;
}

.lightbox-next{
    right:8px;
}

.lightbox-counter{
    position:absolute;

    bottom:16px;
    left:50%;

    transform:translateX(-50%);

    color:#fff;

    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    letter-spacing:.5px;

    opacity:.85;
}

<script>

/* =========================================================
   LIGHTBOX
   ========================================================= */

const photoCards = Array.from(
    document.querySelectorAll(".photo-card")
);

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxClose = document.getElementById("lightboxClose");
const lightboxPrev = document.getElementById("lightboxPrev");
const lightboxNext = document.getElementById("lightboxNext");
const lightboxCounter = document.getElementById("lightboxCounter");

let currentIndex = 0;


/* OPEN */

function openLightbox(index){

    currentIndex = index;

    const image =
        photoCards[currentIndex].dataset.image;

    lightboxImage.src = image;

    lightboxImage.alt =
        photoCards[currentIndex]
        .querySelector("img")
        .alt;

    lightboxCounter.textContent =
        (currentIndex + 1) +
        " / " +
        photoCards.length;

    lightbox.classList.add("active");

    lightbox.setAttribute(
        "aria-hidden",
        "false"
    );
}


/* CLOSE */

function closeLightbox(){

    lightbox.classList.remove("active");

    lightbox.setAttribute(
        "aria-hidden",
        "true"
    );

    lightboxImage.src = "";
}


/* NEXT */

function nextImage(){

    currentIndex =
        (currentIndex + 1) %
        photoCards.length;

    openLightbox(currentIndex);
}


/* PREVIOUS */

function previousImage(){

    currentIndex =
        (currentIndex - 1 + photoCards.length) %
        photoCards.length;

    openLightbox(currentIndex);
}


/* CLICK PHOTO */

photoCards.forEach(
    (card,index) => {

        card.addEventListener(
            "click",
            () => openLightbox(index)
        );

    }
);


/* BUTTONS */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* CLICK OUTSIDE IMAGE */

lightbox.addEventListener(
    "click",
    (event) => {

        if(event.target === lightbox){
            closeLightbox();
        }

    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    (event) => {

        if(!lightbox.classList.contains("active")){
            return;
        }

        if(event.key === "Escape"){
            closeLightbox();
        }

        if(event.key === "ArrowRight"){
            nextImage();
        }

        if(event.key === "ArrowLeft"){
            previousImage();
        }

    }
);


/* =========================================================
   TOUCH SWIPE IN LIGHTBOX
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {passive:true}
);


lightbox.addEventListener(
    "touchend",
    (event) => {

        touchEndX =
            event.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;

        if(Math.abs(distance) < 50){
            return;
        }

        if(distance < 0){
            nextImage();
        }else{
            previousImage();
        }

    },
    {passive:true}
);

</script>
