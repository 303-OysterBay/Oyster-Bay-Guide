<!DOCTYPE html>
<html lang="en">

<head>

<title>303 OYSTER BAY • Remember</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #e8d8bd;
    color: #463322;
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================================================
   PAGE
   ========================================================= */

.remember-page {
    position: relative;

    width: 100%;
    height: 100vh;
    height: 100svh;
    height: 100dvh;

    overflow: hidden;

    background-image: url("sand-background.jpg");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}


/* =========================================================
   GUEST FAVOURITE
   ========================================================= */

.guest-favourite {
    position: absolute;

    top: 14px;
    right: 14px;

    width: 118px;
    height: auto;

    z-index: 40;
}


/* =========================================================
   SALT / SAND / STORIES
   HAND-ENGRAVED IN THE SAND
   ========================================================= */

.sand-title {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 132px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding-top: 4px;

    text-align: center;

    overflow: hidden;

    z-index: 5;
}


.sand-title-inner {

    position: relative;

    width: 260px;

    color: rgba(111, 71, 38, 0.72);

    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size: 39px;

    font-weight: 600;

    line-height: 0.82;

    letter-spacing: -2px;

    transform: rotate(-3deg);

    /*
       Gives the lettering the appearance
       of being pressed/carved into sand.
    */

    text-shadow:

        1px 2px 1px
        rgba(255,244,218,0.52),

        -1px -1px 1px
        rgba(126,82,43,0.35),

        0 2px 3px
        rgba(96,59,29,0.18);
}


.sand-title-inner span {
    display: block;
}


/* =========================================================
   GALLERY AREA
   ========================================================= */

.remember-content {

    position: absolute;

    left: 0;
    right: 0;

    top: 132px;
    bottom: 112px;

    width: 100%;

    overflow: hidden;

    padding-left: 14px;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category {

    width: 100%;

    margin-bottom: 8px;
}


/* =========================================================
   CATEGORY TITLE
   ========================================================= */

.category-title {

    margin: 0 0 3px 0;

    font-size: 15px;

    font-weight: normal;

    line-height: 1;

    letter-spacing: 0.1px;

    color: #463322;
}


/* =========================================================
   PHOTO ROW
   ========================================================= */

.photo-row {

    display: flex;

    flex-wrap: nowrap;

    gap: 7px;

    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    padding-right: 0;

    scrollbar-width: none;

    -ms-overflow-style: none;
}

.photo-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {

    flex: 0 0 96px;

    width: 96px;
    height: 88px;

    padding: 5px 5px 13px;

    border: none;

    border-radius: 9px;

    background: #f4ead7;

    box-shadow:
        0 2px 5px rgba(70,42,20,0.18);

    cursor: pointer;

    appearance: none;
    -webkit-appearance: none;
}

.photo-card img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 6px;
}


/* =========================================================
   FROZEN REMEMBER BOTTOM NAVIGATION
   =========================================================

   IMPORTANT:

   The visual navigation is a SINGLE FROZEN IMAGE.

   File:
   Remember Bottom Nav bar.png

   Nothing is drawn here.

   No icons.
   No dividers.
   No panels.
   No SVG navigation.

   This CSS only positions the frozen asset.
   ========================================================= */

.bottom-nav {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    z-index: 20;

    pointer-events: none;
}


.bottom-nav-image {

    display: block;

    width: 100%;
    height: auto;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   INDEPENDENT 303 OYSTER BAY LOGO
   =========================================================

   The logo is NOT part of the navigation asset.
   ========================================================= */

.bottom-logo {

    position: absolute;

    left: 50%;

    bottom: 7%;

    transform: translateX(-50%);

    width: clamp(95px, 15vw, 165px);

    height: auto;

    z-index: 30;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   INVISIBLE NAVIGATION HOTSPOTS
   =========================================================

   These have NO visual appearance.

   They simply sit over the corresponding portions
   of the frozen navigation image.
   ========================================================= */

.nav-hit {

    position: absolute;

    top: 58%;

    height: 38%;

    background: transparent;

    border: none;

    outline: none;

    padding: 0;
    margin: 0;

    pointer-events: auto;

    cursor: pointer;

    z-index: 35;
}


/* HOME */

.nav-hit-home {

    left: 0%;

    width: 17%;
}


/* STAY */

.nav-hit-stay {

    left: 17%;

    width: 18%;
}


/* EXPLORE */

.nav-hit-explore {

    left: 65%;

    width: 17%;
}


/* REMEMBER */

.nav-hit-remember {

    left: 82%;

    width: 18%;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(25,18,12,0.92);

    z-index: 100;
}

.lightbox.open {
    display: flex;
}


/* =========================================================
   LIGHTBOX IMAGE
   ========================================================= */

.lightbox-image {

    max-width: 92vw;
    max-height: 88vh;

    object-fit: contain;

    border-radius: 4px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.45);
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.lightbox-close {

    position: absolute;

    top: 18px;
    right: 22px;

    width: 42px;
    height: 42px;

    border: none;

    background: transparent;

    color: #f4ead7;

    font-size: 38px;

    font-family: Arial, sans-serif;

    font-weight: 200;

    line-height: 1;

    cursor: pointer;
}


/* =========================================================
   LIGHTBOX ARROWS
   ========================================================= */

.lightbox-arrow {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 50px;
    height: 70px;

    border: none;

    background: transparent;

    color: #f4ead7;

    font-family: Georgia, serif;

    font-size: 52px;

    line-height: 1;

    cursor: pointer;
}

.lightbox-prev {
    left: 8px;
}

.lightbox-next {
    right: 8px;
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 600px) {

    .guest-favourite {

        right: 8px;

    }

</style>

<script>

/* =========================================================
   GALLERY DATA
   ========================================================= */

const galleries = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "Living1.jpg",
        "Living2.jpg",
        "Living3.jpg",
        "Living4.jpg",
        "Living5.jpg",
        "Living6.jpg",
        "Living7.jpg"
    ],

    "Bedroom": [
        "Bedroom1.jpg",
        "Bedroom2.jpg",
        "Bedroom3.jpg",
        "Bedroom4.jpg",
        "Bedroom5.jpg",
        "Bedroom6.jpg",
        "Bedroom7.jpg"
    ],

    "Kitchen": [
        "Kitchen1.jpg",
        "Kitchen2.jpg",
        "Kitchen3.jpg",
        "Kitchen4.jpg",
        "Kitchen5.jpg",
        "Kitchen6.jpg",
        "Kitchen7.jpg",
        "Kitchen8.jpg"
    ]

};


/* =========================================================
   LIGHTBOX ELEMENTS
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");


let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN PHOTO
   ========================================================= */

function openPhoto(category, index) {

    currentCategory = category;

    currentIndex = index;

    lightboxImage.src =
        galleries[category][index];

    lightboxImage.alt =
        category + " " + (index + 1);

    lightbox.classList.add("open");
}


/* =========================================================
   CLOSE LIGHTBOX
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("open");

    lightboxImage.src = "";
}


/* =========================================================
   NEXT PHOTO
   ========================================================= */

function nextPhoto() {

    const gallery =
        galleries[currentCategory];

    currentIndex =
        (currentIndex + 1) %
        gallery.length;

    lightboxImage.src =
        gallery[currentIndex];

    lightboxImage.alt =
        currentCategory +
        " " +
        (currentIndex + 1);
}


/* =========================================================
   PREVIOUS PHOTO
   ========================================================= */

function previousPhoto() {

    const gallery =
        galleries[currentCategory];

    currentIndex =
        (currentIndex - 1 + gallery.length) %
        gallery.length;

    lightboxImage.src =
        gallery[currentIndex];

    lightboxImage.alt =
        currentCategory +
        " " +
        (currentIndex + 1);
}


/* =========================================================
   PHOTO CLICK
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener("click", () => {

            const category =
                card.dataset.category;

            const index =
                Number(card.dataset.index);

            openPhoto(category, index);

        });

    });


/* =========================================================
   LIGHTBOX BUTTONS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightboxNext.addEventListener(
    "click",
    nextPhoto
);


lightboxPrev.addEventListener(
    "click",
    previousPhoto
);


/* =========================================================
   CLOSE WHEN CLICKING OUTSIDE PHOTO
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (event.target === lightbox) {

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD CONTROL
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains("open")
        ) {
            return;
        }


        if (event.key === "Escape") {

            closeLightbox();

        }


        if (event.key === "ArrowRight") {

            nextPhoto();

        }


        if (event.key === "ArrowLeft") {

            previousPhoto();

        }

    }
);


/* =========================================================
   SWIPE CONTROL
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;


lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        touchEndX =
            event.changedTouches[0].screenX;

        const difference =
            touchEndX - touchStartX;


        if (
            Math.abs(difference) < 45
        ) {
            return;
        }


        if (difference < 0) {

            nextPhoto();

        } else {

            previousPhoto();

        }

    }
);

</script>
