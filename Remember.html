<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>303 OYSTER BAY • Remember</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    width: 100%;
    min-height: 100%;

    color: #463322;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: #e8d8bd;

    overflow-x: hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.remember-page {

    width: 100%;

    min-height: 100vh;
    min-height: 100svh;

    padding-bottom: 125px;

    background-image:
        url("sand-background.jpg");

    background-size: cover;

    background-position:
        center top;

    background-repeat: repeat-y;
}


/* =========================================================
   SALT SAND STORIES
   CENTRED — FACE ON
   ========================================================= */

.salt-stories {

    display: block;

    width: 205px;

    max-width: 55vw;

    height: auto;

    margin:
        18px
        auto
        26px
        auto;
}


/* =========================================================
   CONTENT
   ========================================================= */

.remember-content {

    width: 100%;

    padding-left: 18px;

    padding-right: 0;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category {

    width: 100%;

    margin-bottom: 27px;
}


/* =========================================================
   CATEGORY TITLE
   ========================================================= */

.category-title {

    margin:
        0
        0
        7px
        0;

    color: #463322;

    font-size: 21px;

    font-weight: normal;

    letter-spacing: 0.3px;

    line-height: 1.1;
}


/* =========================================================
   PHOTO ROW
   ========================================================= */

.photo-row {

    display: flex;

    flex-wrap: nowrap;

    gap: 10px;

    width: 100%;

    overflow-x: auto;

    overflow-y: hidden;

    padding:
        0
        18px
        7px
        0;

    scrollbar-width: none;

    -ms-overflow-style: none;

    -webkit-overflow-scrolling: touch;
}

.photo-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {

    flex:
        0 0
        145px;

    width: 145px;

    height: 132px;

    padding:
        6px
        6px
        13px;

    border:
        1px solid
        rgba(255,255,255,0.7);

    border-radius: 15px;

    background: #f4ead7;

    box-shadow:
        0 3px 8px
        rgba(70,42,20,0.20);

    cursor: pointer;

    appearance: none;

    -webkit-appearance: none;
}


/* =========================================================
   PHOTO
   ========================================================= */

.photo-card img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

    border-radius: 10px;
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 112px;

    z-index: 50;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding:
        0
        20px
        8px;

    background:
        linear-gradient(
            to bottom,
            rgba(232,216,189,0),
            rgba(232,216,189,0.78) 25%,
            rgba(232,216,189,0.96) 55%,
            rgba(232,216,189,1) 100%
        );
}


/* =========================================================
   NAV TOP LINE
   ========================================================= */

.bottom-nav::before {

    content: "";

    position: absolute;

    left: 20px;
    right: 20px;

    top: 22px;

    height: 1px;

    background:
        rgba(70,51,34,0.62);
}


/* =========================================================
   NAV SIDE
   ========================================================= */

.nav-side {

    position: relative;

    z-index: 2;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    flex: 1;

    max-width: 235px;

    height: 79px;
}


/* =========================================================
   NAV ITEM
   ========================================================= */

.nav-item {

    width: 50%;

    height: 74px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    gap: 5px;

    text-decoration: none;

    color: #463322;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;

    line-height: 1;
}


/* =========================================================
   NAV DIVIDERS
   ========================================================= */

.nav-item + .nav-item {

    border-left:
        1px solid
        rgba(70,51,34,0.42);
}


/* =========================================================
   SMALLER ICONS
   ========================================================= */

.nav-icon {

    width: 28px;

    height: 28px;

    fill: none;

    stroke: #463322;

    stroke-width: 2.1;

    stroke-linecap: round;

    stroke-linejoin: round;
}


/* =========================================================
   CENTRAL LOGO
   ========================================================= */

.logo-wrap {

    position: relative;

    z-index: 4;

    flex:
        0 0
        155px;

    height: 84px;

    display: flex;

    align-items: flex-end;

    justify-content: center;
}


.logo-wrap img {

    display: block;

    width: 150px;

    max-width: 100%;

    height: auto;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(35,25,16,0.92);

    z-index: 100;
}

.lightbox.active {
    display: flex;
}


.lightbox-image {

    max-width: 88vw;

    max-height: 82vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,0.35);
}


.lightbox-close,
.lightbox-arrow {

    position: absolute;

    border: none;

    border-radius: 50%;

    background:
        rgba(244,234,215,0.95);

    color: #463322;

    text-align: center;

    cursor: pointer;
}


.lightbox-close {

    top: 18px;

    right: 20px;

    width: 42px;

    height: 42px;

    font-size: 25px;

    line-height: 42px;
}


.lightbox-arrow {

    top: 50%;

    transform:
        translateY(-50%);

    width: 44px;

    height: 44px;

    font-size: 27px;

    line-height: 44px;
}


.lightbox-prev {
    left: 14px;
}

.lightbox-next {
    right: 14px;
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 700px) {

    .salt-stories {

        width: 260px;

        margin:
            22px
            auto

            auto;
    }

    }

    }


    .category-title {

    .photo-row {

            16px;

    }


    .bottom-nav {

        height: 130px;

        padding-bottom: 12px;
    }


    .bottom-nav::before {

        right: 5%;
    }


    .nav-side {

        height: 96px;
    }

        font-size: 15px;

    }


    .nav-icon {

    }


    .logo-wrap {

        height: 108px;
    }


    .logo-wrap img {

}


/* =========================================================

}

</style>

<script>

/* =========================================================
   GALLERY DATA
   ========================================================= */

const galleryData = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "Living1.jpg",
        "Living2.jpg",
        "Living3.jpg",
        "Living4.jpg",
        "Living5.jpg",
        "Living6.jpg",
        "Living7.jpg"
    ],

    "Bedroom": [
        "Bedroom1.jpg",
        "Bedroom2.jpg",
        "Bedroom3.jpg",
        "Bedroom4.jpg",
        "Bedroom5.jpg",
        "Bedroom6.jpg",
        "Bedroom7.jpg"
    ],

    "Kitchen": [
        "Kitchen1.jpg",
        "Kitchen2.jpg",
        "Kitchen3.jpg",
        "Kitchen4.jpg",
        "Kitchen5.jpg",
        "Kitchen6.jpg",
        "Kitchen7.jpg",
        "Kitchen8.jpg"
    ]

};


/* =========================================================
   LIGHTBOX
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

let currentCategory = "";

let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(category, index) {

    currentCategory = category;

    currentIndex = index;

    lightboxImage.src =
        galleryData[category][index];

    lightbox.classList.add("active");
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    lightboxImage.src = "";
}


/* =========================================================
   NEXT
   ========================================================= */

function showNext() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex + 1) %
        images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function showPrevious() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length) %
        images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PHOTO CLICK
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                openLightbox(
                    card.dataset.category,
                    Number(card.dataset.index)
                );

            }
        );

    });


/* =========================================================
   LIGHTBOX CONTROLS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    showNext
);

lightboxPrev.addEventListener(
    "click",
    showPrevious
);


/* =========================================================
   CLICK OUTSIDE
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains("active")
        ) {

            return;

        }

        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }

        if (
            event.key === "ArrowRight"
        ) {

            showNext();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            showPrevious();

        }

    }
);


/* =========================================================
   SWIPE
   ========================================================= */

let touchStartX = 0;

lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {
        passive: true
    }
);


lightbox.addEventListener(
    "touchend",
    event => {

        const touchEndX =
            event.changedTouches[0].screenX;

        const difference =
            touchEndX - touchStartX;

        if (
            Math.abs(difference) < 40
        ) {

            return;

        }

        if (
            difference < 0
        ) {

            showNext();

        } else {

            showPrevious();

        }

    },
    {
        passive: true
    }
);

</script>
