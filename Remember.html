<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
>

<title>Remember • 303 Oyster Bay</title>


<style>

/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    color:#463322;
    background:#e8d8bd;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.remember-page{

    position:relative;

    width:100%;
    height:100svh;
    min-height:100svh;

    overflow:hidden;

    background-image:url("sand-background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}


/* =========================================================
   TOP AREA
   ========================================================= */

.page-header{

    position:relative;

    width:100%;
    height:112px;

    z-index:5;
}


/* =========================================================
   ENGRAVED SALT • SAND • STORIES
   ========================================================= */

.sand-stories{

    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    width:205px;

    text-align:center;

    font-family:Georgia,"Times New Roman",serif;

    font-size:25px;
    line-height:1.02;

    letter-spacing:2.2px;

    color:rgba(91,61,38,.72);

    /*
       The combination of light and dark shadows gives
       the impression that the lettering is pressed into
       the sand rather than sitting on top of it.
    */

    text-shadow:
        1px 1px 0 rgba(255,247,224,.62),
        -1px -1px 0 rgba(92,61,37,.48),
        0 2px 2px rgba(92,61,37,.20);

    z-index:5;
}

.sand-stories span{
    display:block;
}


/* =========================================================
   GUEST FAVOURITE
   ========================================================= */

.guest-favourite-link{

    position:absolute;

    top:10px;
    right:10px;

    width:76px;

    display:block;

    z-index:15;

    text-decoration:none;
}

.guest-favourite{

    display:block;

    width:76px;
    height:auto;

    border:0;
    margin:0;
    padding:0;

    background:transparent;
    box-shadow:none;
}


/* =========================================================
   GALLERY CONTENT
   ========================================================= */

.remember-content{

    position:relative;

    width:100%;

    height:calc(100svh - 112px - 92px);

    overflow:hidden;

    padding-left:13px;
    padding-right:0;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category{

    width:100%;

    margin-bottom:8px;
}

.category-title{

    margin-bottom:4px;

    font-size:13px;

    font-weight:normal;

    letter-spacing:1.3px;

    color:#463322;
}


/* =========================================================
   HORIZONTAL PHOTO ROW
   ========================================================= */

.photo-row{

    display:flex;

    flex-wrap:nowrap;

    gap:7px;

    width:100%;

    overflow-x:auto;
    overflow-y:hidden;

    padding-right:4px;

    scrollbar-width:none;
    -ms-overflow-style:none;

    -webkit-overflow-scrolling:touch;
}

.photo-row::-webkit-scrollbar{
    display:none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card{

    flex:0 0 96px;

    width:96px;
    height:88px;

    padding:5px 5px 13px;

    border:0;

    border-radius:9px;

    background:#f4ead7;

    box-shadow:
        0 2px 5px rgba(70,42,20,.18);

    cursor:pointer;

    appearance:none;

    -webkit-appearance:none;
}

.photo-card img{

    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:6px;
}


/* =========================================================
   BOTTOM NAVIGATION
   FIVE ELEMENTS IN ONE HORIZONTAL COMPOSITION
   HOME | STAY | BIG LOGO | LIVE | EXPLORE
   ========================================================= */

.bottom-nav{

    position:absolute;

    left:0;
    right:0;
    bottom:5px;

    width:100%;
    height:91px;

    z-index:30;

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1.65fr
        1fr
        1fr;

    align-items:end;

    padding:0 5px;

    pointer-events:none;
}


/* =========================================================
   NAVIGATION ITEMS
   ========================================================= */

.nav-item{

    position:relative;

    height:61px;

    display:flex;

    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:#463322;

    font-family:Arial,Helvetica,sans-serif;

    font-size:13px;

    letter-spacing:.4px;

    background:rgba(248,239,220,.92);

    border-right:1px solid rgba(70,51,34,.25);

    pointer-events:auto;

    z-index:2;
}

.nav-item:first-child{

    border-radius:7px 0 0 7px;
}

.nav-item:nth-child(2){

    border-radius:0;
}

.nav-item:nth-child(4){

    border-radius:0;
}

.nav-item:last-child{

    border-right:0;

    border-radius:0 7px 7px 0;
}


/* =========================================================
   CENTRE LOGO AREA
   ========================================================= */

.logo-nav{

    position:relative;

    height:91px;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    pointer-events:none;

    z-index:10;
}


/*
   The logo is deliberately much larger than the
   four navigation items and sits higher than them.
*/

.logo-nav img{

    display:block;

    width:145px;
    max-width:none;

    height:auto;

    position:relative;

    bottom:18px;

    filter:
        drop-shadow(0 2px 2px rgba(60,40,25,.12));

    pointer-events:none;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(25,18,11,.94);

    padding:20px;
}

.lightbox.active{
    display:flex;
}

.lightbox-image{

    max-width:94vw;
    max-height:88vh;

    object-fit:contain;

    border-radius:3px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.45);
}

.lightbox-close,
.lightbox-prev,
.lightbox-next{

    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    background:transparent;

    color:#fff;

    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;

    z-index:110;
}

.lightbox-close{

    top:15px;
    right:20px;

    width:42px;
    height:42px;

    font-size:34px;
}

.lightbox-prev,
.lightbox-next{

    top:50%;

    transform:translateY(-50%);

    width:48px;
    height:70px;

    font-size:48px;
}

.lightbox-prev{
    left:8px;
}

.lightbox-next{
    right:8px;
}

.lightbox-counter{

    position:absolute;

    bottom:16px;
    left:50%;

    transform:translateX(-50%);

    color:#fff;

    font-family:Arial,Helvetica,sans-serif;

    font-size:13px;

    letter-spacing:.5px;

    opacity:.85;
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media(min-width:700px){

    .page-header{
        height:155px;
    }

    .sand-stories{

        top:31px;

        width:280px;

        font-size:34px;

        letter-spacing:3px;
    }

    .guest-favourite-link{

        top:14px;
        right:18px;

        width:92px;
    }

    .guest-favourite{
        width:92px;
    }

    .remember-content{

        height:calc(100svh - 155px - 120px);

        padding-left:30px;
    }

    .category{
        margin-bottom:17px;
    }

    .category-title{

        font-size:16px;

        margin-bottom:7px;
    }

    .photo-row{
        gap:12px;
    }

    .photo-card{

        flex-basis:150px;

        width:150px;
        height:138px;

        padding:7px 7px 19px;
    }

    .photo-card img{
        border-radius:7px;
    }

    .bottom-nav{

        height:118px;

        bottom:8px;

        padding:0 18px;
    }

    .nav-item{

        height:72px;

        font-size:16px;
    }

    .logo-nav{
        height:118px;
    }

    .logo-nav img{

        width:220px;

        bottom:24px;
    }
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:390px){

    .page-header{
        height:108px;
    }

    .sand-stories{

        top:18px;

        width:190px;

        font-size:23px;

        letter-spacing:1.9px;
    }

    .guest-favourite-link{

        top:7px;
        right:7px;

        width:69px;
    }

    .guest-favourite{
        width:69px;
    }

    .remember-content{

        height:calc(100svh - 108px - 83px);

        padding-left:11px;
    }

    .category{
        margin-bottom:7px;
    }

    .category-title{

        font-size:12px;

        margin-bottom:3px;
    }

    .photo-row{
        gap:6px;
    }

    .photo-card{

        flex-basis:91px;

        width:91px;
        height:84px;

    }

    }

    .nav-item{

        height:55px;

    }

    .logo-nav{
        height:83px;
    }

    .logo-nav img{

        width:126px;

        bottom:17px;
    }
}


/* =========================================================

@media(max-height:700px){

        top:14px;

        width:62px;

        top:5px;
    }

    .guest-favourite{

    }

    }

    }

    }

    .bottom-nav{

    }

    .nav-item{

        height:50px;

    }

    .logo-nav{
        height:76px;
    }

    .logo-nav img{

        width:112px;

        bottom:15px;
    }
}

</style>
</head>


<body>


<main class="remember-page">

<script>

/* =========================================================
   LIGHTBOX
   ========================================================= */

const photoCards =
    Array.from(
        document.querySelectorAll(".photo-card")
    );

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

const lightboxCounter =
    document.getElementById("lightboxCounter");

let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(index){

    currentIndex = index;

    const image =
        photoCards[currentIndex]
        .dataset.image;

    lightboxImage.src = image;

    lightboxImage.alt =
        photoCards[currentIndex]
        .querySelector("img")
        .alt;

    lightboxCounter.textContent =
        (currentIndex + 1)
        + " / "
        + photoCards.length;

    lightbox.classList.add("active");

    lightbox.setAttribute(
        "aria-hidden",
        "false"
    );
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox(){

    lightbox.classList.remove("active");

    lightbox.setAttribute(
        "aria-hidden",
        "true"
    );

    lightboxImage.src = "";
}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage(){

    currentIndex =
        (currentIndex + 1)
        % photoCards.length;

    openLightbox(currentIndex);
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage(){

    currentIndex =
        (currentIndex - 1 + photoCards.length)
        % photoCards.length;

    openLightbox(currentIndex);
}


/* =========================================================
   PHOTO CLICK
   ========================================================= */

photoCards.forEach(
    (card,index) => {

        card.addEventListener(
            "click",
            () => openLightbox(index)
        );

    }
);


/* =========================================================
   BUTTONS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* =========================================================
   CLOSE BY CLICKING OUTSIDE
   ========================================================= */

lightbox.addEventListener(
    "click",
    (event) => {

        if(event.target === lightbox){

            closeLightbox();

        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if(
            !lightbox.classList.contains("active")
        ){
            return;
        }

        if(event.key === "Escape"){
            closeLightbox();
        }

        if(event.key === "ArrowRight"){
            nextImage();
        }

        if(event.key === "ArrowLeft"){
            previousImage();
        }

    }
);


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

let touchStartX = 0;
let touchEndX = 0;


lightbox.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {passive:true}
);


lightbox.addEventListener(
    "touchend",
    (event) => {

        touchEndX =
            event.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;

        if(Math.abs(distance) < 50){
            return;
        }

        if(distance < 0){

            nextImage();

        }else{

            previousImage();

        }

    },
    {passive:true}
);

</script>
