<!DOCTYPE html>

<title>303 Oyster Bay • Remember</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#e8d8bd;
    color:#463322;
    font-family:Georgia,"Times New Roman",serif;
}


/* =========================================================
   SAND PAGE
   ========================================================= */

.remember-page{
    position:relative;

    width:100%;
    height:100svh;
    min-height:100svh;

    overflow:hidden;

    background-image:url("sand-background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}


/* =========================================================
   TOP AREA
   ========================================================= */

.page-header{
    position:relative;
    width:100%;
    height:108px;
}


/* =========================================================
   SALT • SAND • STORIES
   HAND-WRITTEN / PRESSED INTO THE SAND
   ========================================================= */

.sand-stories{

    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    width:220px;

    text-align:center;

    font-family:
        "Bradley Hand",
        "Chalkboard SE",
        "Marker Felt",
        "Segoe Print",
        cursive;

    font-size:28px;

    font-weight:500;

    line-height:.98;

    letter-spacing:1.4px;

    color:rgba(92,61,37,.66);

    /*
       Raised light edge + recessed dark edge.
       This makes the lettering look pressed into
       the sand rather than printed on it.
    */

    text-shadow:
        1px 1px 0 rgba(255,248,229,.78),
        2px 2px 2px rgba(86,56,33,.18),
        -1px -1px 0 rgba(80,50,29,.42);

    z-index:8;
}

.sand-stories span{
    display:block;
}


/* =========================================================
   AIRBNB GUEST FAVOURITE
   ========================================================= */

.guest-favourite-link{

    position:absolute;

    top:7px;
    right:8px;

    width:72px;

    display:block;

    z-index:15;

    text-decoration:none;
}

.guest-favourite{

    display:block;

    width:72px;
    height:auto;

    margin:0;
    padding:0;

    border:0;

    background:transparent;

    box-shadow:none;
}


/* =========================================================
   GALLERY AREA
   ========================================================= */

.remember-content{

    position:relative;

    width:100%;

    height:calc(100svh - 108px - 82px);

    overflow:hidden;

    padding-left:13px;
    padding-right:0;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category{
    width:100%;
    margin-bottom:8px;
}

.category-title{

    margin-bottom:4px;

    font-size:13px;

    font-weight:normal;

    letter-spacing:1.3px;

    color:#463322;
}


/* =========================================================
   HORIZONTAL PHOTO ROW
   ========================================================= */

.photo-row{

    display:flex;

    flex-wrap:nowrap;

    gap:7px;

    width:100%;

    overflow-x:auto;
    overflow-y:hidden;

    padding-right:4px;

    scrollbar-width:none;
    -ms-overflow-style:none;

    -webkit-overflow-scrolling:touch;
}

.photo-row::-webkit-scrollbar{
    display:none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card{

    flex:0 0 96px;

    width:96px;
    height:88px;

    padding:5px 5px 13px;

    border:0;
    border-radius:9px;

    background:#f4ead7;

    box-shadow:
        0 2px 5px rgba(70,42,20,.18);

    cursor:pointer;

    appearance:none;
    -webkit-appearance:none;
}

.photo-card img{

    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:6px;
}


/* =========================================================
   303 OYSTER BAY LOGO
   ---------------------------------------------------------
   IMPORTANT:
   THIS IS PART OF THE SAND BACKGROUND.
   IT IS NOT INSIDE THE NAVIGATION.
   ========================================================= */

.sand-logo{

    position:absolute;

    left:50%;

    bottom:24px;

    transform:translateX(-50%);

    width:145px;

    height:auto;

    z-index:12;

    pointer-events:none;

    filter:
        drop-shadow(
            0 2px 2px rgba(55,38,24,.16)
        );
}


/* =========================================================
   BOTTOM NAVIGATION
   ---------------------------------------------------------
   ONLY FOUR NAV ITEMS:
   HOME | STAY | LIVE | EXPLORE

   THE CENTRE LOGO IS NOT HERE.
   ========================================================= */

.bottom-nav{

    position:absolute;

    left:0;
    right:0;

    bottom:7px;

    height:57px;

    z-index:30;

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr;

    gap:5px;

    padding:0 7px;

    pointer-events:none;
}


/* =========================================================
   INDIVIDUAL NAV BANDS
   ========================================================= */

.nav-item{

    height:57px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    text-decoration:none;

    color:#463322;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:10px;

    letter-spacing:.45px;

    background:rgba(248,239,220,.90);

    border-radius:7px;

    border:1px solid rgba(255,250,238,.28);

    box-shadow:
        0 1px 3px rgba(70,42,20,.10);

    pointer-events:auto;
}


/* =========================================================
   NAV ICONS
   ========================================================= */

.nav-icon{

    width:24px;
    height:24px;

    fill:none;

    stroke:#463322;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(25,18,11,.94);

    padding:20px;
}

.lightbox.active{
    display:flex;
}

.lightbox-image{

    max-width:94vw;
    max-height:88vh;

    object-fit:contain;

    border-radius:3px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.45);
}

.lightbox-close,
.lightbox-prev,
.lightbox-next{

    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    background:transparent;

    color:#fff;

    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;

    z-index:110;
}

.lightbox-close{

    top:15px;
    right:20px;

    width:42px;
    height:42px;

    font-size:34px;
}

.lightbox-prev,
.lightbox-next{

    top:50%;

    transform:translateY(-50%);

    width:48px;
    height:70px;

    font-size:48px;
}

.lightbox-prev{
    left:8px;
}

.lightbox-next{
    right:8px;
}

.lightbox-counter{

    position:absolute;

    bottom:16px;
    left:50%;

    transform:translateX(-50%);

    color:#fff;

    font-family:Arial,Helvetica,sans-serif;

    font-size:13px;

    opacity:.85;
}

<script>

/* =========================================================
   LIGHTBOX
   ========================================================= */

const photoCards =
    Array.from(
        document.querySelectorAll(".photo-card")
    );

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");

const lightboxCounter =
    document.getElementById("lightboxCounter");

let currentIndex = 0;


/* OPEN */

function openLightbox(index){

    currentIndex = index;

    const image =
        photoCards[currentIndex]
        .dataset.image;

    lightboxImage.src = image;

    lightboxImage.alt =
        photoCards[currentIndex]
        .querySelector("img")
        .alt;

    lightboxCounter.textContent =
        (currentIndex + 1)
        + " / "
        + photoCards.length;

    lightbox.classList.add("active");

    lightbox.setAttribute(
        "aria-hidden",
        "false"
    );
}


/* CLOSE */

function closeLightbox(){

    lightbox.classList.remove("active");

    lightbox.setAttribute(
        "aria-hidden",
        "true"
    );

    lightboxImage.src = "";
}


/* NEXT */

function nextImage(){

    currentIndex =
        (currentIndex + 1)
        % photoCards.length;

    openLightbox(currentIndex);
}


/* PREVIOUS */

function previousImage(){

    currentIndex =
        (currentIndex - 1 + photoCards.length)
        % photoCards.length;

    openLightbox(currentIndex);
}


/* PHOTO CLICK */

photoCards.forEach(
    (card,index) => {

        card.addEventListener(
            "click",
            () => openLightbox(index)
        );

    }
);


/* BUTTONS */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* OUTSIDE CLICK */

lightbox.addEventListener(
    "click",
    (event) => {

        if(event.target === lightbox){
            closeLightbox();
        }

    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    (event) => {

        if(
            !lightbox.classList.contains("active")
        ){
            return;
        }

        if(event.key === "Escape"){
            closeLightbox();
        }

        if(event.key === "ArrowRight"){
            nextImage();
        }

        if(event.key === "ArrowLeft"){
            previousImage();
        }

    }
);


/* TOUCH SWIPE */

let touchStartX = 0;

lightbox.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {passive:true}
);

lightbox.addEventListener(
    "touchend",
    (event) => {

        const touchEndX =
            event.changedTouches[0].screenX;

        const distance =
            touchEndX - touchStartX;

        if(Math.abs(distance) < 50){
            return;
        }

        if(distance < 0){
            nextImage();
        }
        else{
            previousImage();
        }

    },
    {passive:true}
);

</script>
