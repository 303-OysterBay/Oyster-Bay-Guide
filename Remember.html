    href="index.html"
    class="sand-logo"
    aria-label="303 Oyster Bay Home"
>

    <img
        src="logo.png"
        alt="303 Oyster Bay"
    >

</a>


<!-- =====================================================
     LIGHTBOX
     ===================================================== -->

<div
    class="lightbox"
    id="lightbox"
>

    <button
        class="lightbox-close"
        id="lightboxClose"
        aria-label="Close"
    >
        ×
    </button>

    <button
        class="lightbox-arrow lightbox-prev"
        id="lightboxPrev"
        aria-label="Previous"
    >
        ‹
    </button>

    <img
        class="lightbox-image"
        id="lightboxImage"
        src=""
        alt=""
    >

    <button
        class="lightbox-arrow lightbox-next"
        id="lightboxNext"
        aria-label="Next"
    >
        ›
    </button>

</div>


<script>

/* =========================================================
   GALLERY DATA
   ========================================================= */

const galleryData = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "Living1.jpg",
        "Living2.jpg",
        "Living3.jpg",
        "Living4.jpg",
        "Living5.jpg",
        "Living6.jpg",
        "Living7.jpg"
    ],

    "Bedroom": [
        "Bedroom1.jpg",
        "Bedroom2.jpg",
        "Bedroom3.jpg",
        "Bedroom4.jpg",
        "Bedroom5.jpg",
        "Bedroom6.jpg",
        "Bedroom7.jpg"
    ],

    "Kitchen": [
        "Kitchen1.jpg",
        "Kitchen2.jpg",
        "Kitchen3.jpg",
        "Kitchen4.jpg",
        "Kitchen5.jpg",
        "Kitchen6.jpg",
        "Kitchen7.jpg",
        "Kitchen8.jpg"
    ]

};


/* =========================================================
   LIGHTBOX
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");


let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN
   ========================================================= */

function openLightbox(category, index) {

    currentCategory = category;

    currentIndex = index;

    lightboxImage.src =
        galleryData[category][index];

    lightboxImage.alt =
        category + " " + (index + 1);

    lightbox.classList.add("active");
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    lightboxImage.src = "";
}


/* =========================================================
   NEXT
   ========================================================= */

function showNext() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex + 1) % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function showPrevious() {

    const images =
        galleryData[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length)
        % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PHOTO CLICK
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                openLightbox(
                    card.dataset.category,
                    Number(card.dataset.index)
                );

            }
        );

    });


/* =========================================================
   CONTROLS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    showNext
);

lightboxPrev.addEventListener(
    "click",
    showPrevious
);


/* =========================================================
   CLICK OUTSIDE IMAGE
   ========================================================= */

lightbox.addEventListener(
    "click",
    event => {

        if (event.target === lightbox) {
            closeLightbox();
        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (!lightbox.classList.contains("active")) {
            return;
        }

        if (event.key === "Escape") {
            closeLightbox();
        }

        if (event.key === "ArrowRight") {
            showNext();
        }

        if (event.key === "ArrowLeft") {
            showPrevious();
        }

    }
);


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

let touchStartX = 0;

lightbox.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);


lightbox.addEventListener(
    "touchend",
    event => {

        const difference =
            event.changedTouches[0].screenX
            - touchStartX;

        if (Math.abs(difference) < 40) {
            return;
        }

        if (difference < 0) {
            showNext();
        } else {
            showPrevious();
        }

    },
    { passive: true }
);

</script>

</main>

</body>
</html>
