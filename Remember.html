<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>303 OYSTER BAY • Remember</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    color: #463322;
    font-family: Georgia, "Times New Roman", serif;
    background: #e8d8bd;
    overflow-x: hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.remember-page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    padding-bottom: 105px;

    background-image: url("sand-background.jpg");
    background-size: cover;
    background-position: center top;
    background-repeat: repeat-y;
}


/* =========================================================
   SALT SAND STORIES
   ========================================================= */

.salt-stories {
    display: block;

    width: 250px;
    max-width: 68vw;
    height: auto;

    margin: 9px auto 7px auto;
}


/* =========================================================
   CONTENT
   ========================================================= */

.remember-content {
    width: 100%;
    padding: 0 0 0 18px;
}


/* =========================================================
   CATEGORY
   ========================================================= */

.category {
    width: 100%;
    margin-bottom: 17px;
}


/* =========================================================
   SECTION TITLE
   ========================================================= */

.category-title {
    margin: 0 0 5px 0;
    padding: 0;

    color: #463322;

    font-size: 17px;
    font-weight: normal;
    letter-spacing: 0.2px;
    line-height: 1.05;
}


/* =========================================================
   PHOTO ROW
   ========================================================= */

.photo-row {
    display: flex;
    flex-wrap: nowrap;

    gap: 9px;

    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    padding: 0 15px 3px 0;

    scrollbar-width: none;
    -ms-overflow-style: none;

    -webkit-overflow-scrolling: touch;
}

.photo-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

.photo-card {
    flex: 0 0 145px;

    width: 145px;
    height: 130px;

    padding: 6px 6px 12px;

    border: 1px solid rgba(255,255,255,0.72);
    border-radius: 15px;

    background: #f4ead7;

    box-shadow:
        0 3px 7px rgba(70,42,20,0.18);

    cursor: pointer;

    appearance: none;
    -webkit-appearance: none;
}

.photo-card img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 10px;
}


/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: 96px;

    z-index: 50;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding: 0 12px 5px;

    background:
        linear-gradient(
            to bottom,
            rgba(232,216,189,0),
            rgba(232,216,189,0.80) 25%,
            rgba(232,216,189,0.96) 55%,
            rgba(232,216,189,1) 100%
        );
}


/* =========================================================
   HORIZONTAL RULES
   STOP BEFORE THE LOGO
   ========================================================= */

.bottom-nav::before {

    content: "";

    position: absolute;

    left: 14px;
    right: calc(50% + 55px);

    top: 18px;

    height: 1px;

    background: rgba(70,51,34,0.55);
}


.bottom-nav::after {

    content: "";

    position: absolute;

    left: calc(50% + 55px);
    right: 14px;

    top: 18px;

    height: 1px;

    background: rgba(70,51,34,0.55);
}


/* =========================================================
   LEFT / RIGHT NAV GROUPS
   ========================================================= */

.nav-side {

    position: relative;

    z-index: 3;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    width: 100%;
    max-width: 170px;

    height: 67px;
}


/* =========================================================
   NAV ITEMS
   ========================================================= */

.nav-item {

    position: relative;

    width: 50%;
    height: 62px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: flex-end;

    gap: 4px;

    text-decoration: none;

    color: #463322;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 10px;

    line-height: 1;
}


/* =========================================================
   DIVIDER BETWEEN HOME / STAY
   ========================================================= */

.left-nav .nav-item + .nav-item {

    border-left:
        1px solid
        rgba(70,51,34,0.36);
}


/* =========================================================
   DIVIDER BETWEEN STAY / LOGO
   ========================================================= */

.left-nav .nav-item:last-child {

    border-right:
        1px solid
        rgba(70,51,34,0.36);
}


/* =========================================================
   DIVIDER BETWEEN LOGO / LIVE
   ========================================================= */

.right-nav .nav-item:first-child {

    border-left:
        1px solid
        rgba(70,51,34,0.36);
}


/* =========================================================
   DIVIDER BETWEEN LIVE / EXPLORE
   ========================================================= */

.right-nav .nav-item + .nav-item {

    border-left:
        1px solid
        rgba(70,51,34,0.36);
}


/* =========================================================
   ICONS
   ========================================================= */

.nav-icon {

    width: 23px;
    height: 23px;

    fill: none;

    stroke: #463322;

    stroke-width: 1.8;

    stroke-linecap: round;
    stroke-linejoin: round;
}


/* =========================================================
   CENTRAL LOGO
   ========================================================= */

.logo-wrap {

    position: relative;

    z-index: 6;

    flex: 0 0 110px;

    height: 69px;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    background:
        rgba(232,216,189,0.94);
}


.logo-wrap img {

    display: block;

    width: 104px;
    max-width: 100%;

    height: auto;
}


/* =========================================================
   LIGHTBOX
   ========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(35,25,16,0.92);

    z-index: 100;
}

.lightbox.active {
    display: flex;
}


.lightbox-image {

    max-width: 88vw;
    max-height: 82vh;

    object-fit: contain;

    border-radius: 8px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35);
}


/* =========================================================
   LIGHTBOX BUTTONS
   ========================================================= */

.lightbox-close,
.lightbox-arrow {

    position: absolute;

    border: none;
    border-radius: 50%;

    background:
        rgba(244,234,215,0.95);

    color: #463322;

    text-align: center;

    cursor: pointer;
}


.lightbox-close {

    top: 18px;
    right: 20px;

    width: 42px;
    height: 42px;

    font-size: 25px;
    line-height: 42px;
}


.lightbox-arrow {

    top: 50%;

    transform: translateY(-50%);

    width: 44px;
    height: 44px;

    font-size: 27px;
    line-height: 44px;
}


.lightbox-prev {
    left: 14px;
}

.lightbox-next {
    right: 14px;
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 700px) {

    .salt-stories {
        width: 330px;
        max-width: 42vw;
        margin: 15px auto 8px;
    }


    .remember-content {
        padding-left: 40px;
        padding-right: 20px;
    }


    .category {
        margin-bottom: 28px;
    }


    .category-title {
        font-size: 22px;
        margin-bottom: 7px;
    }


    .photo-row {
        gap: 13px;
    }


    .photo-card {
        flex-basis: 180px;
        width: 180px;
        height: 160px;

        padding: 8px 8px 15px;

        border-radius: 18px;
    }


    .bottom-nav {

        height: 112px;

        padding-left: 25px;
        padding-right: 25px;
        padding-bottom: 8px;
    }


    .bottom-nav::before {

        left: 5%;
        right: calc(50% + 70px);

        top: 22px;
    }


    .bottom-nav::after {

        left: calc(50% + 70px);
        right: 5%;

        top: 22px;
    }


    .nav-side {

        max-width: 250px;
        height: 80px;
    }


    .nav-item {

        height: 74px;

        font-size: 12px;

        gap: 5px;
    }


    .nav-icon {

        width: 27px;
        height: 27px;
    }


    .logo-wrap {

        flex-basis: 140px;
        height: 86px;
    }


    .logo-wrap img {

        width: 130px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

    }


    .logo-wrap {

        height: 66px;
    }


    .logo-wrap img {

        width: 94px;
    }
}

</style>

<script>

/* =========================================================
   IMAGE COLLECTION
   ========================================================= */

const galleries = {

    "Sea Views": [
        "Sea View1.jpg",
        "Sea View2.jpg",
        "Sea View3.jpg",
        "Sea View4.jpg",
        "Sea View5.jpg"
    ],

    "Living": [
        "Living1.jpg",
        "Living2.jpg",
        "Living3.jpg",
        "Living4.jpg",
        "Living5.jpg",
        "Living6.jpg",
        "Living7.jpg"
    ],

    "Bedroom": [
        "Bedroom1.jpg",
        "Bedroom2.jpg",
        "Bedroom3.jpg",
        "Bedroom4.jpg",
        "Bedroom5.jpg",
        "Bedroom6.jpg",
        "Bedroom7.jpg"
    ],

    "Kitchen": [
        "Kitchen1.jpg",
        "Kitchen2.jpg",
        "Kitchen3.jpg",
        "Kitchen4.jpg",
        "Kitchen5.jpg",
        "Kitchen6.jpg",
        "Kitchen7.jpg",
        "Kitchen8.jpg"
    ]

};


/* =========================================================
   LIGHTBOX
   ========================================================= */

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxClose =
    document.getElementById("lightboxClose");

const lightboxPrev =
    document.getElementById("lightboxPrev");

const lightboxNext =
    document.getElementById("lightboxNext");


let currentCategory = "";
let currentIndex = 0;


/* =========================================================
   OPEN IMAGE
   ========================================================= */

function openLightbox(category, index) {

    currentCategory = category;
    currentIndex = index;

    lightboxImage.src =
        galleries[category][index];

    lightboxImage.alt =
        category + " " + (index + 1);

    lightbox.classList.add("active");

    document.body.style.overflow = "hidden";
}


/* =========================================================
   CLOSE
   ========================================================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    document.body.style.overflow = "";

}


/* =========================================================
   NEXT
   ========================================================= */

function nextImage() {

    const images =
        galleries[currentCategory];

    currentIndex =
        (currentIndex + 1) % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousImage() {

    const images =
        galleries[currentCategory];

    currentIndex =
        (currentIndex - 1 + images.length)
        % images.length;

    lightboxImage.src =
        images[currentIndex];
}


/* =========================================================
   PHOTO CLICK
   ========================================================= */

document
    .querySelectorAll(".photo-card")
    .forEach(function(card) {

        card.addEventListener("click", function() {

            openLightbox(
                card.dataset.category,
                Number(card.dataset.index)
            );

        });

    });


/* =========================================================
   CONTROLS
   ========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightboxNext.addEventListener(
    "click",
    nextImage
);

lightboxPrev.addEventListener(
    "click",
    previousImage
);


/* =========================================================
   BACKDROP CLICK
   ========================================================= */

lightbox.addEventListener(
    "click",
    function(event) {

        if (event.target === lightbox) {
            closeLightbox();
        }

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!lightbox.classList.contains("active")) {
            return;
        }

        if (event.key === "Escape") {
            closeLightbox();
        }

        if (event.key === "ArrowRight") {
            nextImage();
        }

        if (event.key === "ArrowLeft") {
            previousImage();
        }

    }
);

</script>
