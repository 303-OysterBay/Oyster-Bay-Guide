<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>303 OYSTER BAY • Salt Sand Stories</title>

<style>
/* =========================================================
   303 OYSTER BAY — FINAL GLOBAL STYLE FRAMEWORK
   Keep this framework unchanged for future guide pages.
   Change page content and section headings only.
   ========================================================= */

:root {
    --sand: #e8d8bd;
    --ink: #463322;
    --frame: rgba(248, 240, 223, 0.88);
    --frame-left: 12px;
    --frame-right: 12px;
    --frame-top: 40px;
    --frame-bottom: 90px;
    --frame-radius: 16px;
    --frame-shadow: 0 3px 10px rgba(70, 42, 20, 0.13);
    --top-nav-width: 105%;
    --bottom-nav-height: 135px;
    --bottom-hotspot-height: 110px;
    --logo-width: 125px;
    --logo-bottom: 20px;
    --guest-badge-width: 92px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

html {
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
    overscroll-behavior-y: none;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--sand);
    color: var(--ink);
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
}

body::-webkit-scrollbar {
    width: 0;
    height: 0;
}

.guide-page {
    width: 100%;
    min-height: 100%;
}

.guide-section {
    position: relative;
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background-image: url("sand-background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* BEIGE CONTENT FRAME */
.guide-placeholder {
    position: absolute;
    left: var(--frame-left);
    right: var(--frame-right);
    top: var(--frame-top);
    bottom: var(--frame-bottom);
    padding: 12px 18px 14px;
    background: var(--frame);
    border-radius: var(--frame-radius);
    box-shadow: var(--frame-shadow);
    overflow: hidden;
    z-index: 10;
}

/* SECTION HEADING */
.guide-placeholder h2 {
    margin: 0;
    padding: 0;
    font-size: 22px;
    font-weight: normal;
    line-height: 1.05;
    letter-spacing: 1.5px;
    color: var(--ink);
    text-align: center;
}

/* TOP NAVIGATION ARTWORK */
.top-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    z-index: 200;
    pointer-events: none;
}

.top-nav-art {
    display: block;
    width: var(--top-nav-width);
    height: auto;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    opacity: 1;
    z-index: 220;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
}

/* TOP NAVIGATION CLICK AREAS */
.top-nav-hit {
    position: absolute;
    top: 0;
    height: 28%;
    z-index: 230;
    display: block;
    pointer-events: auto;
    border: 0;
    background: transparent;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.top-nav-story {
    left: 0;
    width: 21%;
}

.top-nav-bedrooms {
    left: 21%;
    width: 21%;
}

.top-nav-kitchen {
    left: 42%;
    width: 16%;
}

.top-nav-manuals {
    left: 60%;
    width: 21%;
}

.top-nav-rules {
    right: 0;
    width: 19%;
}

/* DROPDOWNS — CLOSED INITIALLY */
.top-nav-dropdown-holder {
    position: absolute;
    top: 0;
    height: 28%;
    pointer-events: auto;
    z-index: 240;
}

.bedrooms-holder {
    left: 21%;
    width: 21%;
}

.manuals-holder {
    left: 60%;
    width: 21%;
}

.dropdown {
    position: absolute;
    top: 100%;
    left: 8%;
    width: 180px;
    max-width: 85vw;
    padding: 6px;
    border-radius: 12px;
    background: rgba(248, 240, 223, 0.97);
    border: 1px solid rgba(112, 69, 31, 0.28);
    box-shadow: 0 5px 14px rgba(70, 42, 20, 0.20);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-5px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
    pointer-events: none;
}

.manuals-holder .dropdown {
    width: 245px;
}

.top-nav-dropdown-holder.open .dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
}

.dropdown a {
    display: block;
    padding: 12px 10px;
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.3;
    border-bottom: 1px solid rgba(112, 69, 31, 0.16);
}

.dropdown a:last-child {
    border-bottom: none;
}

.dropdown a:active {
    background: rgba(200, 180, 145, 0.25);
}

/* GUEST FAVOURITE BADGE */
.guest-favourite-link {
    position: absolute;
    top: 5px;
    right: 6px;
    width: var(--guest-badge-width);
    max-width: none;
    height: auto;
    z-index: 20;
    display: block;
}

.guest-favourite {
    display: block;
    width: 100%;
    height: auto;
}

/* FIXED BOTTOM NAVIGATION ARTWORK */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: var(--bottom-nav-height);
    z-index: 30;
    pointer-events: none;
}

.bottom-nav-image {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
}

/* BOTTOM NAVIGATION CLICK AREAS */
.nav-hotspot {
    position: absolute;
    bottom: 0;
    height: var(--bottom-hotspot-height);
    z-index: 45;
    display: block;
    background: transparent;
    border: 0;
    text-decoration: none;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
}

.hotspot-home {
    left: 0;
    width: 17%;
}

.hotspot-stay {
    left: 17%;
    width: 18%;
}

.hotspot-live {
    right: 18%;
    width: 18%;
}

.hotspot-explore {
    right: 0;
    width: 18%;
}

/* FIXED CENTRAL LOGO */
.sand-logo {
    position: fixed;
    left: 50%;
    bottom: var(--logo-bottom);
    transform: translateX(-50%);
    width: var(--logo-width);
    z-index: 40;
    display: block;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
}

.sand-logo img {
    display: block;
    width: 100%;
    height: auto;
}

/* CONTENT AREA — HEADING POSITION */
.section-content {
    position: absolute;
    inset: 0;
    padding: 24px 100px 12px;
    overflow: auto;
}

/* RESPONSIVE RULES */
@media (max-width: 600px) {
    .guide-placeholder h2 {
        font-size: 22px;
    }

    .dropdown {
        width: 155px;
    }

    .manuals-holder .dropdown {
        width: 205px;
    }

    .dropdown a {
        padding: 11px 8px;
        font-size: 13px;
    }
}
</style>
</head>

<script>
/* DROPDOWN INTERACTION — BOTH MENUS START CLOSED */
function closeDropdowns() {
    document.querySelectorAll(".top-nav-dropdown-holder")
        .forEach(holder => holder.classList.remove("open"));

    document.querySelectorAll(".top-nav-hit[aria-expanded]")
        .forEach(button => button.setAttribute("aria-expanded", "false"));
}

function toggleDropdown(holderId, button) {
    const holder = document.getElementById(holderId);
    const wasOpen = holder.classList.contains("open");

    closeDropdowns();

    if (!wasOpen) {
        holder.classList.add("open");
        button.setAttribute("aria-expanded", "true");
    }
}

document.addEventListener("click", function(event) {
    if (!event.target.closest(".top-nav")) {
        closeDropdowns();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeDropdowns();
    }
});

document.querySelectorAll(".dropdown a").forEach(link => {
    link.addEventListener("click", closeDropdowns);
});
</script>
