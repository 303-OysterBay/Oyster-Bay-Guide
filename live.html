
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salt Sand Stories | Live</title>

<style>
/* =====================================================
   SHARED PAGE FRAMEWORK
   Keep these global layout values consistent with Arrival.
   Change section content inside the beige frames only.
   ===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

html {
  scroll-behavior: smooth;
  scroll-snap-type: y mandatory;
  overscroll-behavior-y: none;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #e8d8bd;
  color: #463322;
  overflow-x: hidden;
  overflow-y: auto;
}

.guide-page {
  width: 100%;
  min-height: 100%;
}

.guide-section {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  background-image: url("sand-background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* The beige frame: same dimensions and treatment as Arrival */

.arrival-content {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 40px;
  bottom: 90px;
  background: rgba(248, 240, 223, 0.88);
  border-radius: 16px;
  padding: 12px 18px 4px;
  overflow: hidden;
  z-index: 10;
  box-shadow: 0 3px 10px rgba(70, 42, 20, 0.13);
}

/* Heading: same structure and typography as Arrival */

.arrival-header {
  width: 100%;
  text-align: center;
  padding: 2px 100px 0;
  margin-bottom: 5px;
}

.arrival-title {
  font-size: 27px;
  font-weight: normal;
  line-height: 1.05;
  letter-spacing: 1.5px;
  color: #463322;
  margin-bottom: 7px;
}

/* Guest Favourite badge */

.guest-favourite-link {
  position: absolute;
  top: 5px;
  right: 6px;
  width: 92px;
  max-width: none;
  height: auto;
  z-index: 20;
  display: block;
}

.guest-favourite {
  display: block;
  width: 100%;
  height: auto;
}

/* =====================================================
   TOP NAVIGATION
   Same positioning as Arrival.
   Live artwork opacity is the only intended visual change.
   ===================================================== */

.top-nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  z-index: 200;
  pointer-events: none;
}

.top-nav-art {
  display: block;
  width: 105%;
  height: auto;
  position: relative;
  left: 50%;
  z-index: 220;
  transform: translate(-50%, -47px);
  opacity: 0.6;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* Transparent clickable areas over the navigation artwork */

.top-nav-hit {
  position: absolute;
  top: 0;
  height: 58px;
  display: block;
  border: 0;
  padding: 0;
  background: transparent;
  color: transparent;
  cursor: pointer;
  z-index: 230;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
}

/* Adjust these hit areas only if the artwork's labels require it. */

.top-nav-story {
  left: 2%;
  width: 15%;
}

.top-nav-bedrooms {
  left: 18%;
  width: 19%;
}

.top-nav-kitchen {
  left: 38%;
  width: 15%;
}

.top-nav-manuals {
  left: 54%;
  width: 19%;
}

.top-nav-rules {
  left: 74%;
  width: 23%;
}

/* Dropdown menus */

.top-nav-dropdown-holder {
  position: absolute;
  top: 45px;
  z-index: 240;
  display: none;
  min-width: 150px;
  pointer-events: auto;
}

.top-nav-dropdown-holder.open {
  display: block;
}

.bedrooms-holder {
  left: 19%;
}

.manuals-holder {
  left: 55%;
}

.dropdown {
  display: flex;
  flex-direction: column;
  gap: 0;
  min-width: 165px;
  padding: 6px 0;
  background: rgba(248, 240, 223, 0.97);
  border: 1px solid rgba(70, 51, 34, 0.22);
  border-radius: 8px;
  box-shadow: 0 4px 12px rgba(70, 42, 20, 0.16);
}

.dropdown a {
  display: block;
  padding: 10px 13px;
  color: #463322;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;
  line-height: 1.25;
  text-decoration: none;
  white-space: nowrap;
}

.dropdown a:hover,
.dropdown a:focus {
  background: rgba(232, 216, 189, 0.7);
}

/* =====================================================
   BOTTOM NAVIGATION
   Same measurements and positions as Arrival.
   ===================================================== */

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 135px;
  z-index: 30;
  pointer-events: none;
}

.bottom-nav-image {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

.sand-logo {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  width: 125px;
  z-index: 40;
  display: block;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
}

.sand-logo img {
  display: block;
  width: 100%;
  height: auto;
}

.nav-hotspot {
  position: absolute;
  bottom: 0;
  height: 110px;
  z-index: 45;
  display: block;
  background: transparent;
  border: 0;
  text-decoration: none;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
}

.hotspot-home {
  left: 0;
  width: 17%;
}

.hotspot-stay {
  left: 17%;
  width: 18%;
}

.hotspot-live {
  right: 18%;
  width: 18%;
}

.hotspot-explore {
  right: 0;
  width: 18%;
}

/* =====================================================
   RESPONSIVE HEADING SPACING
   ===================================================== */

@media (max-width: 600px) {
  .arrival-header {
    padding-left: 55px;
    padding-right: 55px;
  }

  .arrival-title {
    font-size: 25px;
  }

  .top-nav-hit {
    height: 48px;
  }

  .top-nav-dropdown-holder {
    top: 38px;
  }

  .dropdown a {
    font-size: 13px;
    padding: 9px 11px;
  }
}

@media (max-width: 390px) {
  .arrival-header {
    padding-left: 45px;
    padding-right: 45px;
  }

  .arrival-title {
    font-size: 23px;
    letter-spacing: 1.2px;
  }

  .guest-favourite-link {
    width: 78px;
  }
}

@media (max-width: 360px) {
  .arrival-header {
    padding-left: 36px;
    padding-right: 36px;
  }

  .arrival-title {
    font-size: 21px;
    letter-spacing: 1px;
  }
}

/* Respect reduced-motion preferences */

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}
</style>
</head>

<body>

<nav class="top-nav" aria-label="Live Guide navigation">

  <img

<!-- BOTTOM NAVIGATION -->

<div class="bottom-nav" aria-hidden="true">
  <img

    alt="">

<a class="sand-logo" href="index.html" aria-label="303 Oyster Bay Home">

</a>

<nav aria-label="Main navigation">

     class="nav-hotspot hotspot-home"
     aria-label="Home"></a>

<script>
function closeDropdowns() {
  document
    .querySelectorAll(".top-nav-dropdown-holder")
    .forEach(function (holder) {
      holder.classList.remove("open");
    });

  document
    .querySelectorAll(".top-nav-hit[aria-expanded]")
    .forEach(function (button) {
      button.setAttribute("aria-expanded", "false");
    });
}

function toggleDropdown(holderId, button) {
  const holder = document.getElementById(holderId);
  if (!holder) return;

  const wasOpen = holder.classList.contains("open");

  closeDropdowns();

  if (!wasOpen) {
    holder.classList.add("open");
    button.setAttribute("aria-expanded", "true");
  }
}

document.addEventListener("click", function (event) {
  if (!event.target.closest(".top-nav")) {
    closeDropdowns();
  }
});

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    closeDropdowns();
  }
});

document.querySelectorAll(".dropdown a").forEach(function (link) {
  link.addEventListener("click", closeDropdowns);
});
</script>

</body>
</html>
